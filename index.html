// vowel each mark adds to a carrier consonant (sukun adds none)
const HARA_VOWEL = { "\u064E": "a", "\u0650": "i", "\u064F": "u", "\u0652": "", "\u064B": "an", "\u064D": "in", "\u064C": "un" };
const QUIZ_CARRIERS = [["ب", "b"], ["ت", "t"], ["د", "d"], ["ر", "r"], ["س", "s"], ["ك", "k"], ["ل", "l"], ["م", "m"], ["ن", "n"], ["ف", "f"]];
function carrierSound(consonant, markCh) { const v = HARA_VOWEL[markCh]; return v ? consonant + v : consonant; }
function sukunNote(mk) { return mk && mk.ch === "\u0652" ? " (no vowel)" : ""; }

// Quiz: match a marked letter to how it's pronounced, and vice-versa.
function HarakatQuiz({ marks, onDone, onSet, harakat = {} }) {
  const makeQ = (ans) => {
    const [g, c] = QUIZ_CARRIERS[Math.floor(Math.random() * QUIZ_CARRIERS.length)];
    const dir = Math.random() < 0.5 ? "read" : "write";
    const distract = shuffle(marks.filter((x) => x.ch !== ans.ch)).slice(0, 3);
    const options = shuffle([ans, ...distract]).map((mk) => ({ mark: mk, sound: carrierSound(c, mk.ch), written: g + mk.ch }));
    return { dir, g, c, answer: ans, options };
  };
  const [queue, setQueue] = useState(() => shuffle(marks));
  const [streak, setStreak] = useState({});
  const [missed, setMissed] = useState({}); // ever missed this session
  const [q, setQ] = useState(() => (marks.length ? makeQ(shuffle(marks)[0]) : null));
  const [pick, setPick] = useState(null);
  const [feedback, setFeedback] = useState(false);
  const [done, setDone] = useState(marks.length === 0);

  const cur = queue[0];
  const total = marks.length;
  const masteredCount = marks.filter((m) => (streak[m.ch] || 0) >= 2).length;

  const choose = (opt) => {
    if (feedback) return;
    setPick(opt);
    setFeedback(true);
    const ok = opt.mark.ch === cur.ch;
    const newStreak = ok ? (streak[cur.ch] || 0) + 1 : 0;
    const everMissed = missed[cur.ch] || !ok;
    setStreak((s) => ({ ...s, [cur.ch]: newStreak }));
    if (!ok) setMissed((m) => ({ ...m, [cur.ch]: true }));
    // Mastery run updates on every answer; the SRS is graded once, at graduation.
    if (onSet) {
      let np = bumpRun(markProg(harakat[cur.ch]) || learnItem(Date.now()), ok);
      if (newStreak >= 2) np = reviewSchedule(np, !everMissed, Date.now());
      onSet(cur.ch, np);
    }
  };
  const next = () => {
    const st = streak[cur.ch] || 0;
    const nq = st >= 2 ? queue.slice(1) : [...queue.slice(1), cur];
    setFeedback(false);
    setPick(null);
    if (nq.length === 0) { setDone(true); return; }
    setQueue(nq);
    setQ(makeQ(nq[0]));
  };
  const retake = () => { const s = shuffle(marks); setQueue(s); setStreak({}); setMissed({}); setQ(makeQ(s[0])); setPick(null); setFeedback(false); setDone(false); };

  if (done) {
    return (
      <div className="fade pop" style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 20, padding: "40px 24px", textAlign: "center" }}>
        <div style={{ fontSize: 38, marginBottom: 8 }}>🎉</div>
        <div style={{ fontFamily: displayFont, fontSize: 22 }}>Marks mastered!</div>
        <div style={{ color: T.textDim, fontSize: 14, marginTop: 8, lineHeight: 1.5 }}>You matched every mark to its sound right twice in a row.</div>
        <button className="tap" onClick={retake} style={{ width: "100%", marginTop: 18, padding: 13, borderRadius: 13, border: `1px solid ${T.gold}`, background: `${T.gold}10`, color: T.gold, fontWeight: 700 }}>🔁 Retake</button>
        <button className="tap" onClick={onDone} style={{ width: "100%", marginTop: 10, padding: 14, borderRadius: 13, border: "none", background: `linear-gradient(135deg, ${T.gold}, ${T.terra})`, color: "#fff", fontWeight: 700 }}>Back to marks menu</button>
      </div>
    );
  }
  if (!q) return null;
  const correct = feedback && pick && pick.mark.ch === cur.ch;
  const curSound = carrierSound(q.c, cur.ch);

  return (
    <div className="fade">
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: T.goldSoft, whiteSpace: "nowrap" }}>Marks quiz</div>
        <div style={{ flex: 1, height: 4, background: T.line, borderRadius: 4, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${(masteredCount / Math.max(1, total)) * 100}%`, background: `linear-gradient(90deg, ${T.gold}, ${T.terra})`, transition: "width .3s ease" }} />
        </div>
        <div style={{ fontSize: 12, color: T.textDim, whiteSpace: "nowrap" }}>{masteredCount}/{total}</div>
      </div>

      <div style={{ background: `linear-gradient(160deg, ${T.panelHi}, ${T.panel})`, border: `1px solid ${T.line}`, borderRadius: 20, padding: "24px 18px", textAlign: "center", boxShadow: "0 12px 30px rgba(128,29,92,.08)" }}>
        {q.dir === "read" ? (
          <>
            <div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft }}>How is this pronounced?</div>
            <div style={{ fontFamily: arFont, fontSize: 64, color: T.gold, lineHeight: 1.2, marginTop: 10 }}>{q.g + cur.ch}</div>
            <div style={{ fontSize: 11.5, color: T.textDim, marginTop: 6 }}>the mark on it: <span style={{ fontFamily: arFont, fontSize: 18, color: T.text }}>{"\u25CC" + cur.ch}</span></div>
          </>
        ) : (
          <>
            <div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft }}>How is this sound written?</div>
            <div style={{ fontFamily: displayFont, fontSize: 40, color: T.gold, marginTop: 8 }}>{curSound}<span style={{ fontSize: 15, color: T.textDim }}>{sukunNote(cur)}</span></div>
            <div style={{ fontSize: 11.5, color: T.textDim, marginTop: 6 }}>pick the right mark on <span style={{ fontFamily: arFont, fontSize: 18, color: T.text }}>{q.g}</span></div>
          </>
        )}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 12 }}>
        {q.options.map((opt, idx) => {
          let bg = T.panel, border = T.line, col = T.text;
          if (feedback) {
            if (opt.mark.ch === cur.ch) { bg = `${OK_GREEN}1f`; border = OK_GREEN; col = OK_GREEN; }
            else if (pick && opt.mark.ch === pick.mark.ch) { bg = `${BAD_RED}1a`; border = BAD_RED; col = BAD_RED; }
          }
          return (
            <button key={idx} className="tap" onClick={() => choose(opt)} disabled={feedback} style={{ background: bg, border: `1.5px solid ${border}`, borderRadius: 14, padding: "16px 8px", cursor: feedback ? "default" : "pointer", minHeight: 62, display: "flex", alignItems: "center", justifyContent: "center" }}>
              {q.dir === "read" ? (
                <span style={{ fontFamily: displayFont, fontSize: 22, fontWeight: 700, color: col }}>{opt.sound}<span style={{ fontSize: 11, color: T.textDim }}>{sukunNote(opt.mark)}</span></span>
              ) : (
                <span style={{ fontFamily: arFont, fontSize: 40, color: col }}>{opt.written}</span>
              )}
            </button>
          );
        })}
      </div>

      {feedback && (
        <div className="fade" style={{ marginTop: 12, background: T.panel, border: `1.5px solid ${correct ? OK_GREEN : BAD_RED}`, borderRadius: 14, padding: "12px 14px", textAlign: "center" }}>
          <div style={{ fontSize: 16, fontWeight: 800, letterSpacing: 0.5, color: correct ? OK_GREEN : BAD_RED }}>{correct ? "CORRECT ✓" : "NOT QUITE ✗"}</div>
          <div style={{ fontSize: 11.5, fontWeight: 600, color: correct ? OK_GREEN : BAD_RED, marginTop: 1 }}>{correct ? ((streak[cur.ch] || 0) >= 2 ? "cleared! ✓✓" : "once more to clear it") : "here's how it works:"}</div>
          <div style={{ fontSize: 20, color: T.text, marginTop: 6 }}><span style={{ fontFamily: arFont, fontSize: 30 }}>{q.g + cur.ch}</span> &nbsp;=&nbsp; <b style={{ color: T.gold }}>{curSound}</b>{sukunNote(cur)}</div>
          <div style={{ fontSize: 12, color: T.textDim, marginTop: 6, lineHeight: 1.5 }}><b>{cur.name}</b> · {cur.info}</div>
        </div>
      )}

      {feedback && (
        <button className="tap" onClick={next} style={{ width: "100%", marginTop: 12, padding: 15, borderRadius: 14, border: "none", background: `linear-gradient(135deg, ${T.gold}, ${T.terra})`, color: "#fff", fontSize: 15, fontWeight: 700 }}>
          {(streak[cur.ch] || 0) >= 2 && queue.length === 1 ? "Finish" : "Next →"}
        </button>
      )}
      <button className="tap" onClick={onDone} style={{ width: "100%", marginTop: 8, padding: 10, borderRadius: 12, border: "none", background: "transparent", color: T.textDim, fontSize: 12 }}>End — back to marks menu</button>
      <div style={{ textAlign: "center", fontSize: 11, color: T.textDim, marginTop: 10, lineHeight: 1.6 }}>Match the mark to how it's pronounced — get each one right <b style={{ color: T.text }}>twice in a row</b> to clear it.</div>
    </div>
  );
}

// Conversation lessons hub: always-unlocked themed categories (levels ≥ CONV_START)

/* The Verbs tab. Each verb owns three example sentences that live in the

              <span style={{ fontFamily: arFont, fontSize: 26, color: T.text, direction: "rtl", minWidth: 62, textAlign: "right" }}>{v.ar}</span>

function ConvHub({ state, allItems, onBack, onLearn, onQuiz, onItems }) {

          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            <button className="tap" disabled={c.learned >= c.total} onClick={() => onLearn(c.l)} style={{ flex: 1, padding: 11, borderRadius: 11, border: "none", background: c.learned < c.total ? `linear-gradient(135deg, ${T.gold}, ${T.terra})` : T.line, color: c.learned < c.total ? "#fff" : T.textDim, fontWeight: 700, fontSize: 13 }}>Learn new</button>
            <button className="tap" disabled={!c.learned} onClick={() => onQuiz(c.l)} style={{ flex: 1, padding: 11, borderRadius: 11, border: `1.5px solid ${c.learned ? T.gold : T.line}`, background: c.learned ? `${T.gold}12` : "transparent", color: c.learned ? T.gold : T.textDim, fontWeight: 700, fontSize: 13 }}>Quiz learned</button>
          </div>
          <button className="tap" onClick={() => onItems(c.l)} style={{ width: "100%", marginTop: 8, padding: 9, borderRadius: 10, border: `1px dashed ${T.line}`, background: "transparent", color: T.textDim, fontSize: 12, fontWeight: 600 }}>📋 View all {c.total} items — mastery, sound, edit</button>
        </div>
      ))}
    </div>
  );
}

// Shows when ANYTHING was last pushed to the repo (app code or audio batches),
// fetched from GitHub — so the footer stays truthful even for content-only updates.
function LatestPush() {
  const [when, setWhen] = useState(null);
  useEffect(() => {
    let alive = true;
    fetch("https://api.github.com/repos/pawsncode/masri-srs/commits?per_page=1")
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => {
        const iso = j && j[0] && j[0].commit && j[0].commit.committer && j[0].commit.committer.date;
        if (alive && iso) setWhen(new Date(iso));
      })
      .catch(() => {});
    return () => { alive = false; };
  }, []);
  if (!when) return null;
  return (
    <div style={{ fontSize: 11.5, color: T.textDim, textAlign: "center", marginTop: 2 }}>
      Latest push (incl. audio): {when.toLocaleString()}
    </div>
  );
}

function HomeView({ state, level, levelPct, lessons, reviews, leeches, stageCounts, streak, onGo, onTrouble, onSetting, onTheme, onImport, onReset }) {
  const [arVoices, setArVoices] = useState([]);
  useEffect(() => {
    if (!window.speechSynthesis) return;
    const load = () => setArVoices((window.speechSynthesis.getVoices() || []).filter((v) => v.lang && v.lang.toLowerCase().startsWith("ar")));
    load();
    window.speechSynthesis.addEventListener && window.speechSynthesis.addEventListener("voiceschanged", load);
    return () => { window.speechSynthesis.removeEventListener && window.speechSynthesis.removeEventListener("voiceschanged", load); };
  }, []);
  const levelItemsAll = ITEMS.filter((it) => it.level === level);
  const levelLearned = levelItemsAll.filter((it) => state.progress[it.id]).length;
  const learnPct = levelItemsAll.length ? levelLearned / levelItemsAll.length : 0;
  const [confirm, setConfirm] = useState(false);
  const [backupOpen, setBackupOpen] = useState(false);
  const [importText, setImportText] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const [recCount, setRecCount] = useState(0);
  const fileRef = useRef(null);

  useEffect(() => { if (backupOpen) recKeys().then((k) => setRecCount((k || []).length)); }, [backupOpen]);

  const saveBlob = (obj, name) => {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
    return blob.size;
  };
  const fmtSize = (n) => (n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB");

  // Full backup: progress, your corrections, custom cards, settings and every
  // voice recording, all in one file.
  const downloadBackup = async (withVoice = true) => {
    setBusy(true);
    try {
      const obj = await exportState(state, withVoice);
      const size = saveBlob(obj, `masri-srs-backup-${todayStr()}.json`);
      setMsg(`✓ Backup downloaded (${fmtSize(size)})${withVoice ? ` — includes ${Object.keys(obj.recordings || {}).length} voice recording${Object.keys(obj.recordings || {}).length === 1 ? "" : "s"}` : " — progress only, no voice"}.`);
    } catch (e) { setMsg("Couldn't download here — try Copy instead."); }
    setBusy(false);
  };
  // Voice only — a smaller file, handy for moving recordings to another device.
  const downloadVoice = async () => {
    setBusy(true);
    try {
      const recordings = await recDump();
      const n = Object.keys(recordings).length;
      if (!n) { setMsg("No voice recordings yet — record one from any word's page first."); setBusy(false); return; }
      const size = saveBlob({ masriVoiceBackup: true, appVersion: APP_VERSION, exportedAt: new Date().toISOString(), voicePref: state.voicePref || {}, recordings }, `masri-srs-voice-${todayStr()}.json`);
      setMsg(`✓ ${n} voice recording${n === 1 ? "" : "s"} downloaded (${fmtSize(size)}).`);
    } catch (e) { setMsg("Couldn't export your recordings here."); }
    setBusy(false);
  };
  const copyBackup = async () => {
    setBusy(true);
    // Recordings are far too big for the clipboard — this copies everything else.
    const text = JSON.stringify(await exportState(state, false));
    try { await navigator.clipboard.writeText(text); setMsg("✓ Copied (progress + corrections; voice recordings need the file download)."); }
    catch (e) { setImportText(text); setMsg("Select the text below and copy it manually."); }
    setBusy(false);
  };
  const showBackupText = async () => {
    setBusy(true);
    setImportText(JSON.stringify(await exportState(state, false)));
    setMsg("Here's your backup text (without voice) — copy and keep it safe.");
    setBusy(false);
  };
  const onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { setImportText(String(r.result || "")); setMsg("File loaded — tap Restore to apply."); };
    r.readAsText(f);
  };
  const doImport = async () => {
    let obj;
    try { obj = JSON.parse(importText.trim()); }
    catch (e) { setMsg("⚠ Invalid backup text — make sure you copied all of it."); return; }
    if (!obj || typeof obj !== "object") { setMsg("⚠ That doesn't look like a Masri backup."); return; }
    setBusy(true);
    // A voice-only file just tops up your recordings and leaves progress alone.
    if (obj.masriVoiceBackup) {
      const n = Object.keys(obj.recordings || {}).length;
      await recLoad(obj.recordings);
      const ids = await recKeys();
      primeMyRecordings(ids);
      onImport({ ...state, recordingIds: ids, voicePref: { ...(state.voicePref || {}), ...(obj.voicePref || {}) } });
      setMsg(`✓ Restored ${n} voice recording${n === 1 ? "" : "s"}. Your progress was left as it is.`);
      setImportText(""); setBusy(false); setRecCount(ids.length);
      return;
    }
    if (!("progress" in obj)) { setMsg("⚠ That doesn't look like a Masri backup."); setBusy(false); return; }
    if (obj.recordings && Object.keys(obj.recordings).length) await recLoad(obj.recordings);
    const ids = await recKeys();
    primeMyRecordings(ids);
    if (onImport({ ...obj, recordings: {}, recordingIds: ids })) {
      setMsg(`✓ Restored — progress, corrections${ids.length ? ` and ${ids.length} voice recording${ids.length === 1 ? "" : "s"}` : ""}.`);
      setImportText("");
      setRecCount(ids.length);
    }
    setBusy(false);
  };

  return (
    <div className="fade">
      <div style={{ background: `linear-gradient(160deg, ${T.panelHi}, ${T.panel})`, border: `1px solid ${T.line}`, borderRadius: 20, padding: "18px 18px 16px", marginBottom: 14, boxShadow: "0 12px 30px rgba(128,29,92,.08)" }}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
          <div style={{ fontFamily: displayFont, fontSize: 26, color: T.gold }}>Level {level}</div>
          <div style={{ fontSize: 13, color: T.textDim }}>{LEVEL_TITLES[level] || ""}</div>
        </div>
        <div style={{ margin: "12px 0 6px" }}><Bar pct={learnPct} /></div>
        <div style={{ fontSize: 12, color: T.textDim }}>
          {level >= CORE_MAX_LEVEL ? "Final level — master everything to finish!" : `${levelLearned}/${levelItemsAll.length} learned · learn them all to unlock Level ${level + 1}`}
        </div>
      </div>

      <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
        {[["Lessons", lessons, "lessons", "Learn + quiz"], ["Reviews", reviews, "reviews", "What's due now"]].map(([label, n, key, sub]) => (
          <button key={key} className="tap" onClick={() => n > 0 && onGo(key)} style={{ flex: 1, textAlign: "left", borderRadius: 18, padding: "16px 16px", cursor: n > 0 ? "pointer" : "default", color: n > 0 ? "#fff" : T.textDim, background: n > 0 ? `linear-gradient(135deg, ${T.gold}, ${T.terra})` : T.panel, boxShadow: n > 0 ? "0 8px 20px rgba(128,29,92,.18)" : "none", border: n > 0 ? "none" : `1px solid ${T.line}` }}>
            <div style={{ fontSize: 30, fontWeight: 800, lineHeight: 1 }}>{n}</div>
            <div style={{ fontSize: 14, fontWeight: 700, marginTop: 6 }}>{label}</div>
            <div style={{ fontSize: 11, opacity: 0.85, marginTop: 1 }}>{sub}</div>
          </button>
        ))}
      </div>

      <button className="tap" onClick={() => leeches > 0 && onTrouble()} style={{ width: "100%", marginBottom: 14, padding: "13px 16px", borderRadius: 14, border: `1px solid ${leeches > 0 ? T.red : T.line}`, background: leeches > 0 ? `${T.red}0f` : T.panel, color: leeches > 0 ? T.red : T.textDim, fontSize: 13.5, fontWeight: 700, cursor: leeches > 0 ? "pointer" : "default", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span>🔁 Trouble words {leeches > 0 ? `(${leeches})` : ""}</span>
        <span style={{ fontSize: 12, fontWeight: 600, opacity: 0.8 }}>{leeches > 0 ? "drill these →" : "none right now"}</span>
      </button>

<div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
        {STAGE_GROUPS.map((g) => (
          <div key={g} style={{ flex: 1, background: T.panel, border: `1px solid ${T.line}`, borderRadius: 12, padding: "10px 4px", textAlign: "center" }}>
            <div style={{ fontSize: 18, fontWeight: 700, color: stageMeta(g === "Apprentice" ? 1 : g === "Guru" ? 5 : g === "Master" ? 7 : g === "Enlightened" ? 8 : 9).color }}>{stageCounts[g] || 0}</div>
            <div style={{ fontSize: 9.5, color: T.textDim, marginTop: 2 }}>{g}</div>
          </div>
        ))}
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
        <Stat label="Streak" value={`${streak}🔥`} color={T.terra} />
        <Stat label="Reviews today" value={state.daily.reviews} color={T.gold} />
        <Stat label="Lessons today" value={state.daily.lessons} color={T.pink} />
      </div>

      <div style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 16, padding: 16, marginBottom: 14 }}>
        <button className="tap" onClick={() => { setBackupOpen((o) => !o); setMsg(""); }} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", border: "none", background: "transparent", padding: 0, cursor: "pointer", color: T.text }}>
          <span style={{ fontSize: 13, color: T.textDim }}>💾 Backup &amp; restore</span>
          <span style={{ fontSize: 12, color: T.gold, fontWeight: 700 }}>{backupOpen ? "Hide" : "Open"}</span>
        </button>
        {backupOpen && (
          <div className="fade" style={{ marginTop: 12 }}>
            <div style={{ fontSize: 11.5, color: T.textDim, lineHeight: 1.6, marginBottom: 10 }}>
              Saves everything: your levels and SRS progress, every correction you've made to a card, your custom cards and quizzes, your settings — and your voice recordings. Keep the file somewhere safe and restore it any time, even on a new phone.
            </div>
            {SAVE_ERR && (
              <div style={{ fontSize: 11.5, color: BAD_RED, fontWeight: 600, lineHeight: 1.5, background: `${BAD_RED}12`, border: `1px solid ${BAD_RED}55`, borderRadius: 10, padding: "9px 11px", marginBottom: 10 }}>⚠ {SAVE_ERR}</div>
            )}
            <div style={{ fontSize: 12, color: T.gold, fontWeight: 700, marginBottom: 6 }}>Export</div>
            <button className="tap" disabled={busy} onClick={() => downloadBackup(true)} style={{ width: "100%", padding: 12, borderRadius: 11, border: "none", background: `linear-gradient(135deg, ${T.gold}, ${T.terra})`, color: "#fff", fontSize: 13.5, fontWeight: 700, marginBottom: 8, opacity: busy ? 0.6 : 1 }}>
              {busy ? "Working…" : "⬇ Download full backup"}
              <span style={{ display: "block", fontSize: 11, fontWeight: 500, opacity: 0.9, marginTop: 2 }}>progress + corrections + {recCount} voice recording{recCount === 1 ? "" : "s"}</span>
            </button>
            <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              <button className="tap" disabled={busy} onClick={downloadVoice} style={{ flex: 1, padding: 11, borderRadius: 11, border: `1px solid ${T.gold}`, background: `${T.gold}0d`, color: T.gold, fontSize: 12.5, fontWeight: 700 }}>🎤 Voice only</button>
              <button className="tap" disabled={busy} onClick={() => downloadBackup(false)} style={{ flex: 1, padding: 11, borderRadius: 11, border: `1px solid ${T.line}`, background: T.panelHi, color: T.text, fontSize: 12.5, fontWeight: 600 }}>Progress only</button>
            </div>
            <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              <button className="tap" disabled={busy} onClick={copyBackup} style={{ flex: 1, padding: 10, borderRadius: 11, border: `1px solid ${T.line}`, background: T.panelHi, color: T.text, fontSize: 12.5, fontWeight: 600 }}>Copy</button>
              <button className="tap" disabled={busy} onClick={showBackupText} style={{ flex: 1, padding: 10, borderRadius: 11, border: `1px solid ${T.line}`, background: T.panelHi, color: T.text, fontSize: 12.5, fontWeight: 600 }}>Show text</button>
            </div>
            <div style={{ fontSize: 11, color: T.textDim, lineHeight: 1.5, marginBottom: 4 }}>Copy and Show text leave the recordings out — audio is far too big for the clipboard, so use a file download to keep your voice.</div>
            <div style={{ fontSize: 12, color: T.gold, fontWeight: 700, margin: "12px 0 6px" }}>Import</div>
            <input ref={fileRef} type="file" accept=".json,application/json" onChange={onFile} style={{ display: "none" }} />
            <button className="tap" onClick={() => fileRef.current && fileRef.current.click()} style={{ width: "100%", padding: 11, borderRadius: 11, border: `1px dashed ${T.gold}`, background: `${T.gold}0d`, color: T.gold, fontSize: 13, fontWeight: 600, marginBottom: 8 }}>Choose backup file…</button>
            <textarea value={importText} onChange={(e) => setImportText(e.target.value)} placeholder="…or paste your backup text here" rows={3} style={{ width: "100%", padding: "10px 12px", borderRadius: 10, border: `1px solid ${T.line}`, background: T.panelHi, color: T.text, fontSize: 11.5, fontFamily: "ui-monospace, monospace", outline: "none", resize: "vertical" }} />
            <button className="tap" disabled={!importText.trim() || busy} onClick={doImport} style={{ width: "100%", marginTop: 8, padding: 12, borderRadius: 11, border: "none", background: importText.trim() && !busy ? `linear-gradient(135deg, ${T.gold}, ${T.terra})` : T.line, color: importText.trim() && !busy ? "#fff" : T.textDim, fontSize: 14, fontWeight: 700 }}>{busy ? "Working…" : "Restore this backup"}</button>
            <div style={{ fontSize: 11, color: T.textDim, marginTop: 8, lineHeight: 1.5 }}>Restoring a full backup replaces your current progress. A voice-only file just adds the recordings back and leaves your progress alone.</div>
            {msg && <div style={{ fontSize: 12, color: msg[0] === "⚠" ? T.red : T.gold, fontWeight: 600, marginTop: 8, lineHeight: 1.5 }}>{msg}</div>}
          </div>
        )}
      </div>

      <div style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 16, padding: 16, marginBottom: 14 }}>
        <div style={{ fontSize: 13, color: T.textDim, marginBottom: 4 }}>Learning phase</div>
        <div style={{ fontSize: 11.5, color: T.textDim, marginBottom: 12, lineHeight: 1.5 }}>
          How many new words you learn before each lesson quiz.
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <span style={{ fontSize: 14 }}>New words per quiz</span>
          <div style={{ display: "flex", gap: 8 }}>
            {[3, 5, 7, 10].map((n) => (
              <button key={n} className="tap" onClick={() => onSetting({ lessonBatch: n })} style={{ border: `1px solid ${state.settings.lessonBatch === n ? T.gold : T.line}`, background: state.settings.lessonBatch === n ? `${T.gold}18` : "transparent", color: state.settings.lessonBatch === n ? T.gold : T.textDim, borderRadius: 9, padding: "6px 11px", fontSize: 13, fontWeight: 600 }}>{n}</button>
            ))}
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 16, paddingTop: 14, borderTop: `1px solid ${T.line}` }}>
          <div>
            <div style={{ fontSize: 14 }}>Auto-play pronunciation</div>
            <div style={{ fontSize: 11, color: T.textDim, marginTop: 2, lineHeight: 1.4 }}>Speak the word automatically when learning or revealing it.</div>
          </div>
          <button className="tap" role="switch" aria-checked={state.settings.autoPlay !== false} onClick={() => onSetting({ autoPlay: !(state.settings.autoPlay !== false) })} style={{ flexShrink: 0, width: 50, height: 28, borderRadius: 999, border: "none", cursor: "pointer", background: state.settings.autoPlay !== false ? `linear-gradient(135deg, ${T.gold}, ${T.terra})` : T.line, position: "relative", transition: "background .2s" }}>
            <span style={{ position: "absolute", top: 3, left: state.settings.autoPlay !== false ? 25 : 3, width: 22, height: 22, borderRadius: 999, background: "#fff", transition: "left .2s", boxShadow: "0 1px 3px rgba(0,0,0,.25)" }} />
          </button>
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 16, paddingTop: 14, borderTop: `1px solid ${T.line}` }}>
          <div>
            <div style={{ fontSize: 14 }}>Recorded Egyptian audio</div>
            <div style={{ fontSize: 11, color: T.textDim, marginTop: 2, lineHeight: 1.4 }}>Play real Egyptian recordings from the app's audio folder when available; words without one fall back to the engine below.</div>
          </div>
          <button className="tap" role="switch" aria-checked={state.settings.recorded !== false} onClick={() => onSetting({ recorded: !(state.settings.recorded !== false) })} style={{ flexShrink: 0, width: 50, height: 28, borderRadius: 999, border: "none", cursor: "pointer", background: state.settings.recorded !== false ? `linear-gradient(135deg, ${T.gold}, ${T.terra})` : T.line, position: "relative", transition: "background .2s" }}>
            <span style={{ position: "absolute", top: 3, left: state.settings.recorded !== false ? 25 : 3, width: 22, height: 22, borderRadius: 999, background: "#fff", transition: "left .2s", boxShadow: "0 1px 3px rgba(0,0,0,.25)" }} />
          </button>
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 16, paddingTop: 14, borderTop: `1px solid ${T.line}` }}>
          <div>
            <div style={{ fontSize: 14 }}>Masri pronunciation engine</div>
            <div style={{ fontSize: 11, color: T.textDim, marginTop: 2, lineHeight: 1.4 }}>Speaks each word with its true Egyptian vowels and stops (recommended). Off = read the dictionary spelling as-is.</div>
          </div>
          <button className="tap" role="switch" aria-checked={state.settings.phonetic !== false} onClick={() => onSetting({ phonetic: !(state.settings.phonetic !== false) })} style={{ flexShrink: 0, width: 50, height: 28, borderRadius: 999, border: "none", cursor: "pointer", background: state.settings.phonetic !== false ? `linear-gradient(135deg, ${T.gold}, ${T.terra})` : T.line, position: "relative", transition: "background .2s" }}>
            <span style={{ position: "absolute", top: 3, left: state.settings.phonetic !== false ? 25 : 3, width: 22, height: 22, borderRadius: 999, background: "#fff", transition: "left .2s", boxShadow: "0 1px 3px rgba(0,0,0,.25)" }} />
          </button>
        </div>
        <div style={{ marginTop: 16, paddingTop: 14, borderTop: `1px solid ${T.line}` }}>
          <div style={{ fontSize: 14 }}>Arabic voice</div>
          <div style={{ fontSize: 11, color: T.textDim, margin: "2px 0 8px", lineHeight: 1.4 }}>Pick the best Arabic voice on this device — an <b>Egyptian (ar-EG)</b> one, if listed, sounds by far the most accurate. Tap ▶ to test.</div>
          <div style={{ display: "flex", gap: 8 }}>
            <select value={state.settings.voiceURI || ""} onChange={(e) => onSetting({ voiceURI: e.target.value || null })} style={{ flex: 1, padding: "10px 12px", borderRadius: 10, border: `1px solid ${T.line}`, background: T.panelHi, color: T.text, fontSize: 13, outline: "none" }}>
              <option value="">Auto (prefer Egyptian)</option>
              {arVoices.map((v) => (
                <option key={v.voiceURI} value={v.voiceURI}>{v.name} ({v.lang}){v.lang.toLowerCase().startsWith("ar-eg") ? " ⭐" : ""}</option>
              ))}
            </select>
            <button className="tap" onClick={() => speak("إِزَّيَّك؟ أَنَا كُوَيِّسْ")} aria-label="test voice" style={{ padding: "10px 14px", borderRadius: 10, border: `1px solid ${T.gold}`, background: `${T.gold}12`, color: T.gold, fontSize: 14, fontWeight: 700 }}>▶</button>
          </div>
          {arVoices.length === 0 && <div style={{ fontSize: 11, color: T.textDim, marginTop: 6 }}>No Arabic voices found on this device — install one in your phone's text-to-speech settings.</div>}
        </div>
        <div style={{ marginTop: 14 }}>
          {!confirm ? (
            <button className="tap" onClick={() => setConfirm(true)} style={{ width: "100%", padding: 12, borderRadius: 11, border: `1px solid ${T.red}55`, background: "transparent", color: T.red, fontSize: 13, fontWeight: 600 }}>Reset all progress</button>
          ) : (
            <div style={{ display: "flex", gap: 8 }}>
              <button className="tap" onClick={() => setConfirm(false)} style={{ flex: 1, padding: 12, borderRadius: 11, border: `1px solid ${T.line}`, background: T.panel, color: T.text, fontSize: 13, fontWeight: 600 }}>Cancel</button>
              <button className="tap" onClick={() => { onReset(); setConfirm(false); }} style={{ flex: 1, padding: 12, borderRadius: 11, border: "none", background: T.red, color: "#fff", fontSize: 13, fontWeight: 700 }}>Yes, reset</button>
            </div>
          )}
        </div>
      </div>

      <div style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 16, padding: 16 }}>
        <div style={{ fontSize: 13, color: T.textDim, marginBottom: 12 }}>Theme</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {THEME_LIST.map(([key, name]) => {
            const pal = THEMES[key];
            const active = state.settings.theme === key;
            return (
              <button key={key} className="tap" onClick={() => onTheme(key)} style={{ display: "flex", alignItems: "center", gap: 7, border: `1.5px solid ${active ? T.gold : T.line}`, background: active ? `${T.gold}14` : T.panelHi, borderRadius: 999, padding: "6px 12px 6px 7px", fontSize: 12.5, fontWeight: 600, color: active ? T.gold : T.textDim }}>
                <span style={{ width: 18, height: 18, borderRadius: 999, background: `linear-gradient(135deg, ${pal.gold}, ${pal.terra})`, border: `2px solid ${pal.bg}`, boxShadow: `0 0 0 1px ${pal.line}` }} />
                {name}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ===================== ITEMS (browse + select-to-quiz + add) ===================== */
function ItemsView({ allItems, state, level, leeches, onAdd, onStartPractice, customItems, onToggleCustom, onStartCustom, onClearCustom, onAddByStage, audioIds, onReorder, initialFilter, onOpenDetail }) {
  const [reorderMode, setReorderMode] = useState(false);
  const moveItem = (it, dir) => {
    const ids = allItems.filter((x) => x.level === it.level).map((x) => x.id);
    const i = ids.indexOf(it.id);
    const j = i + dir;
    if (j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    onReorder(it.level, ids);
  };
  const [filter, setFilter] = useState(initialFilter != null ? initialFilter : "all");
  const [query, setQuery] = useState("");
  const [showAdd, setShowAdd] = useState(false);
  const [showStage, setShowStage] = useState(false);
  const [addLevel, setAddLevel] = useState(level);
  const [stageSel, setStageSel] = useState([]);
  const [ar, setAr] = useState("");
  const [tr, setTr] = useState("");
  const [en, setEn] = useState("");
  const now = Date.now();
  const vocabLevels = Array.from({ length: CONV_START - 1 }, (_, k) => k + 1);
  const convLevels = [];
  for (let l = CONV_START; l <= CONV_END; l++) if (allItems.some((x) => x.level === l)) convLevels.push(l);
  const verbLevels = [];
  for (let l = VERB_START; l <= MAX_LEVEL; l++) if (allItems.some((x) => x.level === l)) verbLevels.push(l);
  const convTitle = (l) => (LEVEL_TITLES[l] || `Lv ${l}`).replace(/^Conversations: /, "");
  const vocabCount = allItems.filter((x) => x.level < CONV_START).length;
  const convCount = allItems.filter((x) => isConvLevel(x.level)).length;
  const verbCount = allItems.filter((x) => isVerbLevel(x.level)).length;
  const raw = query.trim();
  const ql = raw.toLowerCase();
  const qar = normAr(raw);
  const qtr = normTr(raw);
  const qaz = normAz(raw);
  const myVoice = new Set(state.recordingIds || []);
  const shown = allItems.filter((it) => {
    if (!raw) {
      if (filter === "all") return true;
      if (filter === "conv") return isConvLevel(it.level);
      if (filter === "verbs") return isVerbLevel(it.level);
      if (filter === "vocab") return it.level < CONV_START;
      if (filter === "rec") return !!(audioIds && audioIds.has(it.id));      // has studio audio
      if (filter === "mine") return myVoice.has(it.id);                      // has my own recording
      return it.level === filter;
    }
    const enHit = it.en.toLowerCase().includes(ql);
    const trHit = qtr.length > 0 && (normTr(it.tr).includes(qtr) || (it.alts || []).some((a) => normTr(a).includes(qtr)));
    const arHit = qar.length > 0 && (normAr(it.ar).includes(qar) || (it.alts || []).some((a) => normAr(a).includes(qar)));
    // Searching also matches how you'd text it — "7abibi" finds حبيبي.
    const azHit = qaz.length > 0 && normAz(it.az || toArabizi(it.ar, it.tr)).includes(qaz);
    return enHit || trHit || arHit || azHit;
  });
  const countByLevel = {};
  allItems.forEach((it) => { countByLevel[it.level] = (countByLevel[it.level] || 0) + 1; });
  const totalCount = allItems.length;
  const inCustom = (id) => customItems.includes(id);

  // Learned items grouped by SRS mastery level, for "add to custom quiz by level".
  const groupCounts = {};
  allItems.forEach((it) => { const p = state.progress[it.id]; if (p) { const g = stageMeta(p.stage).group; groupCounts[g] = (groupCounts[g] || 0) + 1; } });
  const stageIds = stageSel.length ? allItems.filter((it) => { const p = state.progress[it.id]; return p && stageSel.includes(stageMeta(p.stage).group); }).map((it) => it.id) : [];
  const toggleStage = (g) => setStageSel((sel) => sel.includes(g) ? sel.filter((x) => x !== g) : [...sel, g]);
  // Custom-quiz sets built from what you can hear, not from how well you know it.
  const audioRecIds = audioIds ? allItems.filter((it) => audioIds.has(it.id)).map((it) => it.id) : [];
  const myVoiceIds = allItems.filter((it) => myVoice.has(it.id)).map((it) => it.id);

  const badge = (it) => {
    const p = state.progress[it.id];
    const locked = it.level < CONV_START && it.level > level && !it.custom && !p;
    if (locked) return { t: "🔒", c: T.textDim };
    if (!p) return { t: "new", c: T.pink };
    if (isLeech(p)) return { t: "⚠ " + stageMeta(p.stage).short, c: T.red };
    return { t: p.due === Infinity ? "burned" : stageMeta(p.stage).short, c: stageMeta(p.stage).color };
  };

  return (
    <div className="fade">
      <div style={{ position: "relative", marginBottom: 10 }}>
        <input
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          placeholder="Search English or Arabic…"
          style={{ width: "100%", padding: "12px 38px 12px 14px", borderRadius: 12, border: `1px solid ${T.line}`, background: T.panel, color: T.text, fontSize: 14, outline: "none" }}
        />
        {raw ? (
          <button className="tap" onClick={() => setQuery("")} aria-label="clear search" style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", border: "none", background: "transparent", color: T.textDim, fontSize: 18, cursor: "pointer", lineHeight: 1 }}>×</button>
        ) : (
          <span style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", color: T.textDim, fontSize: 14, pointerEvents: "none" }}>🔍</span>
        )}
      </div>

      {raw ? (
        <div style={{ fontSize: 11.5, color: T.textDim, margin: "0 2px 8px" }}>
          {shown.length} match{shown.length === 1 ? "" : "es"} across all levels
        </div>
      ) : (
        <div style={{ marginBottom: 4 }}>
          <button className="tap" onClick={() => setFilter("all")} style={{ whiteSpace: "nowrap", border: `1px solid ${filter === "all" ? T.gold : T.line}`, background: filter === "all" ? `${T.gold}18` : "transparent", color: filter === "all" ? T.gold : T.textDim, borderRadius: 20, padding: "6px 13px", fontSize: 12.5, fontWeight: 600, marginBottom: 6 }}>All ({totalCount})</button>
          <div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "4px 2px 5px" }}>Vocabulary</div>
          <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6 }}>
            <button className="tap" onClick={() => setFilter("vocab")} style={{ whiteSpace: "nowrap", border: `1px solid ${filter === "vocab" ? T.gold : T.line}`, background: filter === "vocab" ? `${T.gold}18` : "transparent", color: filter === "vocab" ? T.gold : T.textDim, borderRadius: 20, padding: "6px 13px", fontSize: 12.5, fontWeight: 600 }}>All vocabulary ({vocabCount})</button>
            {vocabLevels.map((l) => (
              <button key={l} className="tap" onClick={() => setFilter(l)} style={{ whiteSpace: "nowrap", border: `1px solid ${filter === l ? T.gold : T.line}`, background: filter === l ? `${T.gold}18` : "transparent", color: filter === l ? T.gold : T.textDim, borderRadius: 20, padding: "6px 13px", fontSize: 12.5, fontWeight: 600 }}>Lv {l} ({countByLevel[l] || 0})</button>
            ))}
          </div>
          <div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "6px 2px 5px" }}>🗣 Conversations</div>
          <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 8 }}>
            <button className="tap" onClick={() => setFilter("conv")} style={{ whiteSpace: "nowrap", border: `1px solid ${filter === "conv" ? T.gold : T.line}`, background: filter === "conv" ? `${T.gold}18` : "transparent", color: filter === "conv" ? T.gold : T.textDim, borderRadius: 20, padding: "6px 13px", fontSize: 12.5, fontWeight: 600 }}>All conversations ({convCount})</button>
            {convLevels.map((l) => (
              <button key={l} className="tap" onClick={() => setFilter(l)} style={{ whiteSpace: "nowrap", border: `1px solid ${filter === l ? T.gold : T.line}`, background: filter === l ? `${T.gold}18` : "transparent", color: filter === l ? T.gold : T.textDim, borderRadius: 20, padding: "6px 13px", fontSize: 12.5, fontWeight: 600 }}>{convTitle(l)} ({countByLevel[l] || 0})</button>
            ))}
          </div>
          {verbCount > 0 && (
            <>
              <div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "6px 2px 5px" }}>⚡ Verbs</div>
              <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 8 }}>
                <button className="tap" onClick={() => setFilter("verbs")} style={{ whiteSpace: "nowrap", border: `1px solid ${filter === "verbs" ? T.gold : T.line}`, background: filter === "verbs" ? `${T.gold}18` : "transparent", color: filter === "verbs" ? T.gold : T.textDim, borderRadius: 20, padding: "6px 13px", fontSize: 12.5, fontWeight: 600 }}>All verbs ({verbCount})</button>
                {verbLevels.map((l) => (
                  <button key={l} className="tap" onClick={() => setFilter(l)} style={{ whiteSpace: "nowrap", border: `1px solid ${filter === l ? T.gold : T.line}`, background: filter === l ? `${T.gold}18` : "transparent", color: filter === l ? T.gold : T.textDim, borderRadius: 20, padding: "6px 13px", fontSize: 12.5, fontWeight: 600 }}>{(LEVEL_TITLES[l] || `Lv ${l}`).replace(/^Verbs — /, "")} ({countByLevel[l] || 0})</button>
                ))}
              </div>
            </>
          )}
          <div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "6px 2px 5px" }}>🔊 By audio</div>
          <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 8 }}>
            <button className="tap" onClick={() => setFilter("rec")} style={{ whiteSpace: "nowrap", border: `1px solid ${filter === "rec" ? T.gold : T.line}`, background: filter === "rec" ? `${T.gold}18` : "transparent", color: filter === "rec" ? T.gold : T.textDim, borderRadius: 20, padding: "6px 13px", fontSize: 12.5, fontWeight: 600 }}>🎙 Has recorded audio ({audioIds ? allItems.filter((x) => audioIds.has(x.id)).length : 0})</button>
            <button className="tap" onClick={() => setFilter("mine")} style={{ whiteSpace: "nowrap", border: `1px solid ${filter === "mine" ? T.gold : T.line}`, background: filter === "mine" ? `${T.gold}18` : "transparent", color: filter === "mine" ? T.gold : T.textDim, borderRadius: 20, padding: "6px 13px", fontSize: 12.5, fontWeight: 600 }}>🎤 My voice ({myVoice.size})</button>
          </div>
        </div>
      )}

      {customItems.length > 0 && (
        <div style={{ position: "sticky", top: 0, zIndex: 5, marginBottom: 10, padding: "8px 0", background: T.bg }}>
          <div style={{ display: "flex", gap: 8 }}>
            <button className="tap" onClick={onStartCustom} style={{ flex: 1, padding: "13px 16px", borderRadius: 13, border: "none", background: `linear-gradient(135deg, ${T.gold}, ${T.terra})`, color: "#fff", fontWeight: 700, fontSize: 14, boxShadow: "0 8px 20px rgba(128,29,92,.18)" }}>★ Start custom quiz ({customItems.length})</button>
            <button className="tap" onClick={onClearCustom} style={{ padding: "13px 16px", borderRadius: 13, border: `1px solid ${T.line}`, background: T.panel, color: T.textDim, fontWeight: 600, fontSize: 13 }}>Clear</button>
          </div>
        </div>
      )}

      {leeches > 0 && (
        <button className="tap" onClick={() => onStartPractice("leeches")} style={{ width: "100%", marginBottom: 10, padding: 11, borderRadius: 12, border: `1px solid ${T.red}`, background: `${T.red}0f`, color: T.red, fontSize: 13, fontWeight: 700 }}>
          🔁 Quiz my trouble words ({leeches})
        </button>
      )}

      <button className="tap" onClick={() => setShowAdd((s) => !s)} style={{ width: "100%", marginBottom: 12, padding: 11, borderRadius: 12, border: `1px dashed ${T.gold}`, background: `${T.gold}0d`, color: T.gold, fontSize: 13, fontWeight: 600 }}>{showAdd ? "Close" : "+ Add your own card"}</button>

      {showAdd && (
        <div className="fade" style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 14, padding: 14, marginBottom: 14 }}>
          {[["Arabic", ar, setAr, true, "اكتب هنا"], ["Transliteration", tr, setTr, false, "e.g. ezzaay"], ["English meaning", en, setEn, false, "e.g. How"]].map(([label, val, set, rtl, ph]) => (
            <div key={label} style={{ marginBottom: 10 }}>
              <div style={{ fontSize: 11.5, color: T.textDim, marginBottom: 4 }}>{label}</div>
              <input value={val} onChange={(e) => set(e.target.value)} placeholder={ph} dir={rtl ? "rtl" : "ltr"} style={{ width: "100%", padding: "10px 12px", borderRadius: 10, border: `1px solid ${T.line}`, background: T.panelHi, color: T.text, fontSize: rtl ? 20 : 14, fontFamily: rtl ? arFont : "inherit", outline: "none" }} />
            </div>
          ))}
          <select value={addLevel} onChange={(e) => setAddLevel(+e.target.value)} style={{ width: "100%", marginBottom: 8, padding: "10px 12px", borderRadius: 10, border: `1px solid ${T.line}`, background: T.panelHi, color: T.text, fontSize: 13, outline: "none" }}>
            {Array.from({ length: MAX_LEVEL }, (_, i) => i + 1).map((l) => (
              <option key={l} value={l}>Level {l} · {LEVEL_TITLES[l] || ""}</option>
            ))}
          </select>
          <button className="tap" disabled={!ar.trim() || !en.trim()} onClick={() => { onAdd({ id: "u" + Date.now(), level: addLevel, type: "word", ar: ar.trim(), tr: tr.trim() || "—", en: en.trim(), alts: [], custom: true }); setAr(""); setTr(""); setEn(""); setShowAdd(false); }} style={{ width: "100%", padding: 12, borderRadius: 11, border: "none", background: ar.trim() && en.trim() ? `linear-gradient(135deg, ${T.gold}, ${T.terra})` : T.line, color: ar.trim() && en.trim() ? "#fff" : T.textDim, fontWeight: 700, fontSize: 14 }}>Add to Level {addLevel}</button>
        </div>
      )}

      <button className="tap" onClick={() => setReorderMode((r) => !r)} style={{ width: "100%", marginBottom: 12, padding: 11, borderRadius: 12, border: `1px dashed ${reorderMode ? T.terra : T.line}`, background: reorderMode ? `${T.terra}12` : "transparent", color: reorderMode ? T.terra : T.textDim, fontSize: 13, fontWeight: 600 }}>{reorderMode ? "✓ Done reordering" : "↕ Reorder items (set your learning priority)"}</button>
      <button className="tap" onClick={() => setShowStage((s) => !s)} style={{ width: "100%", marginBottom: 12, padding: 11, borderRadius: 12, border: `1px dashed ${T.gold}`, background: `${T.gold}0d`, color: T.gold, fontSize: 13, fontWeight: 600 }}>{showStage ? "Close" : "★ Add to custom quiz by mastery level"}</button>

      {showStage && (
        <div className="fade" style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 14, padding: 14, marginBottom: 14 }}>
          <div style={{ fontSize: 12, color: T.textDim, lineHeight: 1.5, marginBottom: 10 }}>Pick one or more SRS mastery levels — every learned item at those levels gets added to your custom quiz.</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginBottom: 12 }}>
            {STAGE_GROUPS.map((g) => {
              const n = groupCounts[g] || 0;
              const on = stageSel.includes(g);
              return (
                <button key={g} className="tap" disabled={!n} onClick={() => toggleStage(g)} style={{ border: `1.5px solid ${on ? T.gold : T.line}`, background: on ? `${T.gold}1a` : "transparent", color: !n ? T.line : on ? T.gold : T.textDim, borderRadius: 20, padding: "7px 14px", fontSize: 12.5, fontWeight: 700, cursor: n ? "pointer" : "default" }}>{on ? "✓ " : ""}{g} ({n})</button>
              );
            })}
          </div>
          <button className="tap" disabled={!stageIds.length} onClick={() => { onAddByStage && onAddByStage(stageIds); setStageSel([]); setShowStage(false); }} style={{ width: "100%", padding: 12, borderRadius: 11, border: "none", background: stageIds.length ? `linear-gradient(135deg, ${T.gold}, ${T.terra})` : T.line, color: stageIds.length ? "#fff" : T.textDim, fontWeight: 700, fontSize: 14 }}>{stageIds.length ? `Add ${stageIds.length} item${stageIds.length === 1 ? "" : "s"} to custom quiz` : "Select a level above"}</button>

          {/* Build a listening set instead: everything that has audio to hear. */}
          <div style={{ marginTop: 16, paddingTop: 14, borderTop: `1px dashed ${T.line}` }}>
            <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, marginBottom: 6 }}>Or build it by audio</div>
            <div style={{ fontSize: 12, color: T.textDim, lineHeight: 1.5, marginBottom: 10 }}>Drill only the cards you can actually hear — the studio recordings, or the ones you've said in your own voice.</div>
            {[
              ["🎙 Cards with recorded audio", audioRecIds, "Every card that has an Egyptian studio recording"],
              ["🎤 Cards in my own voice", myVoiceIds, "Every card you've recorded yourself"],
              ["🎧 Everything with any audio", Array.from(new Set([...audioRecIds, ...myVoiceIds])), "Both sets combined"],
            ].map(([label, ids, sub]) => (
              <button key={label} className="tap" disabled={!ids.length} onClick={() => { onAddByStage && onAddByStage(ids); setShowStage(false); }} style={{ width: "100%", marginBottom: 8, padding: "11px 13px", borderRadius: 11, textAlign: "left", border: `1px solid ${ids.length ? T.gold : T.line}`, background: ids.length ? `${T.gold}0d` : "transparent", color: ids.length ? T.gold : T.textDim, fontWeight: 700, fontSize: 13 }}>
                <div>{label} ({ids.length})</div>
                <div style={{ fontSize: 11, fontWeight: 500, color: T.textDim, marginTop: 2 }}>{sub}</div>
              </button>
            ))}
          </div>
        </div>
      )}

      <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: "4px 10px", margin: "2px 2px 8px", fontSize: 11 }}>
        <span style={{ color: T.textDim }}>Mastery:</span>
        {MASTERY_LEGEND.map((t) => (
          <span key={t.label} style={{ display: "inline-flex", alignItems: "center", gap: 5, color: T.textDim }}>
            <span style={{ width: 9, height: 9, borderRadius: 3, background: t.color }} />{t.label}
          </span>
        ))}
        <span style={{ color: T.textDim }}>🎙 recorded audio</span>
        <span style={{ color: T.textDim }}>🎤 my voice</span>
        <span style={{ color: T.textDim }}>gold line = arabizi</span>
        <span style={{ color: T.textDim, marginLeft: "auto" }}>★ adds to custom quiz</span>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {shown.map((it) => {
          const b = badge(it);
          const picked = inCustom(it.id);
          const p = state.progress[it.id];
          const locked = it.level < CONV_START && it.level > level && !it.custom && !p;
          const mc = !locked && p ? masteryColor(p) : null;
          const pct = !locked && p ? masteryPct(p) : null;
          return (
            <div key={it.id} style={{ background: picked ? `${T.gold}0d` : T.panel, border: `1px solid ${picked ? T.gold : T.line}`, borderLeft: mc ? `5px solid ${mc}` : `1px solid ${picked ? T.gold : T.line}`, borderRadius: 13, padding: "11px 13px", display: "flex", alignItems: "center", gap: 10 }}>
              <button className="tap" onClick={() => onToggleCustom(it.id)} aria-label="add to custom quiz" title="Add to custom quiz" style={{ width: 24, height: 24, borderRadius: 999, flexShrink: 0, cursor: "pointer", border: `2px solid ${picked ? T.gold : T.line}`, background: picked ? T.gold : "transparent", color: picked ? "#fff" : T.textDim, fontSize: 13, lineHeight: 1, display: "flex", alignItems: "center", justifyContent: "center" }}>★</button>
              <button className="tap" onClick={() => onOpenDetail && onOpenDetail(it)} aria-label="open details" style={{ background: "transparent", border: "none", padding: 0, cursor: "pointer", minWidth: 64, textAlign: "right" }}>
                <span style={{ fontFamily: arFont, fontSize: 22, direction: "rtl", color: T.text }}>{it.ar}</span>
              </button>
              <Speaker text={it.ar} size={14} color={T.terra} />
              {reorderMode && (
                <span style={{ display: "inline-flex", flexDirection: "column", gap: 2, marginRight: 2 }}>
                  <button className="tap" onClick={(e) => { e.stopPropagation(); moveItem(it, -1); }} style={{ width: 26, height: 22, borderRadius: 6, border: `1px solid ${T.line}`, background: T.panelHi, color: T.gold, fontSize: 11, lineHeight: 1, cursor: "pointer" }}>▲</button>
                  <button className="tap" onClick={(e) => { e.stopPropagation(); moveItem(it, 1); }} style={{ width: 26, height: 22, borderRadius: 6, border: `1px solid ${T.line}`, background: T.panelHi, color: T.gold, fontSize: 11, lineHeight: 1, cursor: "pointer" }}>▼</button>
                </span>
              )}
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 14, color: T.text }}>{it.en}</div>
                <div style={{ fontSize: 11.5, color: T.goldSoft, fontStyle: "italic" }}>{it.tr}{audioIds && audioIds.has(it.id) && <span title="Recorded Egyptian audio (speechgen)" style={{ fontStyle: "normal", marginLeft: 5 }}>🎙</span>}{myVoice.has(it.id) && <span title="My own recording" style={{ fontStyle: "normal", marginLeft: 5 }}>🎤</span>}</div>
                {it.az && <div style={{ fontSize: 11, color: T.gold, fontWeight: 600, letterSpacing: 0.2, marginTop: 1 }}>{it.az}</div>}
              </div>
              <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 3 }}>
                <div style={{ fontSize: 10, color: b.c, border: `1px solid ${b.c}55`, borderRadius: 7, padding: "2px 7px", fontWeight: 700, whiteSpace: "nowrap" }}>{b.t}</div>
                {pct != null && (
                  <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                    <span style={{ width: 7, height: 7, borderRadius: 999, background: mc }} />
                    <span style={{ fontSize: 9.5, color: T.textDim, fontWeight: 600 }}>{pct}%</span>
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ===================== STATS / PROGRESS REPORT ===================== */
function MiniBars({ series, color, unit }) {
  const max = Math.max(1, ...series);
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 3, height: 64 }}>
      {series.map((v, i) => (
        <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "flex-end", height: "100%" }} title={`${v} ${unit || ""}`}>
          <div style={{ height: `${(v / max) * 100}%`, minHeight: v ? 4 : 2, background: v ? `linear-gradient(180deg, ${T.gold}, ${T.terra})` : T.line, borderRadius: 3 }} />
        </div>
      ))}
    </div>
  );
}

function StatsView({ state, allItems, level, streak }) {
  const now = Date.now();
  const prog = state.progress;
  const totalApp = allItems.length; // includes your own added cards
  const stageOf = (it) => prog[it.id]?.stage || 0;

  const learned = allItems.filter((it) => prog[it.id]).length;
  const mastered = allItems.filter((it) => isMastered(prog[it.id])).length; // run ≥ 90%
  const burned = allItems.filter((it) => stageOf(it) >= 9).length;
  const due = allItems.filter((it) => { const p = prog[it.id]; return p && p.due !== Infinity && p.due <= now; }).length;
  const next24 = allItems.filter((it) => { const p = prog[it.id]; return p && p.due !== Infinity && p.due > now && p.due <= now + DAY; }).length;
  const next7 = allItems.filter((it) => { const p = prog[it.id]; return p && p.due !== Infinity && p.due > now && p.due <= now + 7 * DAY; }).length;

  const levelItems = allItems.filter((it) => it.level === level);
  const levelGuru = levelItems.filter((it) => stageOf(it) >= 5).length;
  const levelPct = levelItems.length ? levelGuru / levelItems.length : 0;

  /* Whole-app % is mastery-weighted: every item contributes its own mastery run
     (an unlearned item counts as 0), so the number moves with every tier shift —
     not only when something finally crosses the 90% "mastered" line. */
  const appMasterySum = allItems.reduce((a, it) => a + masteryPct(prog[it.id]), 0);
  const appPct = totalApp ? appMasterySum / (totalApp * 100) : 0;

  /* ---- Per-category stats: Vocabulary / Conversations / Verbs ----
     For each: how many you've learned (count + %), the mastery-tier split of what
     you've started, and the category's own mastery-weighted completion. */
  const EMPTY_TIERS = () => ({ Learning: 0, Shaky: 0, Familiar: 0, Strong: 0, Mastered: 0 });
  const catStats = [
    { key: "vocab", label: "Vocabulary", icon: "📚", test: (it) => it.level < CONV_START },
    { key: "conv", label: "Conversations", icon: "🗣", test: (it) => isConvLevel(it.level) },
    { key: "verbs", label: "Verbs", icon: "⚡", test: (it) => isVerbLevel(it.level) },
  ].map((c) => {
    const its = allItems.filter(c.test);
    const tiers = EMPTY_TIERS();
    let started = 0, runSum = 0;
    its.forEach((it) => {
      const p = prog[it.id];
      if (!p) return;
      started++;
      const pct = masteryPct(p);
      runSum += pct;
      tiers[masteryTier(pct).label]++;
    });
    return {
      ...c,
      total: its.length,
      learned: started,
      learnedPct: its.length ? started / its.length : 0,
      masteryPct: its.length ? runSum / (its.length * 100) : 0,
      tiers,
    };
  });

  // last 14 days
  const days = [];
  let d = todayStr();
  for (let k = 0; k < 14; k++) { days.unshift(d); d = shiftDay(d, -1); }
  const learnedByDay = {};
  allItems.forEach((it) => { const p = prog[it.id]; if (p && p.learnedAt) { const ds = new Date(p.learnedAt).toISOString().slice(0, 10); learnedByDay[ds] = (learnedByDay[ds] || 0) + 1; } });
  const learnSeries = days.map((ds) => learnedByDay[ds] || 0);
  const actSeries = days.map((ds) => state.history[ds] || 0);
  const newThisWeek = learnSeries.slice(-7).reduce((a, b) => a + b, 0);

  // ---- Mastery breakdown across every started learnable (words, letter shapes, marks) ----
  const allProgs = [];
  allItems.forEach((it) => { const p = prog[it.id]; if (p) allProgs.push(p); });
  const sp = (state.script && state.script.progress) || {};
  SCRIPT_FORMS.forEach((t) => { const p = formProg(sp, t); if (p) allProgs.push(p); });
  const hk = (state.script && state.script.harakat) || {};
  Object.keys(hk).forEach((ch) => { const p = markProg(hk[ch]); if (p) allProgs.push(p); });
  const tierCounts = { Learning: 0, Shaky: 0, Familiar: 0, Strong: 0, Mastered: 0 };
  allProgs.forEach((p) => { tierCounts[masteryTier(masteryPct(p)).label]++; });
  const totalStarted = allProgs.length;
  const TIER_RANGE = { Learning: "0–19%", Shaky: "20–44%", Familiar: "45–69%", Strong: "70–89%", Mastered: "90–100%" };

  // ---- Full-month activity calendar (navigable by month) ----
  const today = todayStr();
  const [calRef, setCalRef] = useState(() => { const t = new Date(); return { y: t.getUTCFullYear(), m: t.getUTCMonth() }; });
  const nowMonth = (() => { const t = new Date(); return { y: t.getUTCFullYear(), m: t.getUTCMonth() }; })();
  const atCurrentMonth = calRef.y === nowMonth.y && calRef.m === nowMonth.m;
  const firstDow = new Date(Date.UTC(calRef.y, calRef.m, 1)).getUTCDay();
  const daysInMonth = new Date(Date.UTC(calRef.y, calRef.m + 1, 0)).getUTCDate();
  const monthLabel = new Date(Date.UTC(calRef.y, calRef.m, 1)).toLocaleString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });
  const calCells = [];
  for (let i = 0; i < firstDow; i++) calCells.push(null);
  for (let dd = 1; dd <= daysInMonth; dd++) {
    const ds = `${calRef.y}-${String(calRef.m + 1).padStart(2, "0")}-${String(dd).padStart(2, "0")}`;
    calCells.push({ d: dd, ds, n: state.history[ds] || 0 });
  }
  const monthTotal = calCells.reduce((s, c) => s + (c ? c.n : 0), 0);
  const monthActiveDays = calCells.filter((c) => c && c.n > 0).length;
  const calHeat = (n) => (n === 0 ? T.line : n < 3 ? "#bfe6c8" : n < 7 ? "#7cc35a" : n < 15 ? "#39a85a" : "#1f7a3d");
  const shiftMonth = (delta) => setCalRef((r) => { const d = new Date(Date.UTC(r.y, r.m + delta, 1)); return { y: d.getUTCFullYear(), m: d.getUTCMonth() }; });

  const Ring = ({ pct, label, sub }) => (
    <div style={{ flex: 1, background: `linear-gradient(160deg, ${T.panelHi}, ${T.panel})`, border: `1px solid ${T.line}`, borderRadius: 18, padding: "16px 14px", textAlign: "center" }}>
      <div style={{ fontFamily: displayFont, fontSize: 30, color: T.gold, lineHeight: 1 }}>{Math.round(pct * 100)}%</div>
      <div style={{ margin: "10px 0 6px" }}><Bar pct={pct} h={6} /></div>
      <div style={{ fontSize: 12.5, fontWeight: 700 }}>{label}</div>
      <div style={{ fontSize: 11, color: T.textDim, marginTop: 1 }}>{sub}</div>
    </div>
  );

  return (
    <div className="fade">
      {/* completion rings */}
      <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
        <Ring pct={appPct} label="Whole app" sub={`mastery-weighted · ${learned}/${totalApp} learned · ${mastered} mastered`} />
        <Ring pct={levelPct} label={`Level ${level}`} sub={`${levelGuru} / ${levelItems.length} at Guru`} />
      </div>

      {/* key numbers */}
      <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
        <Stat label="Learned" value={learned} color={T.pink} />
        <Stat label="Mastered" value={mastered} color={T.terra} />
        <Stat label="Burned" value={burned} color="#444444" />
        <Stat label="Streak" value={`${streak}🔥`} color={T.gold} />
      </div>

      {/* review pipeline */}
      <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
        <Stat label="Due now" value={due} color={due ? T.red : T.textDim} />
        <Stat label="Next 24h" value={next24} color={T.gold} />
        <Stat label="Next 7 days" value={next7} color={T.goldSoft} />
      </div>

      {/* per-category progress: Vocabulary / Conversations / Verbs */}
      <div style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 16, padding: "16px", marginBottom: 14 }}>
        <div style={{ fontSize: 13, color: T.textDim, marginBottom: 2 }}>Progress by category</div>
        <div style={{ fontSize: 11, color: T.textDim, lineHeight: 1.5, marginBottom: 14 }}>
          Each bar is the whole category — colored by mastery tier, grey for what you haven't learned yet.
        </div>
        {catStats.map((c, ci) => (
          <div key={c.key} style={{ marginBottom: ci < catStats.length - 1 ? 16 : 0, paddingBottom: ci < catStats.length - 1 ? 14 : 0, borderBottom: ci < catStats.length - 1 ? `1px dashed ${T.line}` : "none" }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
              <span style={{ fontSize: 14, fontWeight: 700, color: T.text }}>{c.icon} {c.label}</span>
              <span style={{ fontSize: 11.5, color: T.goldSoft, fontWeight: 700, marginLeft: "auto" }}>
                {c.learned}/{c.total} learned · {Math.round(c.learnedPct * 100)}%
              </span>
            </div>
            {/* stacked tier bar over the full category */}
            <div style={{ display: "flex", height: 10, borderRadius: 8, overflow: "hidden", background: T.line, margin: "9px 0 7px" }}>
              {MASTERY_LEGEND.map((t) => {
                const n = c.tiers[t.label];
                return n > 0 ? <div key={t.label} title={`${t.label}: ${n}`} style={{ width: `${(n / Math.max(1, c.total)) * 100}%`, background: t.color }} /> : null;
              })}
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: "3px 12px", alignItems: "center" }}>
              {MASTERY_LEGEND.map((t) => (
                <span key={t.label} style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 10.5, color: c.tiers[t.label] ? T.text : T.textDim }}>
                  <span style={{ width: 8, height: 8, borderRadius: 3, background: t.color }} />
                  {t.label} <b>{c.tiers[t.label]}</b>
                  {c.learned > 0 && c.tiers[t.label] > 0 && <span style={{ color: T.textDim }}>({Math.round((c.tiers[t.label] / c.learned) * 100)}%)</span>}
                </span>
              ))}
              <span style={{ fontSize: 10.5, color: T.textDim, marginLeft: "auto" }}>mastery {Math.round(c.masteryPct * 100)}%</span>
            </div>
          </div>
        ))}
        <div style={{ fontSize: 10.5, color: T.textDim, lineHeight: 1.5, marginTop: 12, paddingTop: 10, borderTop: `1px dashed ${T.line}` }}>
          Tier percentages are of what you've learned in that category; the "mastery" figure weighs the whole category, unlearned items counting as 0 — the same math as the Whole app ring.
        </div>
      </div>

      {/* mastery breakdown by tier */}
      <div style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 16, padding: "16px", marginBottom: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 12 }}>
          <span style={{ fontSize: 13, color: T.textDim }}>Mastery breakdown</span>
          <span style={{ fontSize: 11.5, color: T.goldSoft, fontWeight: 700 }}>{totalStarted} item{totalStarted === 1 ? "" : "s"} started</span>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
          {MASTERY_LEGEND.map((t) => {
            const n = tierCounts[t.label];
            const frac = totalStarted ? n / totalStarted : 0;
            return (
              <div key={t.label} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ width: 10, height: 10, borderRadius: 3, background: t.color, flexShrink: 0 }} />
                <span style={{ fontSize: 12.5, fontWeight: 700, color: T.text, minWidth: 66 }}>{t.label}</span>
                <span style={{ fontSize: 10.5, color: T.textDim, minWidth: 52 }}>{TIER_RANGE[t.label]}</span>
                <div style={{ flex: 1, height: 7, background: T.line, borderRadius: 7, overflow: "hidden" }}>
                  <div style={{ height: "100%", width: `${frac * 100}%`, background: t.color, transition: "width .3s ease" }} />
                </div>
                <span style={{ fontSize: 13, fontWeight: 700, color: T.text, minWidth: 26, textAlign: "right" }}>{n}</span>
              </div>
            );
          })}
        </div>
        <div style={{ fontSize: 11, color: T.textDim, lineHeight: 1.55, marginTop: 12, paddingTop: 10, borderTop: `1px dashed ${T.line}` }}>
          Mastery is your current run of correct answers across every quiz type — each correct answer adds 1%, a miss resets it to 0. 100 in a row earns full mastery.
        </div>
      </div>

      {/* new words learned */}
      <div style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 16, padding: "16px 16px 12px", marginBottom: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 12 }}>
          <span style={{ fontSize: 13, color: T.textDim }}>New words — last 14 days</span>
          <span style={{ fontSize: 11.5, color: T.goldSoft, fontWeight: 700 }}>{newThisWeek} this week</span>
        </div>
        <MiniBars series={learnSeries} unit="new" />
      </div>

      {/* activity */}
      <div style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 16, padding: "16px 16px 12px", marginBottom: 14 }}>
        <div style={{ fontSize: 13, color: T.textDim, marginBottom: 12 }}>Reviews &amp; lessons — last 14 days</div>
        <MiniBars series={actSeries} unit="answers" />
      </div>

      {/* full-month activity calendar */}
      <div style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 16, padding: "16px", marginBottom: 14 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4 }}>
          <button className="tap" onClick={() => shiftMonth(-1)} aria-label="Previous month" style={{ width: 30, height: 30, borderRadius: 9, border: `1px solid ${T.line}`, background: T.panelHi, color: T.gold, fontSize: 16, fontWeight: 700, lineHeight: 1 }}>‹</button>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 13.5, fontWeight: 700, color: T.text }}>{monthLabel}</div>
            <div style={{ fontSize: 11, color: T.textDim, marginTop: 1 }}>activity calendar</div>
          </div>
          <button className="tap" onClick={() => !atCurrentMonth && shiftMonth(1)} disabled={atCurrentMonth} aria-label="Next month" style={{ width: 30, height: 30, borderRadius: 9, border: `1px solid ${T.line}`, background: T.panelHi, color: atCurrentMonth ? T.line : T.gold, fontSize: 16, fontWeight: 700, lineHeight: 1, cursor: atCurrentMonth ? "default" : "pointer" }}>›</button>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginTop: 10 }}>
          {["S", "M", "T", "W", "T", "F", "S"].map((wd, i) => (
            <div key={i} style={{ textAlign: "center", fontSize: 10, fontWeight: 700, color: T.textDim, paddingBottom: 2 }}>{wd}</div>
          ))}
          {calCells.map((c, i) => c === null ? (
            <div key={"e" + i} />
          ) : (
            <div key={c.ds} title={`${c.ds}: ${c.n} answer${c.n === 1 ? "" : "s"}`} style={{ aspectRatio: "1 / 1", borderRadius: 7, background: calHeat(c.n), border: c.ds === today ? `2px solid ${T.gold}` : `1px solid ${c.n === 0 ? T.line : "transparent"}`, display: "flex", alignItems: "center", justifyContent: "center", position: "relative" }}>
              <span style={{ fontSize: 11, fontWeight: 600, color: c.n >= 3 ? "#fff" : c.n > 0 ? "#1f7a3d" : T.textDim }}>{c.d}</span>
            </div>
          ))}
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 12 }}>
          <span style={{ fontSize: 11, color: T.textDim }}>{monthActiveDays} active day{monthActiveDays === 1 ? "" : "s"} · {monthTotal} answers</span>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 10.5, color: T.textDim }}>
            less
            {[T.line, "#bfe6c8", "#7cc35a", "#39a85a", "#1f7a3d"].map((c, i) => (<span key={i} style={{ width: 11, height: 11, borderRadius: 3, background: c, display: "inline-block" }} />))}
            more
          </span>
        </div>
      </div>

      {/* per-level progress, grouped by category */}
      <div style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 16, padding: "16px" }}>
        <div style={{ fontSize: 13, color: T.textDim, marginBottom: 2 }}>Progress by level</div>
        <div style={{ fontSize: 11, color: T.textDim, lineHeight: 1.5, marginBottom: 12 }}>
          Bar = share learned · % on the right = that level's mastery, colored by its tier.
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10, maxHeight: 400, overflowY: "auto" }}>
          {[
            ["📚 Vocabulary", Array.from({ length: CORE_MAX_LEVEL }, (_, k) => k + 1)],
            ["🗣 Conversations", Array.from({ length: CONV_END - CONV_START + 1 }, (_, k) => CONV_START + k)],
            ["⚡ Verbs", Array.from({ length: MAX_LEVEL - VERB_START + 1 }, (_, k) => VERB_START + k)],
          ].map(([groupLabel, lvls]) => {
            const rows = lvls
              .map((l) => {
                const its = allItems.filter((it) => it.level === l);
                if (!its.length) return null;
                const learnedN = its.filter((it) => prog[it.id]).length;
                const runSum = its.reduce((a, it) => a + masteryPct(prog[it.id]), 0);
                const mPct = Math.round(runSum / its.length); // 0–100, unlearned count as 0
                const tier = masteryTier(mPct);
                const locked = l > level && l < CONV_START;
                const done = learnedN === its.length && mPct >= 90;
                return { l, its, learnedN, mPct, tier, locked, done };
              })
              .filter(Boolean);
            if (!rows.length) return null;
            return (
              <div key={groupLabel}>
                <div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "4px 0 8px", position: "sticky", top: 0, background: T.panel, paddingBottom: 2 }}>{groupLabel}</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {rows.map(({ l, its, learnedN, mPct, tier, locked, done }) => (
                    <div key={l} style={{ opacity: locked ? 0.5 : 1 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", gap: 8, fontSize: 11.5, marginBottom: 4 }}>
                        <span style={{ color: T.text, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{locked ? "🔒 " : done ? "✓ " : ""}{l < CONV_START ? `Lv ${l} · ` : ""}{(LEVEL_TITLES[l] || `Lv ${l}`).replace(/^Conversations: /, "").replace(/^Verbs — /, "")}</span>
                        <span style={{ color: T.textDim, whiteSpace: "nowrap" }}>
                          {learnedN}/{its.length} · <b style={{ color: learnedN ? tier.color : T.textDim }}>{mPct}%</b>
                        </span>
                      </div>
                      <Bar pct={its.length ? learnedN / its.length : 0} h={5} />
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ===================== REVIEWS HUB (choose what to review) ===================== */
function ReviewsHub({ dueLetters, dueWords, duePhrases, dueSentences, onLetters, onVocab, onGotoItems, onGotoScript }) {
  const totalVocab = dueWords.length + duePhrases.length + dueSentences.length;
  const totalAll = totalVocab + dueLetters;

  const Card = ({ label, sub, n, onTap, color }) => (
    <button className="tap" onClick={() => n > 0 && onTap()} style={{ width: "100%", textAlign: "left", display: "flex", alignItems: "center", gap: 14, marginBottom: 10, borderRadius: 16, padding: "15px 16px", cursor: n > 0 ? "pointer" : "default", border: n > 0 ? "none" : `1px solid ${T.line}`, background: n > 0 ? `linear-gradient(135deg, ${color || T.gold}, ${T.terra})` : T.panel, color: n > 0 ? "#fff" : T.textDim, boxShadow: n > 0 ? "0 8px 20px rgba(128,29,92,.16)" : "none" }}>
      <div style={{ fontSize: 26, fontWeight: 800, minWidth: 38, textAlign: "center" }}>{n}</div>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 15, fontWeight: 700 }}>{label}</div>
        <div style={{ fontSize: 11.5, opacity: 0.85, marginTop: 1 }}>{sub}</div>
      </div>
      <div style={{ fontSize: 18, opacity: 0.8 }}>{n > 0 ? "›" : ""}</div>
    </button>
  );

  return (
    <div className="fade">
      <div style={{ fontFamily: displayFont, fontSize: 21, marginBottom: 4 }}>What do you want to review?</div>
      <div style={{ fontSize: 12.5, color: T.textDim, marginBottom: 16 }}>
        {totalAll > 0 ? `${totalAll} item${totalAll === 1 ? "" : "s"} due across the app.` : "Nothing is due right now — great job. Check back later."}
      </div>

      <Card label="Letters (script)" sub="Due alphabet reviews" n={dueLetters} onTap={onLetters} color={T.pink} />
      <Card label="Words" sub="Single-word vocabulary" n={dueWords.length} onTap={() => onVocab(dueWords)} />
      <Card label="Phrases" sub="Short expressions" n={duePhrases.length} onTap={() => onVocab(duePhrases)} />
      <Card label="Sentences" sub="Full sentences" n={dueSentences.length} onTap={() => onVocab(dueSentences)} />
      <Card label="All vocabulary" sub="Words + phrases + sentences" n={totalVocab} onTap={() => onVocab([...dueWords, ...duePhrases, ...dueSentences])} color={T.gold} />

      <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 8 }}>
        <button className="tap" onClick={onGotoItems} style={{ width: "100%", padding: 12, borderRadius: 12, border: `1px dashed ${T.gold}`, background: `${T.gold}0d`, color: T.gold, fontSize: 13, fontWeight: 600 }}>
          ✓ Choose specific words to quiz →
        </button>
        <button className="tap" onClick={onGotoScript} style={{ width: "100%", padding: 12, borderRadius: 12, border: `1px dashed ${T.gold}`, background: `${T.gold}0d`, color: T.gold, fontSize: 13, fontWeight: 600 }}>
          ✓ Choose specific letters to quiz →
        </button>
      </div>
    </div>
  );
}

/* ===================== APP ===================== */
function App() {
  const [state, setState] = useState(null);
  const [view, setView] = useState("home");
  const [practiceItems, setPracticeItems] = useState([]);
  const [reviewRun, setReviewRun] = useState([]);
  const [scriptAuto, setScriptAuto] = useState(false);
  const [detailItem, setDetailItem] = useState(null);

  const stateRef = useRef(state);
  useEffect(() => { stateRef.current = state; }, [state]);

  useEffect(() => {
    let mounted = true;
    (async () => {
      const loaded = await loadState();
      let s = loaded || DEFAULT_STATE;
      if (s.daily?.date !== todayStr()) s = { ...s, daily: { date: todayStr(), reviews: 0, lessons: 0 } };
      s = { ...DEFAULT_STATE, ...s, settings: { ...DEFAULT_STATE.settings, ...(s.settings || {}) } };
      // Apply the "unlock when fully learned" rule to existing progress on load.
      s = { ...s, currentLevel: nextUnlockedLevel(s.progress || {}, s.currentLevel || 1) };

      /* One-time move of voice recordings out of the state blob and into
         IndexedDB. Keeping them in localStorage is what used to fill it up and
         make every later save fail silently, so this runs before anything else
         gets written. Whatever survived in the old blob is copied across, then
         dropped from state so the blob shrinks back to a sane size. */
      const legacy = s.recordings && Object.keys(s.recordings).length ? s.recordings : null;
