function hardRefresh() {

    const base = location.href.split("?")[0].split("#")[0];

function mnSkeleton(s) {
  return (s || "").toLowerCase()
    .replace(/[^a-z]/g, "")
    .replace(/(kh|gh|sh|th|dh|ch)/g, (m) => m[0])
    .replace(/(.)\1+/g, "$1")
    .replace(/q/g, "k").replace(/c/g, "k").replace(/x/g, "k")
    .replace(/y/g, "i").replace(/w/g, "u")
    .replace(/ee/g, "i").replace(/oo/g, "u").replace(/aa/g, "a");
}
// Best-matching picturable English word for a romanization (longest shared start).
function soundalike(tr) {
  const sk = mnSkeleton(tr);
  if (!sk) return null;
  let best = null, bestLen = 1;
  for (const w of PICTURE_WORDS) {
    const wsk = mnSkeleton(w);
    let n = 0;
    while (n < sk.length && n < wsk.length && sk[n] === wsk[n]) n++;
    if (n > bestLen) { bestLen = n; best = w; }
  }
  if (best) return best;
  const first = sk[0];
  return PICTURE_WORDS.find((w) => mnSkeleton(w)[0] === first) || null;
}
// Break a romanization into pronounceable beats (chunking aids recall).
function syllableBeats(tr) {
  return (tr || "").trim().split(/\s+/).map((w) => {
    const parts = w.match(/[^aeiou\s]*[aeiou]+[^aeiou\s]*?(?=[^aeiou\s][aeiou])|[^aeiou\s]*[aeiou]+[^aeiou\s]*|[^aeiou\s]+/gi);
    return parts ? parts.join("\u2011") : w;
  }).join("  ");
}
// Build the right kind of mnemonic for an item (link method vs chunk-and-story).
function wordMnemonic(item) {
  if (!item) return null;
  const beats = syllableBeats(item.tr);
  const multi = item.type !== "word" || (item.tr || "").trim().includes(" ");
  if (multi) return { kind: "story", beats, meaning: item.en };
  return { kind: "link", beats, like: soundalike(item.tr), meaning: item.en };

/* ---- Pronunciation (Web Speech API — uses the device's Arabic voice) ---- */
/* ============================================================
   Pronunciation engine
   ------------------------------------------------------------
   Browser Arabic voices are almost always Modern Standard Arabic
   and receive our unvocalized dictionary spelling, so they guess
   MSA vowels — which sounds very different from real Masri.
   Fix: for every word we know, speak a FULLY VOCALIZED phonetic
   respelling generated from its Egyptian transliteration (correct
   vowels, shaddas, glottal stops), and let the user pick the best
   Arabic voice on their device (some have a true ar-EG voice).
   ============================================================ */
const SPEECH_PREFS = { phonetic: true, voiceURI: null, recorded: true }; // synced from settings by App

/* ---- Recorded Egyptian audio ----
   If the repo contains audio/<item id>.mp3 (real Egyptian TTS or recordings),
   speak() plays that file and only falls back to the phonetic speech engine
   when no recording exists. Missing files are remembered so we don't refetch. */
const AUDIO_BASE = "audio/";
let AUDIO_ID_BY_AR = {}; // dictionary spelling → item id (built after ITEMS)
const AUDIO_STATUS = {}; // id → "ok" | "missing"
let AUDIO_SET = null; // Set of ids that have a recording (from audio_manifest.json), null until loaded
let CURRENT_AUDIO = null;
function playRecorded(id, onFail) {
  if (AUDIO_STATUS[id] === "missing") { onFail(); return; }
  if (AUDIO_SET && !AUDIO_SET.has(id)) { onFail(); return; } // manifest says no recording — skip the fetch
  try {
    if (CURRENT_AUDIO) { try { CURRENT_AUDIO.pause(); } catch {} CURRENT_AUDIO = null; }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    const a = new Audio(AUDIO_BASE + id + ".mp3");
    CURRENT_AUDIO = a;
    a.onerror = () => { AUDIO_STATUS[id] = "missing"; onFail(); };
    a.play().then(() => { AUDIO_STATUS[id] = "ok"; }).catch((err) => {
      // A blocked autoplay isn't a missing file — only cache real load failures.
      if (!err || err.name !== "NotAllowedError") AUDIO_STATUS[id] = "missing";
      onFail();
    });
  } catch { onFail(); }
}

const H_FATHA = "\u064E", H_KASRA = "\u0650", H_DAMMA = "\u064F", H_SUKUN = "\u0652", H_SHADDA = "\u0651";
const TR_DIGRAPHS = { sh: "ش", kh: "خ", gh: "غ", th: "ث", dh: "ذ" };
const TR_CONS = {
  b: "ب", t: "ت", g: "ج", j: "ج", d: "د", r: "ر", z: "ز", s: "س", f: "ف", q: "ق",
  k: "ك", l: "ل", m: "م", n: "ن", h: "ه", w: "و", y: "ي", p: "ب", v: "ف", c: "ك",
  "ʿ": "ع", "ʕ": "ع", "3": "ع", "7": "ح", "5": "خ", "2": "ء",
  "ʾ": "ء", "'": "ء", "`": "ء", "’": "ء", "ʼ": "ء", "ʔ": "ء",
};
const TR_VOWELS = { a: "a", e: "i", i: "i", o: "u", u: "u" }; // vowel class

// Parse one transliterated word into consonant/vowel tokens. Null if unparseable.
function trTokens(word) {
  const toks = [];
  let i = 0;
  const w = word.toLowerCase();
  while (i < w.length) {
    const two = w.slice(i, i + 2);
    if (TR_DIGRAPHS[two]) { toks.push({ c: TR_DIGRAPHS[two] }); i += 2; continue; }
    const ch = w[i];
    if (TR_VOWELS[ch]) {
      const cls = TR_VOWELS[ch];
      const long = TR_VOWELS[w[i + 1]] === cls; // doubled vowel = long (aa, ee, ii, oo, uu)
      toks.push({ v: cls, long });
      i += long ? 2 : 1;
      continue;
    }
    if (TR_CONS[ch]) { toks.push({ c: TR_CONS[ch] }); i += 1; continue; }
    if (ch === "-" || ch === "·") { i += 1; continue; }
    return null; // unknown symbol — caller falls back to dictionary spelling
  }
  return toks;
}

// Emit a fully vocalized Arabic respelling for one word's tokens.
function trWordToArabic(word) {
  const toks = trTokens(word);
  if (!toks || !toks.length) return null;
  let out = "";
  let i = 0;
  const emitVowel = (v, isFinal) => {
    const mater = v.long || isFinal; // word-final short vowels get a mater letter so TTS voices them
    if (v.v === "a") return H_FATHA + (mater ? "ا" : "");
    if (v.v === "i") return H_KASRA + (mater ? "ي" : "");
    return H_DAMMA + (mater ? "و" : "");
  };
  // Word-initial vowel rides a hamza carrier (Arabic can't start with a bare vowel).
  let firstCons = true;
  if (toks[0].v) {
    const v = toks[0];
    if (v.v === "a") out += v.long ? "آ" : "أ" + H_FATHA;
    else if (v.v === "i") out += "إ" + H_KASRA + (v.long ? "ي" : "");
    else out += "أ" + H_DAMMA + (v.long ? "و" : "");
    i = 1;
    firstCons = false; // word starts with a vowel, so no initial cluster to soften
  }
  while (i < toks.length) {
    const t = toks[i];
    if (t.v) { // vowel with no consonant to sit on (rare) — ride a hamza
      out += "ء" + emitVowel(t, i === toks.length - 1);
      i += 1;
      continue;
    }
    let gem = false;
    if (toks[i + 1] && toks[i + 1].c === t.c) { gem = true; i += 1; } // doubled consonant → shadda
    out += t.c + (gem ? H_SHADDA : "");
    const nxt = toks[i + 1];
    if (nxt && nxt.v) {
      out += emitVowel(nxt, i + 1 === toks.length - 1);
      i += 2;
    } else {
      // No vowel follows. A word-initial cluster (Masri "shwaya") gets a light helping
      // kasra so MSA voices don't choke on a leading sukun; otherwise sukun.
      out += firstCons && nxt ? H_KASRA : H_SUKUN;
      i += 1;
    }
    firstCons = false;
  }
  return out;
}

// Full transliteration (may be several words) → vocalized Arabic speech text.
// `ar` (the dictionary spelling) recovers consonants the romanization can't express:
// plain "h/s/t/d/z" become ح/ص/ط/ض/ظ, and vowel-initial words regain their ع,
// wherever the real spelling uses them. Each rule lists the dictionary letters that
// CONFIRM the soft reading ("stay") vs the letter that upgrades it ("to").
const TWIN_RULES = {
  "ه": { stay: "هة", to: "ح", out: "ح" },
  "س": { stay: "سث", to: "ص", out: "ص" },
  "ت": { stay: "تة", to: "ط", out: "ط" },
  "د": { stay: "دذ", to: "ض", out: "ض" },
  "ز": { stay: "زذ", to: "ظ", out: "ظ" },
  "أ": { stay: "أإءاقئؤآى", to: "ع", out: "ع" },
  "إ": { stay: "أإءاقئؤآى", to: "ع", out: "ع" },
  "ء": { stay: "أإءاقئؤآى", to: "ع", out: "ع" }, // glottal from ق stays glottal — that's the Masri reading
  "آ": { stay: "أإءاقئؤآى", to: "ع", out: "ع" + "\u064E" + "ا" },
};
function emphaticFix(speech, ar) {
  if (!ar) return speech;
  let p = 0; // scan pointer into the dictionary spelling
  let out = "";
  for (const ch of speech) {
    const rule = TWIN_RULES[ch];
    if (!rule) { out += ch; continue; }
    let iStay = -1;
    for (const sc of rule.stay) { const k = ar.indexOf(sc, p); if (k !== -1 && (iStay === -1 || k < iStay)) iStay = k; }
    const iHard = ar.indexOf(rule.to, p);
    if (iHard !== -1 && (iStay === -1 || iHard < iStay)) { out += rule.out; p = iHard + 1; }
    else { out += ch; if (iStay !== -1) p = iStay + 1; }
  }
  return out;
}
function trToSpeech(tr, ar) {
  if (!tr || tr === "—") return null;
  const words = tr.replace(/[?!.,؟،()"]/g, "").trim().split(/\s+/);
  const parts = [];
  for (const w of words) {
    let a = trWordToArabic(w);
    if (!a) return null; // any unparseable word → use the dictionary spelling instead
    if (a[0] === "ء") a = "أ" + a.slice(1); // word-initial glottal stop rides an alef seat
    parts.push(a);
  }
  return emphaticFix(parts.join(" "), ar);
}

// Built after ITEMS is defined: dictionary Arabic → transliteration.
let SPEECH_BY_AR = {};

function pickVoice(voices) {
  if (SPEECH_PREFS.voiceURI) {
    const chosen = voices.find((x) => x.voiceURI === SPEECH_PREFS.voiceURI);
    if (chosen) return chosen;
  }
  return (
    voices.find((x) => x.lang && x.lang.toLowerCase().startsWith("ar-eg")) ||
    voices.find((x) => x.lang && x.lang.toLowerCase().startsWith("ar")) || null
  );
}

function speakTTS(text) {
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    // Speak the vocalized Masri respelling when we know this word and the engine is on.
    let say = text;
    if (SPEECH_PREFS.phonetic && SPEECH_BY_AR[text]) {
      const ph = trToSpeech(SPEECH_BY_AR[text], text);
      if (ph) say = ph;
    }
    const u = new SpeechSynthesisUtterance(say);
    const voices = window.speechSynthesis.getVoices() || [];
    const v = pickVoice(voices);
    if (v) u.voice = v;
    u.lang = v ? v.lang : "ar-EG";
    u.rate = 0.82;
    window.speechSynthesis.speak(u);
  } catch {
    /* ignore */
  }
}

function playDataURL(url) {
  try {
    if (CURRENT_AUDIO) { try { CURRENT_AUDIO.pause(); } catch {} }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    const a = new Audio(url);
    CURRENT_AUDIO = a;
    a.play().catch(() => {});
  } catch {}
}
/* Own-voice clips live in IndexedDB, which is async — and Safari will refuse to
   start audio that begins after an await, because by then it no longer counts as
   a response to your tap. So they're pulled into memory once at startup and
   played straight from here. */
const MY_REC = {};
function primeMyRecordings(ids) {
  (ids || []).forEach((id) => { if (!(id in MY_REC)) recGet(id).then((v) => { if (v) MY_REC[id] = v; }); });
}
function speak(text) {
  const id = AUDIO_ID_BY_AR[text];
  // Per-word choice: if you picked your own recording for this word, play that.
  if (id && REC_API && REC_API.pref(id) === "mine") {
    if (MY_REC[id]) { playDataURL(MY_REC[id]); return; }
    recGet(id).then((v) => { if (v) { MY_REC[id] = v; playDataURL(v); } else speakTTS(text); });
    return;
  }
  if (SPEECH_PREFS.recorded && id) playRecorded(id, () => speakTTS(text));
  else speakTTS(text);
}

function Speaker({ text, size = 18, color = "#c02e80" }) {

function distinctForms(glyph) { return NONCONNECT.has(glyph) ? ["iso", "fin"] : ["iso", "ini", "med", "fin"]; }
function effForm(glyph, form) { if (NONCONNECT.has(glyph)) { if (form === "ini") return "iso"; if (form === "med") return "fin"; } return form; }
function formKeyOf(glyph, form) { return glyph + ":" + effForm(glyph, form); }
function formToken(glyph, form, row) {
  const ef = effForm(glyph, form);
  const shape = letterForms(glyph)[ef];
  const key = glyph + ":" + ef;
  const t = [glyph, row[1], row[2], row[3], shape, key, FORM_LABEL[ef]];
  t.glyph = glyph; t.form = ef; t.shape = shape; t.key = key; t.label = FORM_LABEL[ef];
  return t;
}

}

/* ---- Word → letter breakdown ----
   Splits an Arabic string into the individual letters you'd type, working out each
   letter's positional shape (isolated/initial/medial/final) from how Arabic joins.
   Letter variants (hamza-carriers, taa marbuta, alef maksura…) map to a base letter
   so the trace guide can still be opened. */
const ZWJ_ = "\u200d";
const NOLEFTJOIN = new Set(["ا", "د", "ذ", "ر", "ز", "و", "أ", "إ", "آ", "ٱ", "ة", "ى", "ؤ", "ء"]);
const LETTER_VARIANTS = {
  "أ": ["ا", "alef + hamza"], "إ": ["ا", "alef + hamza"], "آ": ["ا", "alef madda"], "ٱ": ["ا", "alef wasla"],
  "ة": ["ه", "taa marbuta"], "ى": ["ي", "alef maksura"], "ؤ": ["و", "waw + hamza"], "ئ": ["ي", "yaa + hamza"], "ء": [null, "hamza"],
};
function isArabicLetter(ch) { return /[\u0621-\u064A\u0671]/.test(ch); }
function alphaIndexOf(glyph) { return ALPHABET.findIndex((a) => a[0] === glyph); }
function canJoinLeft(ch) { return isArabicLetter(ch) && !NOLEFTJOIN.has(ch); }

/* ---- Harakat (the short-vowel & helper marks) ----
   These are combining marks that sit on a letter rather than standing alone. */
const HARAKAT = {
  "\u064E": { ch: "\u064E", name: "Fatha", tr: "a", info: "A short “a” sound. Written as a small diagonal stroke above the letter." },
  "\u0650": { ch: "\u0650", name: "Kasra", tr: "i", info: "A short “i”/“e” sound. Written as a small diagonal stroke below the letter." },
  "\u064F": { ch: "\u064F", name: "Damma", tr: "u", info: "A short “u”/“o” sound. Written as a tiny waw (و) above the letter." },

// teaching order: the everyday core first, then tanwin/rare
const HARAKAT_LIST = ["\u064E", "\u0650", "\u064F", "\u0652", "\u0651", "\u064B", "\u064D", "\u064C", "\u0670"];
const HARAKAT_EXAMPLES = {

function isHaraka(ch) { return Object.prototype.hasOwnProperty.call(HARAKAT, ch); }
// Normalize a stored mark progress: object as-is, legacy `true` → a minimal learned progress, else null.
function markProg(v) {
  if (!v) return null;
  if (typeof v === "object") return v;
  return { stage: 1, correct: 0, wrong: 0, recentWrong: 0 };

function breakWord(ar) {
  const chars = Array.from(ar || "");
  // group combining marks onto the letter they sit on
  const tokens = []; // {type:'letter',ch,marks:[]} | {type:'space'} | {type:'other',ch}
  for (const c of chars) {
    if (isHaraka(c)) {
      for (let j = tokens.length - 1; j >= 0; j--) { if (tokens[j].type === "letter") { tokens[j].marks.push(c); break; } break; }
      continue;
    }
    if (c === " ") tokens.push({ type: "space" });
    else if (!isArabicLetter(c)) tokens.push({ type: "other", ch: c });
    else tokens.push({ type: "letter", ch: c, marks: [] });
  }
  const out = [];
  let prevLetter = null;
  for (let ti = 0; ti < tokens.length; ti++) {
    const t = tokens[ti];
    if (t.type === "space") { out.push({ space: true }); prevLetter = null; continue; }
    if (t.type === "other") { out.push({ other: true, ch: t.ch }); prevLetter = null; continue; }
    let nextLetter = null;
    for (let tj = ti + 1; tj < tokens.length; tj++) { if (tokens[tj].type !== "letter") break; nextLetter = tokens[tj]; break; }
    const c = t.ch;
    let joinsPrev = !!prevLetter && canJoinLeft(prevLetter.ch);
    let joinsNext = canJoinLeft(c) && !!nextLetter;
    if (c === "ء") { joinsPrev = false; joinsNext = false; }
    const form = joinsPrev && joinsNext ? "med" : joinsPrev ? "fin" : joinsNext ? "ini" : "iso";
    const marksStr = t.marks.join("");
    const shape = (joinsPrev ? ZWJ_ : "") + c + marksStr + (joinsNext ? ZWJ_ : "");
    let base = c, name = null;
    if (LETTER_VARIANTS[c]) { base = LETTER_VARIANTS[c][0]; name = LETTER_VARIANTS[c][1]; }
    const ai = base ? alphaIndexOf(base) : -1;
    let tr = "";
    if (ai >= 0) { if (!name) name = ALPHABET[ai][1]; tr = ALPHABET[ai][2]; }
    const marks = t.marks.map((m) => HARAKAT[m]).filter(Boolean);
    out.push({ ch: c, shape, form, idx: ai, name: name || "", tr: tr || "", marks });
    prevLetter = t;
  }
  return out;
}
// all unique marks present in a string, in teaching order
function marksInWord(ar) {
  const present = new Set(Array.from(ar || "").filter(isHaraka));
  return HARAKAT_LIST.filter((m) => present.has(m)).map((m) => HARAKAT[m]);
}

/* ===================== ARABIZI / FRANCO-ARABIC =====================
   Arabizi is how Egyptians actually text: Latin letters plus digits that stand
   in for the Arabic sounds with no Latin equivalent — 3 = ع, 7 = ح, 5 = خ,
   2 = the glottal stop (ء, and ق in Cairo speech).

   Every card's Arabizi is generated from its Arabic spelling + transliteration
   rather than stored by hand, so it stays correct when a card is edited.
   The transliteration marks ح with a capital H (and ص ط ض ظ with S T D Z), which
   is what lets us tell ح apart from ه; where a card uses a plain lowercase h we
   fall back to lining the h's up against the Arabic spelling, in order.        */

// The h-class letters in the Arabic spelling, in order: ح -> "7", ه -> "h".
function hClassOf(ar) {
  const out = [];
  for (const ch of ar || "") {
    if (ch === "\u062D") out.push("7");
    else if (ch === "\u0647") out.push("h");
  }
  return out;
}

function toArabizi(ar, tr) {
  if (!tr || tr === "\u2014" || tr === "-") return "";
  const src = String(tr);
  const toks = [];
  let i = 0;
  while (i < src.length) {
    // A digraph only counts when the second letter is a lowercase h — a capital H
    // is the marker for ح, so "betHebb" is bet+7ebb, not be+th+ebb.
    const two = src[i + 1] === "h" ? src.slice(i, i + 2).toLowerCase() : "";
    if (two === "kh") { toks.push({ t: "5" }); i += 2; continue; }
    if (two === "sh") { toks.push({ t: "sh" }); i += 2; continue; }
    if (two === "gh") { toks.push({ t: "gh" }); i += 2; continue; }
    if (two === "th") { toks.push({ t: "th" }); i += 2; continue; }
    if (two === "dh") { toks.push({ t: "dh" }); i += 2; continue; }
    const c = src[i];
    if (c === "\u02BF" || c === "\u02BB" || c === "\u02D5") { toks.push({ t: "3" }); i++; continue; }              // ʿ ayin
    if (c === "\u02BE" || c === "\u02BC" || c === "'" || c === "\u2019") { toks.push({ t: "2" }); i++; continue; } // ʾ hamza
    if (c === "H") { toks.push({ t: "7", hc: true }); i++; continue; }                                             // ح
    if (c === "h") { toks.push({ hc: true }); i++; continue; }                                                     // ح or ه — resolved below
    if (c === "S" || c === "T" || c === "D" || c === "Z") { toks.push({ t: c.toLowerCase() }); i++; continue; }    // ص ط ض ظ
    toks.push({ t: c.toLowerCase() });
    i++;
  }
  const hs = hClassOf(ar);
  const idx = toks.map((t, k) => (t.hc ? k : -1)).filter((k) => k >= 0);
  const hasHa = hs.includes("7"), hasHe = hs.includes("h");
  const aligned = hs.length === idx.length;
  idx.forEach((k, n) => {
    if (toks[k].t === "7") return;                 // a capital H is already certain
    let v;
    if (aligned) v = hs[n];
    else if (hasHa && !hasHe) v = "7";
    else if (hasHe && !hasHa) v = "h";
    else v = "h";
    toks[k] = { t: v };
  });
  return toks.map((t) => t.t).join("");
}

/* Canonical Arabizi, used for grading. Franco spelling is personal — one person
   writes "7abibi", another "habibi", another "habeebe" — so both the expected
   answer and what you typed get folded down to the same skeleton before they're
   compared. Anything that's genuinely the same word counts as right. */
function normAz(s) {
  if (!s) return "";
  let x = String(s).toLowerCase();
  x = x.replace(/[\u02BF\u02BB\u02D5]/g, "3");   // ʿ ayin-type marks read as the Arabizi 3
  x = x.replace(/[\u02BE\u02BC\u2019`]/g, "'");  // ʾ hamza-type marks — optional, stripped below
  x = x.replace(/7'/g, "kh").replace(/5/g, "kh").replace(/x/g, "kh");
  x = x.replace(/3'/g, "gh").replace(/8'/g, "gh");
  x = x.replace(/9'/g, "d").replace(/6'/g, "z").replace(/9/g, "s").replace(/6/g, "t");
  x = x.replace(/7/g, "h");
  x = x.replace(/[2q8]/g, "");        // glottal stop — often just left out when texting
  x = x.replace(/[^a-z0-9 ]/g, "");   // apostrophes, hyphens, question marks
  x = x.replace(/e/g, "i").replace(/o/g, "u");
  x = x.replace(/(.)\1+/g, "$1");     // collapse doubles
  x = x.replace(/\s+/g, " ").trim();
  return x;
}

// Does a typed Arabizi answer match this card? Accepts the card's own Arabizi,
// its transliteration read as Arabizi, and any alternate spellings it carries.
function azMatches(input, item) {
  const g = normAz(input);
  if (!g || !item) return false;
  const forms = [item.az || toArabizi(item.ar, item.tr), item.tr, ...(item.azAlts || []), ...(item.alts || [])];
  return forms.some((f) => f && normAz(f) === g);
}

/* ---- Live item lookup ----
   A lesson or quiz keeps its queue in component state, so the item objects it
   captured when the session started would otherwise go stale the instant you
   correct a card mid-session. App rebuilds this map on every render from the
   edited item list; anything that displays or grades a card passes it through
   live() first. That's what makes an edit show up immediately — in the lesson
   you're in, the review you're in, the custom quiz, the item list, everywhere. */
let LIVE_ITEMS = new Map();
function live(it) {

// And to its item id, for recorded audio files (audio/<id>.mp3). First entry wins.
AUDIO_ID_BY_AR = {};
ITEMS.forEach((it) => { if (it.ar && !(it.ar in AUDIO_ID_BY_AR)) AUDIO_ID_BY_AR[it.ar] = it.id; });
// A level is unlocked as soon as EVERY item in the current level has been learned
// (has any progress). Climb as far as that holds so unlocking is always immediate.
function nextUnlockedLevel(progress, cur) {
  let lvl = cur;
  while (lvl < CORE_MAX_LEVEL) {
    const items = ITEMS.filter((it) => it.level === lvl);
    if (items.length && items.every((it) => progress[it.id])) lvl += 1;
    else break;
  }
  return lvl;
}

/* ---- Arabic answer normalization (forgiving grading) ---- */
function normTr(s) {
  if (!s) return "";
  return s
    .toLowerCase()
    .replace(/[ʿʾʼʔʕ'`’ʻ]/g, "")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9 ]/g, "")
    .replace(/(.)\1+/g, "$1") // collapse doubled letters (habiibi -> habibi)
    .replace(/\s+/g, " ")
    .trim();
}
function normAr(s) {
  if (!s) return "";
  return s
    .replace(/[\u064B-\u0652\u0670]/g, "")
    .replace(/\u0640/g, "")
    .replace(/[إأآا]/g, "ا")
    .replace(/ى/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/ؤ/g, "و")
    .replace(/ئ/g, "ي")
    .replace(/ء/g, "")
    .replace(/[^\u0600-\u06FF ]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}
function answerMatches(input, item) {
  const a = normAr(input);
  if (!a) return false;
  if (a === normAr(item.ar)) return true;
  return (item.alts || []).some((x) => normAr(x) === a);
}

/* ---- SRS stages (WaniKani-style) ---- */
const STAGE_MS = {
  1: 2 * HOUR,
  2: 4 * HOUR,
  3: 8 * HOUR,
  4: 23 * HOUR,
  5: 3 * DAY,
  6: 7 * DAY,
  7: 14 * DAY,
  8: 30 * DAY,
  9: Infinity,
};
function stageMeta(stage) {
  if (stage >= 9) return { group: "Burned", short: "Burned", color: T.textDim };
  if (stage >= 8) return { group: "Enlightened", short: "Enlightened", color: T.goldSoft };
  if (stage >= 7) return { group: "Master", short: "Master", color: T.gold };
  if (stage >= 5) return { group: "Guru", short: "Guru " + (stage - 4), color: T.terra };
  if (stage >= 1) return { group: "Apprentice", short: "Apprentice " + stage, color: T.pink };
  return { group: "Locked", short: "—", color: T.textDim };
}
const STAGE_GROUPS = ["Apprentice", "Guru", "Master", "Enlightened", "Burned"];
function learnItem(now) {
  return { stage: 1, due: now + STAGE_MS[1], correct: 0, wrong: 0, recentWrong: 0, run: 0, learnedAt: now };
}
function reviewSchedule(prog, correct, now) {
  let stage = prog ? prog.stage : 1;
  // Correct → climb one rung. Miss → lose half your progress (50% setback), rounded.
  stage = correct ? Math.min(9, stage + 1) : Math.max(1, Math.round(stage / 2));
  const ms = STAGE_MS[stage];
  return {
    stage,
    due: ms === Infinity ? Infinity : now + ms,
    lastReviewed: now,
    learnedAt: prog ? prog.learnedAt : now,
    correct: (prog ? prog.correct : 0) + (correct ? 1 : 0),
    wrong: (prog ? prog.wrong : 0) + (correct ? 0 : 1),
    recentWrong: correct ? 0 : (prog ? prog.recentWrong || 0 : 0) + 1,
    run: prog ? prog.run || 0 : 0, // mastery run is bumped per-answer, preserved here
  };
}
// Bump an item's mastery run: +1 for a correct answer (capped at 100), reset to 0 on a miss.
function bumpRun(prog, ok) {
  const base = prog || {};
  return { ...base, run: ok ? Math.min(100, (base.run || 0) + 1) : 0 };
}
function isLeech(prog) {
  return !!prog && (prog.recentWrong || 0) >= 2;
}
// Mastery 0–100% = your current run of consecutive correct answers (capped at 100).
function masteryPct(prog) {
  if (!prog) return 0;
  return Math.max(0, Math.min(100, prog.run || 0));
}
// Tier colour for the mastery run (Learning → Mastered).
function masteryColor(prog) {
  if (!prog) return null;
  return masteryTier(masteryPct(prog)).color;
}
function masteryLabel(prog) {
  if (!prog) return "";
  return masteryTier(masteryPct(prog)).label.toLowerCase();
}
// An item counts as "mastered" once its run reaches the Mastered tier (90%+).
function isMastered(prog) { return !!prog && masteryPct(prog) >= 90; }
function fmtUntil(due, now) {
  if (due === Infinity) return "burned";
  const d = due - now;
  if (d <= 0) return "now";
  if (d < HOUR) return Math.max(1, Math.round(d / 60000)) + "m";
  if (d < DAY) return Math.round(d / HOUR) + "h";
  return Math.round(d / DAY) + "d";
}

/* ===================== STORAGE =====================
   Two stores, on purpose.

   Progress, edits and settings are small, so they live in localStorage as one
   JSON blob. Voice recordings are not small — a 10-second clip is ~40 KB once
   it's base64'd, so a few dozen of them will blow past the ~5 MB localStorage
   limit. They used to sit in the same blob, which meant that once you'd recorded
   enough, every save threw QuotaExceededError and the app quietly dropped
   everything you did afterwards, corrections included. So recordings now live in
   IndexedDB (no practical size limit) and the state blob only keeps a list of
   which items have one. Backups still bundle both together. */

const IDB_NAME = "masri-media", IDB_STORE = "recordings";
let _idb = null;
function idb() {
  if (_idb) return _idb;
  _idb = new Promise((resolve) => {
    try {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    } catch { resolve(null); }
  });
  return _idb;
}
function idbRun(mode, fn) {
  return idb().then((db) => {
    if (!db) return null;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(IDB_STORE, mode);
        const req = fn(tx.objectStore(IDB_STORE));
        tx.onabort = tx.onerror = () => resolve(null);
        if (req) req.onsuccess = () => resolve(req.result);
        else tx.oncomplete = () => resolve(true);
      } catch { resolve(null); }
    });
  });
}
const recGet = (id) => idbRun("readonly", (s) => s.get(id));
const recPut = (id, url) => idbRun("readwrite", (s) => s.put(url, id));
const recDel = (id) => idbRun("readwrite", (s) => s.delete(id));
const recKeys = () => idbRun("readonly", (s) => s.getAllKeys()).then((k) => k || []);
// Pull every recording out as {id: dataURL} — used when building a backup.
async function recDump(ids) {
  const out = {};
  for (const id of ids || await recKeys()) { const v = await recGet(id); if (v) out[id] = v; }
  return out;
}
async function recLoad(map) {
  for (const [id, url] of Object.entries(map || {})) { if (url) await recPut(id, url); }
}

async function loadState(){ try{ const v=localStorage.getItem(STORE_KEY); return v?JSON.parse(v):null; }catch{ return null; } }
async function saveState(state){

  catch(e){ SAVE_ERR = (e && e.name === "QuotaExceededError") ? "Storage is full — recent changes may not have been saved. Download a backup, then use Reset." : "Couldn't save to this browser's storage."; return false; }
}
// A backup carries everything — progress, corrections, custom cards, settings and
// your recordings — except the GitHub token. Recordings live in IndexedDB, so this
// has to be async: it reads them back out and inlines them in the file.
async function exportState(state, withVoice = true){

/* ===================== TYPED QUIZ (reused everywhere) ===================== */
function TypedQuiz({ items, mode, onGrade, onAnswer, onExit, title, quizType = "inapp", onQuizType, autoPlay = true }) {
  const [queue, setQueue] = useState(() => items);
  const [streak, setStreak] = useState({}); // id -> consecutive correct this session
  const [missed, setMissed] = useState({}); // id -> ever missed this session
  const [answer, setAnswer] = useState("");
  const [feedback, setFeedback] = useState(null);
  const [leveled, setLeveled] = useState(null);
  const [done, setDone] = useState(items.length === 0);
  const [qtype, setQtype] = useState(quizType === "mc" || quizType === "az" ? quizType : "type"); // type | az | mc
  const [showKeys, setShowKeys] = useState(false); // in-app keyboard hidden until toggled on
  const [mcPick, setMcPick] = useState(null);
  const [peek, setPeek] = useState(null);       // letter trace overlay
  const [detailOpen, setDetailOpen] = useState(false); // full word-detail overlay
  const inputRef = useRef(null);

  // The queue is captured when the session starts, so every card is re-resolved
  // through live() at render time — that way a correction made from the detail
  // sheet mid-quiz shows up on the very next frame, and grades against the fix.
  const item = live(queue[0]);
  const total = items.length;
  const masteredCount = items.filter((it) => (streak[it.id] || 0) >= 2).length;
  const curStreak = item ? streak[item.id] || 0 : 0;
  const isMc = qtype === "mc";
  const isAz = qtype === "az";

  // multiple-choice options: the answer + 3 distractors (prefer same type), deduped by spelling
  const mcOptions = useMemo(() => {
    if (!item || !isMc) return [];
    const seen = new Set([normAr(item.ar)]);
    const distract = [];
    const all = LIVE_ITEMS.size ? Array.from(LIVE_ITEMS.values()) : ITEMS;
    for (const pool of [all.filter((x) => x.type === item.type), all]) {
      for (const x of shuffle(pool)) {
        const k = normAr(x.ar);
        if (!seen.has(k)) { seen.add(k); distract.push(x); }
        if (distract.length >= 3) break;
      }
      if (distract.length >= 3) break;
    }
    return shuffle([item, ...distract]);
  }, [item && item.id, isMc]);

  useEffect(() => {
    if (!isMc && !showKeys && !feedback && inputRef.current) inputRef.current.focus();
    // eslint-disable-next-line
  }, [item && item.id, qtype, showKeys]);

  const grade = (ok) => {
    if (feedback) return;
    setFeedback(ok ? "correct" : "wrong");
    if (autoPlay) speak(item.ar);
    if (onAnswer) onAnswer(item.id, ok); // mastery run: +1 correct / reset on miss, every answer
    setStreak((s) => ({ ...s, [item.id]: ok ? (s[item.id] || 0) + 1 : 0 }));
    if (!ok) setMissed((m) => ({ ...m, [item.id]: true }));
  };
  const next = () => {
    const st = streak[item.id] || 0; // updated post-grade
    let q;
    if (st >= 2) {
      const lvl = onGrade(item.id, !missed[item.id], mode);
      if (lvl) setLeveled(lvl);
      q = queue.slice(1);
    } else {
      q = [...queue.slice(1), item];
    }
    setFeedback(null);
    setAnswer("");
    setMcPick(null);
    setPeek(null);
    setDetailOpen(false);
    if (q.length === 0) setDone(true);
    else setQueue(q);
  };
  const submit = () => {
    if (feedback) { next(); return; }
    grade(isAz ? azMatches(answer, item) : answerMatches(answer, item));
  };
  const chooseMc = (opt) => {
    if (feedback) return;
    setMcPick(opt);
    grade(opt.id === item.id);
  };
  const giveUp = () => { if (feedback) return; grade(false); };
  const retake = () => { setQueue(items); setStreak({}); setMissed({}); setAnswer(""); setMcPick(null); setFeedback(null); setLeveled(null); setPeek(null); setDetailOpen(false); setDone(items.length === 0); };
  const setType = (t) => { if (t === qtype) return; setQtype(t); setAnswer(""); setMcPick(null); if (onQuizType) onQuizType(t); };

  if (done) {
    return (
      <div className="fade pop" style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 20, padding: "40px 24px", textAlign: "center" }}>
        <div style={{ fontSize: 38, marginBottom: 8 }}>{items.length === 0 ? "🌙" : "🎉"}</div>
        <div style={{ fontFamily: displayFont, fontSize: 22 }}>{items.length === 0 ? "Nothing to quiz right now" : "All mastered!"}</div>
        {items.length > 0 && (
          <div style={{ color: T.textDim, fontSize: 14, marginTop: 8, lineHeight: 1.5 }}>You got every item right twice in a row — {total} item{total === 1 ? "" : "s"} cleared.</div>
        )}
        {leveled && (
          <div style={{ marginTop: 14, background: `${T.gold}14`, border: `1px solid ${T.gold}`, borderRadius: 14, padding: "12px 14px", color: T.gold, fontWeight: 700 }}>
            🎊 Level up! You reached Level {leveled} — new words unlocked.
          </div>
        )}
        {items.length > 0 && (
          <button className="tap" onClick={retake} style={{ width: "100%", marginTop: 18, padding: 13, borderRadius: 13, border: `1px solid ${T.gold}`, background: `${T.gold}10`, color: T.gold, fontWeight: 700 }}>🔁 Retake this set</button>
        )}
        <button className="tap" onClick={onExit} style={{ width: "100%", marginTop: 10, padding: 14, borderRadius: 13, border: "none", background: `linear-gradient(135deg, ${T.gold}, ${T.terra})`, color: "#fff", fontWeight: 700 }}>Back to home</button>
      </div>
    );
  }

  const correct = feedback === "correct";
  const wrong = feedback === "wrong";
  const willFinish = correct && curStreak >= 2 && queue.length === 1;

  return (
    <div className="fade">
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: T.goldSoft, whiteSpace: "nowrap" }}>{title}</div>
        <div style={{ flex: 1, height: 4, background: T.line, borderRadius: 4, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${(masteredCount / Math.max(1, total)) * 100}%`, background: `linear-gradient(90deg, ${T.gold}, ${T.terra})`, transition: "width .3s ease" }} />
        </div>
        <div style={{ fontSize: 12, color: T.textDim, whiteSpace: "nowrap" }}>{masteredCount}/{total} mastered</div>
      </div>

      {/* answer-mode selector */}
      <div style={{ display: "flex", gap: 5, background: T.panelHi, border: `1px solid ${T.line}`, padding: 4, borderRadius: 12, marginBottom: 12 }}>
        {[["type", "✍️ Arabic"], ["az", "🔤 Arabizi"], ["mc", "🔘 Choice"]].map(([k, label]) => (
          <button key={k} className="tap" onClick={() => setType(k)} style={{ flex: 1, border: "none", borderRadius: 8, padding: "8px 2px", fontSize: 12.5, fontWeight: 600, color: qtype === k ? "#fff" : T.textDim, background: qtype === k ? `linear-gradient(135deg, ${T.gold}, ${T.terra})` : "transparent" }}>{label}</button>
        ))}
      </div>

      <div style={{ background: `linear-gradient(160deg, ${T.panelHi}, ${T.panel})`, border: `1px solid ${T.line}`, borderRadius: 20, padding: "22px 18px", textAlign: "center", boxShadow: "0 12px 30px rgba(128,29,92,.08)" }}>
        <div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft }}>{isMc ? "Pick the Arabic" : isAz ? "Type it in Arabizi" : "Type in Arabic"} · {item.type}</div>
        <div style={{ fontFamily: displayFont, fontSize: 24, color: T.text, marginTop: 8 }}>{item.en}</div>
        <div style={{ marginTop: 8, fontSize: 11, color: curStreak >= 1 ? OK_GREEN : T.textDim, fontWeight: 600 }}>{curStreak >= 1 ? "✓ 1/2 in a row — one more to clear" : "Get this right twice in a row to clear it"}</div>
      </div>

      {/* answer area */}
      {isMc ? (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 12 }}>
          {mcOptions.map((opt, idx) => {
            let bg = T.panel, border = T.line, col = T.text;
            if (feedback) {
              if (opt.id === item.id) { bg = `${OK_GREEN}1f`; border = OK_GREEN; col = OK_GREEN; }
              else if (mcPick && opt.id === mcPick.id) { bg = `${BAD_RED}1a`; border = BAD_RED; col = BAD_RED; }
            }
            return (
              <button key={opt.id + "_" + idx} className="tap" onClick={() => chooseMc(opt)} disabled={!!feedback} style={{ background: bg, border: `1.5px solid ${border}`, borderRadius: 14, padding: "16px 8px", cursor: feedback ? "default" : "pointer", minHeight: 64, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <span style={{ fontFamily: arFont, fontSize: opt.type === "sentence" ? 18 : 26, color: col, direction: "rtl", lineHeight: 1.3 }}>{opt.ar}</span>
              </button>
            );
          })}
        </div>
      ) : (
        <>
          <input
            ref={inputRef}
            value={answer}
            onChange={(e) => !feedback && setAnswer(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && submit()}
            placeholder={isAz ? "type it in Franco… e.g. 7abibi" : "اكتب بالعربي…"}
            dir={isAz ? "ltr" : "rtl"}
            readOnly={!!feedback}
            autoCapitalize="none"
            autoCorrect="off"
            spellCheck={false}
            inputMode={!isAz && showKeys ? "none" : undefined}
            style={{ width: "100%", marginTop: 12, padding: "14px 16px", borderRadius: 14, border: `2px solid ${correct ? OK_GREEN : wrong ? BAD_RED : T.line}`, background: correct ? `${OK_GREEN}12` : wrong ? `${BAD_RED}12` : T.panel, color: T.text, fontFamily: isAz ? uiFont : arFont, fontSize: isAz ? 20 : 26, outline: "none", textAlign: isAz ? "left" : "right", letterSpacing: isAz ? 0.3 : 0 }}
          />
          {isAz && !feedback && (
            <div style={{ fontSize: 11, color: T.textDim, marginTop: 7, lineHeight: 1.5 }}>
              Numbers stand in for the sounds Latin letters don't have — <b style={{ color: T.gold }}>3</b> = ع, <b style={{ color: T.gold }}>7</b> = ح, <b style={{ color: T.gold }}>5</b> = خ, <b style={{ color: T.gold }}>2</b> = the catch in your throat. Spell it however you'd text it — <i>7abibi</i>, <i>habibi</i>, <i>habeebi</i> all count.
            </div>
          )}
          {!feedback && (
            <button className="tap" onClick={submit} style={{ width: "100%", marginTop: 10, padding: 14, borderRadius: 14, border: "none", background: `linear-gradient(135deg, ${T.gold}, ${T.terra})`, color: "#fff", fontSize: 15, fontWeight: 700 }}>Check answer</button>
          )}
          {!feedback && !isAz && (
            <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 8 }}>
              <button className="tap" onClick={() => setShowKeys((s) => !s)} style={{ padding: "8px 14px", borderRadius: 999, border: `1px solid ${showKeys ? T.gold : T.line}`, background: showKeys ? `${T.gold}12` : T.panel, color: showKeys ? T.gold : T.textDim, fontSize: 12, fontWeight: 600 }}>
                {showKeys ? "⌨️ Hide in-app keys" : "⌨️ Show in-app keys"}
              </button>
            </div>
          )}
          {!feedback && !isAz && showKeys && (
            <ArabicKeyboard
              onKey={(ch) => setAnswer((a) => a + ch)}
              onSpace={() => setAnswer((a) => a + " ")}
              onBack={() => setAnswer((a) => a.slice(0, -1))}
              onClear={() => setAnswer("")}
            />
          )}
        </>
      )}

      {feedback && (
        <div className="fade" style={{ marginTop: 12, background: T.panel, border: `1.5px solid ${wrong ? BAD_RED : OK_GREEN}`, borderRadius: 14, padding: "14px 14px", textAlign: "center" }}>
          <div style={{ fontSize: 17, fontWeight: 800, letterSpacing: 0.5, color: wrong ? BAD_RED : OK_GREEN }}>{correct ? "CORRECT ✓" : "NOT QUITE ✗"}</div>
          <div style={{ fontSize: 12, fontWeight: 600, color: wrong ? BAD_RED : OK_GREEN, marginTop: 2 }}>{correct ? (curStreak >= 2 ? "cleared! ✓✓" : "once more to clear it") : "here's the correct answer:"}</div>
          <button className="tap" onClick={() => setDetailOpen(true)} style={{ display: "inline-flex", flexDirection: "column", alignItems: "center", gap: 2, background: "transparent", border: "none", cursor: "pointer", marginTop: 6 }}>
            <span style={{ fontFamily: arFont, fontSize: 32, color: T.text, direction: "rtl" }}>{item.ar}</span>
            <span style={{ fontSize: 10, color: T.gold, fontWeight: 700 }}>tap for full details ›</span>
          </button>
          <div style={{ color: T.goldSoft, fontStyle: "italic", fontSize: 14, marginTop: 2 }}>{item.tr}</div>
          {item.az && <div style={{ fontSize: 13, color: T.gold, fontWeight: 700, marginTop: 3, letterSpacing: 0.3 }}>{item.az}</div>}
          <div style={{ marginTop: 8 }}><Speaker text={item.ar} color={T.terra} /></div>
          <div style={{ marginTop: 14, paddingTop: 12, borderTop: `1px dashed ${T.line}` }}>
            <div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 0.8, color: T.goldSoft, marginBottom: 8 }}>How it's written · tap a letter</div>
            <LetterBreakdown ar={item.ar} onTap={(part) => setPeek(part)} />
            {marksInWord(item.ar).length > 0 && (
              <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 12 }}>
                {marksInWord(item.ar).map((m, i) => <MarkCard key={i} mark={m} />)}
              </div>
            )}
          </div>
        </div>
      )}

      {feedback && (
        <div style={{ position: "sticky", bottom: 0, zIndex: 5, marginTop: 12, paddingBottom: "calc(8px + env(safe-area-inset-bottom))", paddingTop: 8, background: `linear-gradient(180deg, transparent, ${T.bg} 32%)` }}>
          <button className="tap" onClick={submit} style={{ width: "100%", padding: 15, borderRadius: 14, border: "none", background: `linear-gradient(135deg, ${T.gold}, ${T.terra})`, color: "#fff", fontSize: 15, fontWeight: 700, boxShadow: "0 8px 22px rgba(128,29,92,.22)" }}>
            {willFinish ? "Finish" : "Next →"}
          </button>
        </div>
      )}
      {!feedback && (
        <button className="tap" onClick={giveUp} style={{ width: "100%", marginTop: 8, padding: 11, borderRadius: 12, border: `1px solid ${T.line}`, background: "transparent", color: T.textDim, fontSize: 13, fontWeight: 600 }}>
          I don't know — show me
        </button>
      )}
      <button className="tap" onClick={onExit} style={{ width: "100%", marginTop: 8, padding: 9, borderRadius: 12, border: "none", background: "transparent", color: T.textDim, fontSize: 12 }}>
        End session
      </button>
      <div style={{ textAlign: "center", fontSize: 11, color: T.textDim, marginTop: 10, lineHeight: 1.6 }}>
        {isMc ? "Pick the matching Arabic. " : showKeys ? "Tap the in-app keys above. " : "Type with your phone keyboard, or tap “Show in-app keys”. "}
        Each item must be answered correctly <b style={{ color: T.text }}>twice in a row</b> to clear.
      </div>

      <ScriptPeek peek={peek} onClose={() => setPeek(null)} />
      {detailOpen && <ItemDetail item={item} onClose={() => setDetailOpen(false)} autoPlay={autoPlay} />}
    </div>
  );
}

/* ===================== LEARN SESSION (teach N, then quiz them) ===================== */
function LearnSession({ pool, batch, onLearn, onGrade, onAnswer, onExit, learnedCount = 0, onQuizLearned, customCount = 0, onCustom, onGotoItems, onConv, onVerbs, autoStart = false, quizType = "inapp", onQuizType, autoPlay = true }) {
  const [queue] = useState(() => pool.slice(0, batch));
  const [phase, setPhase] = useState(() => (autoStart && pool.length ? "teach" : "menu"));
  const [i, setI] = useState(0);
  const [peek, setPeek] = useState(null);
  const teachItem = live(queue[i]);
  useEffect(() => { if (phase === "teach" && autoPlay && teachItem) speak(teachItem.ar); /* eslint-disable-next-line */ }, [phase, teachItem && teachItem.id]);

  if (phase === "menu") {
    const canLearn = queue.length > 0;
    return (
      <div className="fade" style={{ paddingTop: 4 }}>
        <div style={{ background: `linear-gradient(160deg, ${T.panelHi}, ${T.panel})`, border: `1px solid ${T.line}`, borderRadius: 20, padding: "18px 18px 16px", marginBottom: 14, boxShadow: "0 12px 30px rgba(128,29,92,.08)" }}>
          <div style={{ fontFamily: displayFont, fontSize: 21, color: T.gold }}>Lessons</div>
          <div style={{ fontSize: 12.5, color: T.textDim, marginTop: 3, lineHeight: 1.5 }}>
            Learn new words, drill everything you've learned, or run your own custom set.
          </div>
        </div>

        <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "4px 2px 8px" }}>Vocabulary</div>
        {/* Learn new words — primary */}
        <button className="tap" onClick={() => canLearn && setPhase("teach")} disabled={!canLearn} style={{ width: "100%", padding: 16, borderRadius: 14, marginBottom: 10, textAlign: "left", background: canLearn ? `linear-gradient(135deg, ${T.gold}, ${T.terra})` : T.panel, color: canLearn ? "#fff" : T.textDim, border: canLearn ? "none" : `1px solid ${T.line}`, boxShadow: canLearn ? "0 8px 20px rgba(128,29,92,.18)" : "none" }}>
          <div style={{ fontSize: 15, fontWeight: 700 }}>{canLearn ? `Learn ${queue.length} new word${queue.length === 1 ? "" : "s"} →` : "No new words right now"}</div>
          <div style={{ fontSize: 11.5, marginTop: 2, opacity: canLearn ? 0.9 : 1, color: canLearn ? "#fff" : T.textDim }}>{canLearn ? "Teach, then quiz them to lock them in" : "You've learned everything unlocked so far — nice work!"}</div>
        </button>

        {/* Quiz / review everything learned */}
        <button className="tap" onClick={() => learnedCount && onQuizLearned && onQuizLearned()} disabled={!learnedCount} style={{ width: "100%", padding: 14, borderRadius: 13, marginBottom: 10, textAlign: "left", border: `1px solid ${learnedCount ? T.gold : T.line}`, background: learnedCount ? `${T.gold}10` : T.panel, color: learnedCount ? T.gold : T.textDim }}>
          <div style={{ fontSize: 14, fontWeight: 700 }}>✨ Quiz all learned words {learnedCount ? `(${learnedCount})` : ""}</div>
          <div style={{ fontSize: 11.5, marginTop: 2, color: T.textDim }}>{learnedCount ? "A shuffled drill over everything you've learned so far" : "Learn some words first"}</div>
        </button>

        {/* Conversations */}
        {onConv && <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "14px 2px 8px" }}>Conversations</div>}
        {onConv && (
          <button className="tap" onClick={onConv} style={{ width: "100%", padding: 14, borderRadius: 13, marginBottom: 10, textAlign: "left", border: `1px solid ${T.gold}55`, background: `${T.gold}0d`, color: T.gold }}>
            <div style={{ fontSize: 14, fontWeight: 700 }}>🗣 Conversation lessons →</div>
            <div style={{ fontSize: 11.5, marginTop: 2, color: T.textDim }}>Real exchanges by situation — greetings, meeting people, restaurant, shopping</div>
          </button>
        )}

        {/* Verbs */}
        {onVerbs && <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "14px 2px 8px" }}>Verbs</div>}
        {onVerbs && (
          <button className="tap" onClick={onVerbs} style={{ width: "100%", padding: 14, borderRadius: 13, marginBottom: 10, textAlign: "left", border: `1px solid ${T.gold}55`, background: `${T.gold}0d`, color: T.gold }}>
            <div style={{ fontSize: 14, fontWeight: 700 }}>⚡ Verb lessons →</div>
            <div style={{ fontSize: 11.5, marginTop: 2, color: T.textDim }}>Core Egyptian verbs, each with three sentences that put it to work</div>
          </button>
        )}

        {/* Custom quiz */}
        <button className="tap" onClick={() => (customCount ? onCustom && onCustom() : onGotoItems && onGotoItems())} style={{ width: "100%", padding: 14, borderRadius: 13, textAlign: "left", border: `1px solid ${T.line}`, background: T.panel, color: T.text }}>
          <div style={{ fontSize: 14, fontWeight: 700 }}>{customCount ? `★ Start custom quiz (${customCount})` : "★ Create a custom quiz →"}</div>
          <div style={{ fontSize: 11.5, marginTop: 2, color: T.textDim }}>{customCount ? "Your hand-picked set — tap to begin" : "Pick the words you want with the ★ in Items"}</div>
        </button>

        <button className="tap" onClick={onExit} style={{ width: "100%", marginTop: 16, padding: 11, borderRadius: 12, border: "none", background: "transparent", color: T.textDim, fontSize: 12.5 }}>Back to home</button>
      </div>
    );
  }

  if (phase === "quiz") {
    return (
      <div>
        <div style={{ textAlign: "center", fontSize: 12.5, color: T.textDim, margin: "0 0 12px", lineHeight: 1.5 }}>
          Now type each one in Arabic to lock it in 👇
        </div>
        <TypedQuiz items={liveAll(queue)} mode="srs" onGrade={onGrade} onAnswer={onAnswer} onExit={() => setPhase("menu")} title="Lesson quiz" quizType={quizType} onQuizType={onQuizType} autoPlay={autoPlay} />
      </div>
    );
  }

  // teach phase — re-resolved each render so a correction made from this card
  // (or from the detail sheet) is reflected right away.
  const item = live(queue[i]);
  return (
    <div className="fade">
      <div style={{ height: 4, background: T.line, borderRadius: 4, overflow: "hidden", marginBottom: 14 }}>
        <div style={{ height: "100%", width: `${(i / queue.length) * 100}%`, background: `linear-gradient(90deg, ${T.gold}, ${T.terra})` }} />
      </div>
      <div className="pop" key={item.id} style={{ background: `linear-gradient(160deg, ${T.panelHi}, ${T.panel})`, border: `1px solid ${T.line}`, borderRadius: 22, padding: "26px 22px", textAlign: "center", boxShadow: "0 12px 34px rgba(128,29,92,.10)" }}>
        <div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft }}>New {item.type} · Level {item.level}</div>
        <div style={{ fontFamily: arFont, fontSize: item.type === "sentence" ? 32 : 48, color: T.text, direction: "rtl", margin: "14px 0", lineHeight: 1.4 }}>{item.ar}</div>
        <div style={{ color: T.goldSoft, fontStyle: "italic", fontSize: 16 }}>{item.tr}</div>
        {item.az && <div style={{ fontSize: 14.5, color: T.gold, fontWeight: 700, marginTop: 3, letterSpacing: 0.3 }}>{item.az}<span style={{ fontSize: 10, fontWeight: 600, color: T.textDim, marginLeft: 6, letterSpacing: 0 }}>arabizi</span></div>}
        <div style={{ fontFamily: displayFont, fontSize: 20, marginTop: 6 }}>{item.en}</div>
        <div style={{ marginTop: 14 }}><Speaker text={item.ar} size={20} color={T.gold} /></div>
      </div>

      <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "18px 2px 10px" }}>How to type it · tap a letter</div>
      <LetterBreakdown ar={item.ar} onTap={(part) => setPeek(part)} />
      <div style={{ fontSize: 11.5, color: T.textDim, marginTop: 10, lineHeight: 1.5, textAlign: "center" }}>Reads right → left. Tap any letter for its trace guide and practice.</div>

      <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "20px 2px 10px" }}>Remember it</div>
      <MnemonicCard item={item} />

      {marksInWord(item.ar).length > 0 && (
        <>
          <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "20px 2px 10px" }}>Marks in this word</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {marksInWord(item.ar).map((m, i) => <MarkCard key={i} mark={m} />)}
          </div>
        </>
      )}

      <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "20px 2px 10px" }}>Try typing it</div>
      <TypeTry item={item} />

      <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "20px 2px 10px" }}>✍️ Try writing it</div>
      <WritePad text={item.ar} resetKey={item.id} />
      <div style={{ fontSize: 11.5, color: T.textDim, marginTop: 8, lineHeight: 1.5, textAlign: "center" }}>Trace over the faint word with your finger, right → left. Tap Clear to redo.</div>

      <button
        className="tap"
        onClick={() => {
          onLearn(item.id);
          if (i + 1 >= queue.length) setPhase("quiz");
          else setI(i + 1);
        }}
        style={{ width: "100%", marginTop: 18, padding: 15, borderRadius: 14, border: "none", background: `linear-gradient(135deg, ${T.gold}, ${T.terra})`, color: "#fff", fontSize: 15, fontWeight: 700 }}
      >
        {i + 1 >= queue.length ? "Got them — start quiz →" : "Learn it ✓"}
      </button>
      <div style={{ textAlign: "center", fontSize: 12, color: T.textDim, marginTop: 10 }}>Learning {i + 1} of {queue.length}</div>

      <ScriptPeek peek={peek} onClose={() => setPeek(null)} />
    </div>
  );
}

// Bridge so ItemDetail (rendered both from Items and inside quizzes) can read/save
// the user's own recordings without threading props everywhere. Set by App each render.
let REC_API = null;

// Record-your-own-pronunciation widget: mic capture → base64 in app state, so it
// persists locally and rides along in backup export/import automatically.
function VoiceRecorder({ itemId }) {
  const [rec, setRec] = useState(null);
  const [prefV, setPrefV] = useState(() => (REC_API ? REC_API.pref(itemId) : "original"));
  const [phase, setPhase] = useState("idle"); // idle | recording | denied
  const mrRef = useRef(null);
  const chunksRef = useRef([]);
  const timerRef = useRef(null);

  // The clip itself lives in IndexedDB, so fetch it when the card opens.
  useEffect(() => {
    let alive = true;
    setRec(null);
    setPrefV(REC_API ? REC_API.pref(itemId) : "original");
    recGet(itemId).then((v) => { if (alive) setRec(v || null); });
    return () => { alive = false; };
  }, [itemId]);

  useEffect(() => () => { // cleanup if closed mid-recording
    if (mrRef.current && mrRef.current.state === "recording") { try { mrRef.current.stop(); } catch {} }
    if (timerRef.current) clearTimeout(timerRef.current);
  }, []);

  const start = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = ["audio/mp4", "audio/webm"].find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
      const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      mrRef.current = mr;
      chunksRef.current = [];
      mr.ondataavailable = (e) => { if (e.data && e.data.size) chunksRef.current.push(e.data); };
      mr.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        const blob = new Blob(chunksRef.current, { type: mr.mimeType || "audio/webm" });
        const fr = new FileReader();
        fr.onload = () => {
          const url = fr.result;
          if (REC_API) REC_API.save(itemId, url);
          setRec(url);
          setPhase("idle");
        };
        fr.readAsDataURL(blob);
      };
      mr.start();
      setPhase("recording");
      timerRef.current = setTimeout(() => { if (mr.state === "recording") mr.stop(); }, 15000); // 15s cap — plenty for a sentence
    } catch {
      setPhase("denied");
    }
  };
  const stop = () => { if (timerRef.current) clearTimeout(timerRef.current); if (mrRef.current && mrRef.current.state === "recording") mrRef.current.stop(); };
  const play = () => {
    try {
      if (CURRENT_AUDIO) { try { CURRENT_AUDIO.pause(); } catch {} }
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      const a = new Audio(rec);
      CURRENT_AUDIO = a;
      a.play().catch(() => {});
    } catch {}
  };
  const remove = () => { if (REC_API) { REC_API.del(itemId); REC_API.setPref(itemId, "original"); } setRec(null); setPrefV("original"); };
  const btn = (label, onClick, solid) => (
    <button className="tap" onClick={onClick} style={{ padding: "8px 13px", borderRadius: 10, fontSize: 12.5, fontWeight: 700, cursor: "pointer", border: `1.5px solid ${T.gold}`, background: solid ? `linear-gradient(135deg, ${T.gold}, ${T.terra})` : `${T.gold}12`, color: solid ? "#fff" : T.gold }}>{label}</button>
  );

  return (
    <div style={{ marginTop: 12 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, flexWrap: "wrap" }}>
        {phase === "recording" ? (
          <>
            <span className="fade" style={{ fontSize: 12.5, color: BAD_RED, fontWeight: 700 }}>● recording…</span>
            {btn("■ Stop & save", stop, true)}
          </>
        ) : rec ? (
          <>
            {btn("▶ My voice", play, true)}
            {btn("● Re-record", start)}
            {btn("🗑", remove)}
          </>
        ) : (
          btn("🎤 Record my voice", start)
        )}
      </div>
      {rec && phase !== "recording" && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, marginTop: 9, fontSize: 11.5 }}>
          <span style={{ color: T.textDim }}>Plays in app:</span>
          {[["original", "Original"], ["mine", "My voice"]].map(([v, label]) => (
            <button key={v} className="tap" onClick={() => { if (REC_API) REC_API.setPref(itemId, v); setPrefV(v); }} style={{ padding: "5px 11px", borderRadius: 999, fontSize: 11.5, fontWeight: 700, cursor: "pointer", border: `1.5px solid ${prefV === v ? T.gold : T.line}`, background: prefV === v ? `${T.gold}1a` : "transparent", color: prefV === v ? T.gold : T.textDim }}>{prefV === v ? "✓ " : ""}{label}</button>
          ))}
        </div>
      )}
      {phase === "denied" && <div style={{ fontSize: 11, color: BAD_RED, textAlign: "center", marginTop: 6 }}>Microphone blocked — allow mic access for this site in your browser settings.</div>}
      {phase === "recording" && <div style={{ fontSize: 11, color: T.textDim, textAlign: "center", marginTop: 6 }}>Say the word, then tap stop (15s max).</div>}
    </div>
  );
}

// Universal mnemonic for a word/phrase/sentence (keyword-link or chunk-and-story).
function MnemonicCard({ item }) {
  const mn = useMemo(() => wordMnemonic(item), [item && item.id]);
  if (!mn) return null;
  return (
    <div style={{ background: `${T.gold}0c`, border: `1px solid ${T.gold}40`, borderRadius: 14, padding: "13px 15px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 6 }}>
        <span style={{ fontSize: 16 }}>🧠</span>
        <span style={{ fontSize: 12.5, fontWeight: 700, color: T.gold }}>Memory hook</span>
      </div>

// Row of tappable letter chips showing how a word is built, shape by shape.
function LetterBreakdown({ ar, onTap }) {
  const parts = useMemo(() => breakWord(ar), [ar]);
  return (
    <div style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", gap: 8, direction: "rtl" }}>
      {parts.map((p, i) => {
        if (p.space) return <div key={i} style={{ width: 12 }} />;
        if (p.other) return <div key={i} style={{ fontFamily: arFont, fontSize: 22, color: T.textDim, alignSelf: "center" }}>{p.ch}</div>;
        const hasMarks = p.marks && p.marks.length > 0;
        const tappable = (p.idx >= 0 || hasMarks) && onTap;
        return (
          <button key={i} className="tap" disabled={!tappable} onClick={() => tappable && onTap(p)} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, minWidth: 52, border: `1px solid ${hasMarks ? T.gold : T.line}`, background: hasMarks ? `${T.gold}0c` : T.panelHi, borderRadius: 11, padding: "8px 6px", cursor: tappable ? "pointer" : "default", direction: "rtl" }}>
            <span style={{ fontFamily: arFont, fontSize: 30, color: T.text, lineHeight: 1.1 }}>{p.shape}</span>
            <span style={{ fontFamily: uiFont, fontSize: 10.5, color: T.goldSoft, fontWeight: 600, direction: "ltr" }}>{(p.tr || p.ch) + (hasMarks ? p.marks.map((m) => m.tr.startsWith("(") ? "" : m.tr).join("") : "")}</span>
            <span style={{ fontFamily: uiFont, fontSize: 8.5, color: hasMarks ? T.gold : T.textDim, textTransform: "uppercase", letterSpacing: 0.4, direction: "ltr" }}>{hasMarks ? "+ " + p.marks.map((m) => m.name).join(", ") : FORM_LABEL[p.form]}</span>
          </button>
        );
      })}
    </div>
  );
}

// A “try typing it” box with the in-app Arabic keyboard and a Check button.
function TypeTry({ item, compact }) {
  const [val, setVal] = useState("");
  const [res, setRes] = useState(null); // "ok" | "no" | null
  const [showKb, setShowKb] = useState(false);
  const [mode, setMode] = useState("ar"); // ar | az
  const az = mode === "az";
  useEffect(() => { setVal(""); setRes(null); }, [item && item.id, mode]);
  const check = () => setRes((az ? azMatches(val, item) : answerMatches(val, item)) ? "ok" : "no");
  const expected = az ? (item.az || toArabizi(item.ar, item.tr)) : item.ar;
  return (
    <div>
      <div style={{ display: "flex", gap: 5, background: T.panelHi, border: `1px solid ${T.line}`, padding: 3, borderRadius: 11, marginBottom: 9 }}>
        {[["ar", "العربية Arabic"], ["az", "🔤 Arabizi"]].map(([k, label]) => (
          <button key={k} className="tap" onClick={() => { setMode(k); setShowKb(false); }} style={{ flex: 1, border: "none", borderRadius: 8, padding: "7px 2px", fontSize: 12, fontWeight: 600, color: mode === k ? "#fff" : T.textDim, background: mode === k ? `linear-gradient(135deg, ${T.gold}, ${T.terra})` : "transparent" }}>{label}</button>
        ))}
      </div>
      <input
        value={val}
        onChange={(e) => { setVal(e.target.value); setRes(null); }}
        onKeyDown={(e) => e.key === "Enter" && check()}
        placeholder={az ? "try it in Franco… e.g. 7abibi" : "try typing it…"}
        dir={az ? "ltr" : "rtl"}
        autoCapitalize="none"
        autoCorrect="off"
        spellCheck={false}
        inputMode={!az && showKb ? "none" : undefined}
        style={{ width: "100%", padding: "12px 14px", borderRadius: 12, border: `2px solid ${res === "ok" ? OK_GREEN : res === "no" ? BAD_RED : T.line}`, background: res === "ok" ? `${OK_GREEN}12` : res === "no" ? `${BAD_RED}12` : T.panel, color: T.text, fontFamily: az ? uiFont : arFont, fontSize: az ? 18 : 24, outline: "none", textAlign: az ? "left" : "right" }}
      />
      <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
        {!az && <button className="tap" onClick={() => setShowKb((s) => !s)} style={{ padding: "11px 14px", borderRadius: 12, border: `1px solid ${showKb ? T.gold : T.line}`, background: showKb ? `${T.gold}12` : T.panel, color: showKb ? T.gold : T.textDim, fontSize: 12.5, fontWeight: 600 }}>{showKb ? "⌨️ Hide keys" : "⌨️ Keys"}</button>}
        <button className="tap" onClick={check} style={{ flex: 1, padding: "12px 16px", borderRadius: 12, border: "none", background: `linear-gradient(135deg, ${T.gold}, ${T.terra})`, color: "#fff", fontWeight: 700, fontSize: 14 }}>Check</button>
      </div>
      {az && res === null && <div style={{ fontSize: 11, color: T.textDim, marginTop: 8, lineHeight: 1.5 }}><b style={{ color: T.gold }}>3</b> = ع · <b style={{ color: T.gold }}>7</b> = ح · <b style={{ color: T.gold }}>5</b> = خ · <b style={{ color: T.gold }}>2</b> = glottal stop. Any common spelling counts.</div>}
      {res === "ok" && <div className="fade" style={{ marginTop: 10, textAlign: "center", color: OK_GREEN, fontWeight: 700, fontSize: 14 }}>✓ Perfect — that's it!</div>}
      {res === "no" && (
        <div className="fade" style={{ marginTop: 10, textAlign: "center" }}>
          <div style={{ color: BAD_RED, fontWeight: 700, fontSize: 13 }}>Not quite — {az ? "one way to write it is:" : "the spelling is:"}</div>
          <div style={{ fontFamily: az ? uiFont : arFont, fontSize: az ? 20 : 26, fontWeight: az ? 700 : 400, color: az ? T.gold : T.text, direction: az ? "ltr" : "rtl", marginTop: 2 }}>{expected}</div>
        </div>
      )}
      {showKb && !az && (
        <ArabicKeyboard
          onKey={(ch) => { setVal((a) => a + ch); setRes(null); }}
          onSpace={() => { setVal((a) => a + " "); setRes(null); }}
          onBack={() => { setVal((a) => a.slice(0, -1)); setRes(null); }}
          onClear={() => { setVal(""); setRes(null); }}
        />
      )}
    </div>
  );
}

function ItemDetail({ item: itemProp, onClose, autoPlay }) {
  const [peek, setPeek] = useState(null);
  const [peekItem, setPeekItem] = useState(null); // an example sentence opened from a verb
  const [patch, setPatch] = useState(null); // local echo, so a save shows instantly
  const [editing, setEditing] = useState(false);
  const [eAr, setEAr] = useState(""); const [eTr, setETr] = useState(""); const [eEn, setEEn] = useState(""); const [eAz, setEAz] = useState("");
  // Always start from the live (edited) copy, so opening this from a quiz shows
  // the corrected card rather than whatever the quiz captured at its start.
  const base = live(itemProp);
  const item = patch ? { ...base, ...patch } : base;
  useEffect(() => { if (autoPlay && item) speak(item.ar); /* eslint-disable-next-line */ }, [item && item.id]);
  useEffect(() => { setPatch(null); setEditing(false); }, [itemProp && itemProp.id]);
  if (!item) return null;
  const autoAz = toArabizi(item.ar, item.tr);
  const startEdit = () => {
    setEAr(item.ar); setETr(item.tr); setEEn(item.en);
    setEAz((item.az || "") === autoAz ? "" : item.az || "");
    setEditing(true);
  };
  const saveEdit = () => {
    const ar = eAr.trim() || item.ar, tr = eTr.trim() || item.tr;
    const p = { ar, tr, en: eEn.trim() || item.en };
    // Blank Arabizi means "keep generating it for me" — it's recomputed from the
    // Arabic and transliteration, so it follows any correction automatically.
    if (eAz.trim()) p.az = eAz.trim(); else { p.az = ""; }
    if (REC_API) REC_API.editItem(item.id, p);
    setPatch({ ...p, az: p.az || toArabizi(ar, tr) });
    setEditing(false);
  };
  const resetEdit = () => { if (REC_API) REC_API.resetItem(item.id); setPatch(null); setEditing(false); };
  const exItems = (item.ex || []).map(itemById).filter(Boolean);
  return ReactDOM.createPortal(
    <div style={{ position: "fixed", inset: 0, zIndex: 9000, background: T.bg, overflowY: "auto", WebkitOverflowScrolling: "touch" }}>
      <div style={{ maxWidth: 560, margin: "0 auto", padding: "12px 18px calc(40px + env(safe-area-inset-bottom))" }}>
        <button className="tap" onClick={onClose} style={{ display: "inline-flex", alignItems: "center", gap: 6, marginBottom: 12, padding: "8px 14px", borderRadius: 999, border: `1px solid ${T.line}`, background: T.panel, color: T.gold, fontSize: 13, fontWeight: 700 }}>‹ Back</button>

        <div style={{ background: `linear-gradient(160deg, ${T.panelHi}, ${T.panel})`, border: `1px solid ${T.line}`, borderRadius: 20, padding: "24px 20px", textAlign: "center", boxShadow: "0 12px 30px rgba(128,29,92,.10)" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
            <div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft }}>{item.type} · Level {item.level}{item.edited || patch ? " · edited" : ""}</div>
            <button className="tap" onClick={startEdit} title="Edit this item" style={{ padding: "4px 10px", borderRadius: 999, border: `1px solid ${T.line}`, background: T.panelHi, color: T.gold, fontSize: 11, fontWeight: 700, cursor: "pointer" }}>✎ Edit</button>
          </div>
          {editing && (
            <div className="fade" style={{ margin: "12px 0 4px", textAlign: "left" }}>
              <input value={eAr} onChange={(e) => setEAr(e.target.value)} placeholder="Arabic" style={{ width: "100%", boxSizing: "border-box", marginBottom: 6, padding: "10px 12px", borderRadius: 10, border: `1px solid ${T.line}`, background: T.panelHi, color: T.text, fontFamily: arFont, fontSize: 20, textAlign: "right", outline: "none" }} />
              <input value={eTr} onChange={(e) => setETr(e.target.value)} placeholder="Transliteration" style={{ width: "100%", boxSizing: "border-box", marginBottom: 6, padding: "10px 12px", borderRadius: 10, border: `1px solid ${T.line}`, background: T.panelHi, color: T.text, fontSize: 14, outline: "none" }} />
              <input value={eEn} onChange={(e) => setEEn(e.target.value)} placeholder="English" style={{ width: "100%", boxSizing: "border-box", marginBottom: 6, padding: "10px 12px", borderRadius: 10, border: `1px solid ${T.line}`, background: T.panelHi, color: T.text, fontSize: 14, outline: "none" }} />
              <input value={eAz} onChange={(e) => setEAz(e.target.value)} placeholder={`Arabizi — leave blank for auto (${autoAz || "—"})`} autoCapitalize="none" autoCorrect="off" spellCheck={false} style={{ width: "100%", boxSizing: "border-box", marginBottom: 8, padding: "10px 12px", borderRadius: 10, border: `1px solid ${T.line}`, background: T.panelHi, color: T.gold, fontSize: 14, fontWeight: 700, outline: "none" }} />
              <div style={{ display: "flex", gap: 8 }}>
                <button className="tap" onClick={saveEdit} style={{ flex: 1, padding: 10, borderRadius: 10, border: "none", background: `linear-gradient(135deg, ${T.gold}, ${T.terra})`, color: "#fff", fontWeight: 700, fontSize: 13 }}>Save</button>
                <button className="tap" onClick={() => setEditing(false)} style={{ flex: 1, padding: 10, borderRadius: 10, border: `1px solid ${T.line}`, background: "transparent", color: T.textDim, fontWeight: 700, fontSize: 13 }}>Cancel</button>
              </div>
              {(item.edited || patch) && (
                <button className="tap" onClick={resetEdit} style={{ width: "100%", marginTop: 8, padding: 9, borderRadius: 10, border: `1px solid ${BAD_RED}55`, background: "transparent", color: BAD_RED, fontWeight: 700, fontSize: 12 }}>↺ Reset to the original card</button>
              )}
              <div style={{ fontSize: 10.5, color: T.textDim, marginTop: 6, lineHeight: 1.5 }}>Corrections apply everywhere straight away — item lists, lessons, reviews, custom quizzes, even a quiz you're in the middle of. They're saved with your data and included in backups. Progress and audio stay attached to the card.</div>
            </div>
          )}
          <div style={{ fontFamily: arFont, fontSize: item.type === "sentence" ? 34 : 50, color: T.text, direction: "rtl", margin: "12px 0", lineHeight: 1.4 }}>{item.ar}</div>
          <div style={{ color: T.goldSoft, fontStyle: "italic", fontSize: 16 }}>{item.tr}</div>
          {item.az && (
            <div style={{ marginTop: 5 }}>
              <span style={{ fontSize: 16, color: T.gold, fontWeight: 700, letterSpacing: 0.3 }}>{item.az}</span>
              <span style={{ fontSize: 10, color: T.textDim, marginLeft: 6, textTransform: "uppercase", letterSpacing: 1 }}>arabizi</span>
            </div>
          )}
          <div style={{ fontFamily: displayFont, fontSize: 20, marginTop: 4 }}>{item.en}</div>
          <div style={{ marginTop: 14 }}><Speaker text={item.ar} size={22} color={T.gold} /></div>
          {AUDIO_SET && AUDIO_SET.has(item.id) && (
            <div style={{ fontSize: 11, color: T.textDim, marginTop: 8 }}>🎙 recorded Egyptian audio</div>
          )}
          <div style={{ fontSize: 10.5, color: T.textDim, marginTop: 6, fontFamily: "ui-monospace, Menlo, Consolas, monospace" }}>audio/{item.id}.mp3</div>
          <VoiceRecorder itemId={item.id} />
        </div>

        <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "20px 2px 10px" }}>How to type it · tap a letter</div>
        <LetterBreakdown ar={item.ar} onTap={(part) => setPeek(part)} />
        <div style={{ fontSize: 11.5, color: T.textDim, marginTop: 10, lineHeight: 1.5, textAlign: "center" }}>Reads right → left. Each letter shows the shape it takes in this word — tap one for its trace guide and practice.</div>

        <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "22px 2px 10px" }}>Remember it</div>
        <MnemonicCard item={item} />

        {marksInWord(item.ar).length > 0 && (
          <>
            <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "22px 2px 10px" }}>Marks in this word</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {marksInWord(item.ar).map((m, i) => <MarkCard key={i} mark={m} />)}
            </div>
          </>
        )}

        {exItems.length > 0 && (
          <>
            <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "22px 2px 10px" }}>Used in a sentence</div>
            <div style={{ fontSize: 11.5, color: T.textDim, margin: "0 2px 10px", lineHeight: 1.5 }}>
              Learn these the same way you learn anything else — once you tap Learn, a sentence joins your reviews and comes back on the normal SRS schedule.
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
              {exItems.map((ex) => <ExampleRow key={ex.id} ex={ex} onOpen={() => setPeekItem(ex)} />)}
            </div>
          </>
        )}

        <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "22px 2px 10px" }}>Now try it yourself</div>
        <TypeTry item={item} />

        <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "22px 2px 10px" }}>✍️ Try writing it</div>
        <WritePad text={item.ar} resetKey={item.id} />
        <div style={{ fontSize: 11.5, color: T.textDim, marginTop: 8, lineHeight: 1.5 }}>Trace over the faint word with your finger, right → left. Tap Clear to redo.</div>

        <ScriptPeek peek={peek} onClose={() => setPeek(null)} />
      </div>
      {peekItem && <ItemDetail item={peekItem} onClose={() => setPeekItem(null)} autoPlay={autoPlay} />}
    </div>,
    document.body
  );
}

/* ===================== HARAKAT (marks) LESSONS + QUIZ ===================== */
function HarakatLessons({ harakat = {}, onSetMark }) {
  const [phase, setPhase] = useState("menu");
  const all = HARAKAT_LIST.map((c) => HARAKAT[c]);
  const quizMarks = ["\u064E", "\u0650", "\u064F", "\u0652", "\u064B", "\u064D", "\u064C"].map((c) => HARAKAT[c]);
  const progOf = (ch) => markProg(harakat[ch]);
  const coreChars = ["\u064E", "\u0650", "\u064F", "\u0652", "\u064B", "\u064D", "\u064C"];
  const startedCount = coreChars.filter((c) => progOf(c)).length;
  const overallPct = Math.round(coreChars.reduce((s, c) => s + masteryPct(progOf(c)), 0) / coreChars.length);

  // SRS transitions for marks (stored in scriptState.harakat)
  const onLearn = (ch) => { if (onSetMark && !progOf(ch)) onSetMark(ch, learnItem(Date.now())); };

  if (phase === "learn") return <HarakatLearn marks={all} onDone={() => setPhase("menu")} onLearn={onLearn} />;
  if (phase === "quiz") return <HarakatQuiz marks={quizMarks} harakat={harakat} onDone={() => setPhase("menu")} onSet={onSetMark} />;

  return (
    <div className="fade" style={{ paddingTop: 4 }}>
      <div style={{ background: `linear-gradient(160deg, ${T.panelHi}, ${T.panel})`, border: `1px solid ${T.line}`, borderRadius: 20, padding: "18px 18px 16px", marginBottom: 14, boxShadow: "0 12px 30px rgba(128,29,92,.08)" }}>
        <div style={{ fontFamily: displayFont, fontSize: 21, color: T.gold }}>The marks (harakat)</div>
        <div style={{ fontSize: 12.5, color: T.textDim, marginTop: 4, lineHeight: 1.6 }}>
          Harakat are the little marks that show the short vowels and a few other sounds. Everyday Arabic usually leaves them out, but they're worth knowing — they appear in the Qurʼan, in children's books, in dictionaries, and whenever a word would otherwise be ambiguous.
        </div>
        <div style={{ margin: "14px 0 6px" }}><Bar pct={overallPct / 100} /></div>
        <div style={{ fontSize: 12, color: T.textDim }}>{startedCount} / {coreChars.length} marks started · {overallPct}% overall mastery</div>
      </div>

      <button className="tap" onClick={() => setPhase("learn")} style={{ width: "100%", padding: 15, borderRadius: 14, marginBottom: 10, background: `linear-gradient(135deg, ${T.gold}, ${T.terra})`, color: "#fff", fontSize: 15, fontWeight: 700, boxShadow: "0 8px 20px rgba(128,29,92,.18)", border: "none" }}>📖 Learn the marks</button>
      <button className="tap" onClick={() => setPhase("quiz")} style={{ width: "100%", padding: 14, borderRadius: 13, marginBottom: 16, border: `1px solid ${T.gold}`, background: `${T.gold}10`, color: T.gold, fontSize: 14, fontWeight: 700 }}>✨ Quiz the marks</button>

      <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, margin: "4px 2px 10px" }}>Quick reference · mastery</div>

        {all.map((m, i) => <MarkCard key={i} mark={m} prog={progOf(m.ch)} showMastery />)}
      </div>
    </div>
  );
}
