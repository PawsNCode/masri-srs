      if (legacy) { await recLoad(legacy); }
      const ids = await recKeys();
      s = { ...s, recordings: {}, recordingIds: ids };
      primeMyRecordings(ids);
      if (legacy) await saveState(s); // reclaim the space immediately

      applyTheme(s.settings.theme || "rose");
      if (mounted) setState(s);
    })();
    return () => { mounted = false; };
  }, []);

  useEffect(() => {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    return () => { if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = null; };
  }, []);

  const persist = useCallback((next) => { setState(next); saveState(next); }, []);
  const allItems = useMemo(() => {
    const base = [...ITEMS, ...((state && state.custom) || [])];
    const ed = (state && state.itemEdits) || {};
    const eff = base.map((it) => {
      const e = ed[it.id];
      if (!e) return it.az === undefined ? { ...it, az: toArabizi(it.ar, it.tr) } : it;
      const m = { ...it, ...e, edited: true };
      // Arabizi is derived, so a correction to the Arabic or the transliteration
      // rewrites it too — unless you typed your own Arabizi, which always wins.
      if (!e.az) m.az = toArabizi(m.ar, m.tr);
      return m;
    });
    // Apply per-level manual ordering (saved from the Items reorder mode)
    const ord = (state && state.itemOrder) || {};
    const byLevel = {};
    eff.forEach((it) => { (byLevel[it.level] = byLevel[it.level] || []).push(it); });
    const out = [];
    Object.keys(byLevel).map(Number).sort((a, b) => a - b).forEach((l) => {
      const list = byLevel[l];
      const order = ord[l];
      if (order && order.length) {
        const map = new Map(list.map((it) => [it.id, it]));
        order.forEach((id) => { if (map.has(id)) { out.push(map.get(id)); map.delete(id); } });
        list.forEach((it) => { if (map.has(it.id)) { out.push(it); map.delete(it.id); } });
      } else out.push(...list);
    });
    // Publish the edited list for live() — this runs during render, so every
    // child below (including a quiz holding a stale queue) reads fresh cards.
    LIVE_ITEMS = new Map(out.map((it) => [it.id, it]));
    return out;
  }, [state]);

  // Reorder items within a level (from Items reorder mode)
  const onReorderLevel = useCallback((level, ids) => {
    const s = stateRef.current;
    persist({ ...s, itemOrder: { ...(s.itemOrder || {}), [level]: ids } });
  }, [persist]);

  /* Bridge for components that are rendered in several places (item detail inside
     a quiz, the recorder, the verb example list) so they can reach app state
     without threading props through every level. Reassigned on each render. */
  REC_API = {
    pref: (id) => (stateRef.current && stateRef.current.voicePref ? stateRef.current.voicePref[id] || "original" : "original"),
    setPref: (id, v) => { const s = stateRef.current; persist({ ...s, voicePref: { ...(s.voicePref || {}), [id]: v } }); },
    editItem: (id, patch) => {
      const s = stateRef.current;
      const custIdx = (s.custom || []).findIndex((c) => c.id === id);
      if (custIdx >= 0) { const custom = s.custom.slice(); custom[custIdx] = { ...custom[custIdx], ...patch }; persist({ ...s, custom }); }
      else persist({ ...s, itemEdits: { ...(s.itemEdits || {}), [id]: { ...((s.itemEdits || {})[id] || {}), ...patch } } });
    },
    // Reset a card back to how it shipped.
    resetItem: (id) => {
      const s = stateRef.current;
      const e = { ...(s.itemEdits || {}) };
      delete e[id];
      persist({ ...s, itemEdits: e });
    },
    prog: (id) => (stateRef.current && stateRef.current.progress ? stateRef.current.progress[id] || null : null),
    learn: (id) => commitLearn(id),
    // The clip itself is in IndexedDB; state only remembers which ids have one.
    save: (id, url) => {
      MY_REC[id] = url;
      recPut(id, url).then(() => {
        const s = stateRef.current;
        const ids = Array.from(new Set([...(s.recordingIds || []), id]));
        persist({ ...s, recordingIds: ids });
      });
    },
    del: (id) => {
      delete MY_REC[id];
      recDel(id).then(() => {
        const s = stateRef.current;
        persist({ ...s, recordingIds: (s.recordingIds || []).filter((x) => x !== id) });
      });
    },
  };

  // Keep the speech engine in sync with settings, and cover user-added cards too.
  useEffect(() => {
    if (!state) return;
    SPEECH_PREFS.phonetic = state.settings.phonetic !== false;
    SPEECH_PREFS.voiceURI = state.settings.voiceURI || null;
    SPEECH_PREFS.recorded = state.settings.recorded !== false;
    (state.custom || []).forEach((it) => { if (it.ar && it.tr && it.tr !== "—") { SPEECH_BY_AR[it.ar] = it.tr; if (!(it.ar in AUDIO_ID_BY_AR)) AUDIO_ID_BY_AR[it.ar] = it.id; } });
    Object.entries(state.itemEdits || {}).forEach(([id, e]) => { if (e.ar) { if (e.tr || SPEECH_BY_AR[e.ar] === undefined) SPEECH_BY_AR[e.ar] = e.tr || ""; AUDIO_ID_BY_AR[e.ar] = id; } });
  }, [state]);

  // Which words have recorded audio (🎙)? Load the manifest written by split_audio.py.
  const [audioIds, setAudioIds] = useState(null);
  useEffect(() => {
    let alive = true;
    fetch("audio_manifest.json?v=" + Date.now())
      .then((r) => (r.ok ? r.json() : null))
      .then((list) => {
        if (!alive || !Array.isArray(list)) return;
        AUDIO_SET = new Set(list);
        setAudioIds(AUDIO_SET);
      })
      .catch(() => {});
    return () => { alive = false; };
  }, []);

  const derived = useMemo(() => {
    if (!state) return null;
    const now = Date.now();
    const lvl = state.currentLevel;
    const pool = allItems.filter((it) => (it.custom || it.level <= lvl) && !state.progress[it.id]);
    const due = allItems.filter((it) => { const p = state.progress[it.id]; return p && p.due !== Infinity && p.due <= now; });
    const leechList = allItems.filter((it) => isLeech(state.progress[it.id]));
    const levelItems = ITEMS.filter((it) => it.level === lvl);
    const guru = levelItems.filter((it) => (state.progress[it.id]?.stage || 0) >= 5).length;
    const levelPct = levelItems.length ? guru / levelItems.length : 0;
    const stageCounts = {};
    allItems.forEach((it) => { const p = state.progress[it.id]; if (!p) return; const g = stageMeta(p.stage).group; stageCounts[g] = (stageCounts[g] || 0) + 1; });
    return { pool, due, leechList, levelPct, stageCounts };
  }, [state, allItems]);

  const streak = useMemo(() => {
    if (!state) return 0;
    let n = 0, day = todayStr();
    if (!state.history[day]) day = shiftDay(day, -1);
    while (state.history[day] > 0) { n++; day = shiftDay(day, -1); }
    return n;
  }, [state]);

  const commitLearn = useCallback((id) => {
    setState((s) => {
      const day = todayStr();
      const daily = s.daily.date === day ? s.daily : { date: day, reviews: 0, lessons: 0 };
      const progress = { ...s.progress, [id]: learnItem(Date.now()) };
      const currentLevel = nextUnlockedLevel(progress, s.currentLevel); // unlock immediately when a level is fully learned
      const next = { ...s, progress, currentLevel, daily: { ...daily, lessons: daily.lessons + 1 } };
      saveState(next);
      return next;
    });
  }, []);

  const grade = useCallback((id, correct, mode) => {
    const s = stateRef.current;
    const prog = s.progress[id];
    if (!prog) return null;
    const now = Date.now();
    let cur = s.currentLevel;
    let leveled = null;
    let np;
    if (mode === "practice") {
      np = { ...prog, correct: prog.correct + (correct ? 1 : 0), wrong: prog.wrong + (correct ? 0 : 1), recentWrong: correct ? 0 : (prog.recentWrong || 0) + 1, lastReviewed: now };
    } else {
      np = reviewSchedule(prog, correct, now);
      const progress0 = { ...s.progress, [id]: np };
      const nl = nextUnlockedLevel(progress0, cur);
      if (nl > cur) { cur = nl; leveled = cur; }
    }
    const day = todayStr();
    const daily = s.daily.date === day ? s.daily : { date: day, reviews: 0, lessons: 0 };
    const next = {
      ...s,
      currentLevel: cur,
      progress: { ...s.progress, [id]: np },
      daily: { ...daily, reviews: daily.reviews + (mode === "practice" ? 0 : 1) },
      history: { ...s.history, [day]: (s.history[day] || 0) + 1 },
    };
    persist(next);
    return leveled;
  }, [persist]);

  // Every individual answer bumps a word's mastery run (consecutive correct), separate
  // from the once-per-session SRS grade above. Correct +1 (cap 100), a miss resets to 0.
  const bumpItemRun = useCallback((id, ok) => {
    const s = stateRef.current;
    const prog = s.progress[id];
    if (!prog) return;
    persist({ ...s, progress: { ...s.progress, [id]: bumpRun(prog, ok) } });
  }, [persist]);

  const [convCat, setConvCat] = useState(null);
  const [itemsFilter, setItemsFilter] = useState(null);
  useEffect(() => { if (view !== "items" && itemsFilter !== null) setItemsFilter(null); }, [view]);
  const startConvLearn = useCallback((l) => { setConvCat(l); setView("convlearn"); }, []);
  const startConvQuiz = useCallback((l) => {
    const s = stateRef.current;
    const items = allItems.filter((it) => it.level === l && s.progress[it.id]);
    if (items.length) { setPracticeItems(shuffle(items)); setView("practice"); }
  }, [allItems]);

  // Verbs: learning runs over the verb cards themselves; the quiz mixes the verbs
  // together with whichever of their example sentences you've picked up.
  const startVerbLearn = useCallback(() => setView("verblearn"), []);
  const startVerbQuiz = useCallback(() => {
    const s = stateRef.current;
    const verbs = allItems.filter((it) => isVerbLevel(it.level));
    const exIds = new Set(verbs.reduce((a, v) => a.concat(v.ex || []), []));
    const items = allItems.filter((it) => s.progress[it.id] && (isVerbLevel(it.level) || exIds.has(it.id)));
    if (items.length) { setPracticeItems(shuffle(items)); setView("practice"); }
  }, [allItems]);

  const startPractice = useCallback((itemsOrLeech) => {
    const items = itemsOrLeech === "leeches" ? (derived ? derived.leechList : []) : itemsOrLeech;
    if (items && items.length) { setPracticeItems(items); setView("practice"); }
  }, [derived]);

  const onTheme = useCallback((name) => {
    applyTheme(name);
    const s = stateRef.current;
    persist({ ...s, settings: { ...s.settings, theme: name } });
  }, [persist]);

  const onToggleCustom = useCallback((id) => {
    const s = stateRef.current;
    const cur = s.customItems || [];
    const adding = !cur.includes(id);
    const customItems = adding ? [...cur, id] : cur.filter((x) => x !== id);
    const patch = { ...s, customItems };
    // Starring an item immediately "unlocks" it: if it isn't learned yet, learn it now
    // so it's quizzable straight away (learned items are never shown as 🔒).
    if (adding && !s.progress[id]) {
      patch.progress = { ...s.progress, [id]: learnItem(Date.now()) };
    }
    persist(patch);
  }, [persist]);

  // Add every learned item at the chosen SRS mastery levels to the custom quiz.
  const onAddItemsToCustom = useCallback((ids) => {
    if (!ids || !ids.length) return;
    const s = stateRef.current;
    const cur = s.customItems || [];
    const customItems = Array.from(new Set([...cur, ...ids]));
    persist({ ...s, customItems });
  }, [persist]);

  const onClearCustom = useCallback(() => {
    const s = stateRef.current;
    persist({ ...s, customItems: [] });
  }, [persist]);

  const onImport = useCallback((obj) => {
    if (!obj || typeof obj !== "object") return false;
    const next = {
      ...DEFAULT_STATE,
      ...obj,
      settings: { ...DEFAULT_STATE.settings, ...(obj.settings || {}) },
      script: { ...DEFAULT_STATE.script, ...(obj.script || {}) },
      progress: obj.progress || {},
      custom: obj.custom || [],
      customItems: obj.customItems || [],
      customLetters: obj.customLetters || [],
      history: obj.history || {},
    };
    applyTheme(next.settings.theme || "rose");
    persist(next);
    return true;
  }, [persist]);

  const onCustomLetters = useCallback((arr) => {
    const s = stateRef.current;
    persist({ ...s, customLetters: arr });
  }, [persist]);

  const startCustomItems = useCallback(() => {
    const s = stateRef.current;
    const ids = s.customItems || [];
    const items = allItems.filter((it) => ids.includes(it.id));
    if (items.length) { setPracticeItems(items); setView("practice"); }
  }, [allItems]);

  const startLearnedQuiz = useCallback(() => {
    const s = stateRef.current;
    const items = shuffle(allItems.filter((it) => s.progress[it.id]));
    if (items.length) { setPracticeItems(items); setView("practice"); }
  }, [allItems]);

  const onQuizType = useCallback((t) => {
    const s = stateRef.current;
    persist({ ...s, settings: { ...s.settings, quizType: t } });
  }, [persist]);

  const dueLetters = useMemo(() => {
    if (!state) return 0;
    const sp = (state.script && state.script.progress) || {};
    const n = Date.now();
    return SCRIPT_FORMS.filter((t) => { const p = formProg(sp, t); return p && (p.due || 0) <= n; }).length;
  }, [state]);

  if (!state || !derived)
    return <div style={{ minHeight: "100vh", background: T.bg, color: T.textDim, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: uiFont }}>Loading…</div>;

  const dueWords = derived.due.filter((i) => i.type === "word");
  const duePhrases = derived.due.filter((i) => i.type === "phrase");
  const dueSentences = derived.due.filter((i) => i.type === "sentence");

  const tabs = [
    ["home", "Home"],
    ["lessons", "Lessons", derived.pool.length],
    ["reviews", "Reviews", derived.due.length + dueLetters],
    ["script", "Script"],
    ["items", "Items"],
    ["stats", "Stats"],
  ];

  return (
    <div style={{ minHeight: "100vh", background: `radial-gradient(1100px 560px at 50% -10%, ${T.bg2}, ${T.bg})`, color: T.text, fontFamily: uiFont, paddingBottom: 40 }}>
      <style>{`
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        @keyframes fadeUp { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform:none;} }
        @keyframes pop { from { opacity:0; transform: scale(.97);} to {opacity:1; transform:none;} }
        @keyframes pulse { 0%,100% { transform: translate(-50%,-50%) scale(1); opacity:1; } 50% { transform: translate(-50%,-50%) scale(1.55); opacity:.45; } }
        .tap { transition: transform .12s ease, background .15s ease, border-color .15s ease; cursor: pointer; }
        .tap:active { transform: scale(.97); }
        .fade { animation: fadeUp .35s ease both; }
        .pop { animation: pop .25s ease both; }
        input, button, select { font-family: inherit; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: ${T.line}; border-radius: 8px; }
      `}</style>

      <div style={{ maxWidth: 560, margin: "0 auto", padding: "22px 18px 10px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 38, height: 38, borderRadius: 11, background: `linear-gradient(135deg, ${T.gold}, ${T.terra})`, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: arFont, fontSize: 22, color: "#fff", fontWeight: 700, boxShadow: "0 4px 14px rgba(128,29,92,.22)" }}>ع</div>
          <div>
            <div style={{ fontFamily: displayFont, fontSize: 19 }}>Masri <span style={{ color: T.goldSoft }}>SRS</span></div>
            <div style={{ fontSize: 11.5, color: T.textDim, marginTop: -1 }}>Egyptian Arabic · level {state.currentLevel}</div>
          </div>
          <div style={{ marginLeft: "auto", textAlign: "right" }}>
            <div style={{ fontSize: 11, color: T.textDim }}>streak</div>
            <div style={{ fontSize: 16, color: T.gold, fontWeight: 700 }}>{streak}🔥</div>
          </div>
        </div>

        <div style={{ display: "flex", gap: 3, marginTop: 16, background: T.panel, padding: 4, borderRadius: 13, border: `1px solid ${T.line}` }}>
          {tabs.map(([k, label, n]) => (
            <button key={k} className="tap" onClick={() => setView(k)} style={{ flex: 1, border: "none", borderRadius: 9, padding: "9px 1px", fontSize: 11, fontWeight: 600, position: "relative", color: view === k ? "#fff" : T.textDim, background: view === k ? `linear-gradient(135deg, ${T.gold}, ${T.terra})` : "transparent" }}>
              {label}
              {n > 0 && view !== k && (<span style={{ position: "absolute", top: 5, right: "50%", marginRight: -16, width: 6, height: 6, borderRadius: 999, background: T.terra }} />)}
            </button>
          ))}
        </div>
      </div>

      <div style={{ maxWidth: 560, margin: "0 auto", padding: "8px 18px" }}>
        {view === "home" && (
          <HomeView
            state={state}
            level={state.currentLevel}
            levelPct={derived.levelPct}
            lessons={derived.pool.length}
            reviews={derived.due.length}
            leeches={derived.leechList.length}
            stageCounts={derived.stageCounts}
            streak={streak}
            onGo={setView}
            onTrouble={() => startPractice("leeches")}
            onSetting={(patch) => persist({ ...state, settings: { ...state.settings, ...patch } })}
            onTheme={onTheme}
            onImport={onImport}
            onReset={() => { persist({ ...DEFAULT_STATE, custom: state.custom, customItems: state.customItems, customLetters: state.customLetters, settings: state.settings, daily: { date: todayStr(), reviews: 0, lessons: 0 } }); setView("home"); }}
          />
        )}
        {view === "lessons" && (
          <LearnSession pool={derived.pool} batch={state.settings.lessonBatch} onLearn={commitLearn} onGrade={grade} onAnswer={bumpItemRun} onExit={() => setView("home")} learnedCount={allItems.filter((it) => state.progress[it.id]).length} onQuizLearned={startLearnedQuiz} customCount={(state.customItems || []).length} onCustom={startCustomItems} onGotoItems={() => setView("items")} onConv={() => setView("conv")} onVerbs={() => setView("verbs")} quizType={state.settings.quizType || "inapp"} onQuizType={onQuizType} autoPlay={state.settings.autoPlay !== false} />
        )}
        {view === "reviews" && (
          <ReviewsHub
            dueLetters={dueLetters}
            dueWords={dueWords}
            duePhrases={duePhrases}
            dueSentences={dueSentences}
            onLetters={() => { setScriptAuto(true); setView("script"); }}
            onVocab={(items) => { if (items.length) { setReviewRun(items); setView("reviewrun"); } }}
            onGotoItems={() => setView("items")}
            onGotoScript={() => { setScriptAuto(false); setView("script"); }}
          />
        )}
        {view === "reviewrun" && <TypedQuiz items={reviewRun} mode="srs" onGrade={grade} onAnswer={bumpItemRun} onExit={() => setView("reviews")} title="Reviews" quizType={state.settings.quizType || "inapp"} onQuizType={onQuizType} autoPlay={state.settings.autoPlay !== false} />}
        {view === "practice" && <TypedQuiz items={practiceItems} mode="practice" onGrade={grade} onAnswer={bumpItemRun} onExit={() => setView("items")} title="Practice" quizType={state.settings.quizType || "inapp"} onQuizType={onQuizType} autoPlay={state.settings.autoPlay !== false} />}
        {view === "script" && <ScriptView scriptState={state.script} setScript={(next) => persist({ ...state, script: next })} autoReview={scriptAuto} onAutoConsumed={() => setScriptAuto(false)} customLetters={state.customLetters || []} onCustomLetters={onCustomLetters} />}
        {view === "conv" && <ConvHub state={state} allItems={allItems} onBack={() => setView("lessons")} onLearn={startConvLearn} onQuiz={startConvQuiz} onItems={(l) => { setItemsFilter(l); setView("items"); }} />}
        {view === "verbs" && <VerbHub state={state} allItems={allItems} onBack={() => setView("lessons")} onLearn={startVerbLearn} onQuiz={startVerbQuiz} onOpenDetail={setDetailItem} onItems={() => { setItemsFilter("verbs"); setView("items"); }} />}
        {view === "verblearn" && (
          <LearnSession pool={allItems.filter((it) => isVerbLevel(it.level) && !state.progress[it.id])} batch={state.settings.lessonBatch} onLearn={commitLearn} onGrade={grade} onAnswer={bumpItemRun} onExit={() => setView("verbs")} autoStart={true} learnedCount={allItems.filter((it) => isVerbLevel(it.level) && state.progress[it.id]).length} onQuizLearned={startVerbQuiz} customCount={(state.customItems || []).length} onCustom={startCustomItems} onGotoItems={() => setView("items")} quizType={state.settings.quizType || "inapp"} onQuizType={onQuizType} autoPlay={state.settings.autoPlay !== false} />
        )}
        {view === "convlearn" && convCat && (
          <LearnSession pool={allItems.filter((it) => it.level === convCat && !state.progress[it.id])} batch={state.settings.lessonBatch} onLearn={commitLearn} onGrade={grade} onAnswer={bumpItemRun} onExit={() => setView("conv")} autoStart={true} learnedCount={allItems.filter((it) => it.level === convCat && state.progress[it.id]).length} onQuizLearned={() => startConvQuiz(convCat)} customCount={(state.customItems || []).length} onCustom={startCustomItems} onGotoItems={() => setView("items")} quizType={state.settings.quizType || "inapp"} onQuizType={onQuizType} autoPlay={state.settings.autoPlay !== false} />
        )}
        {view === "items" && (
          <ItemsView allItems={allItems} state={state} level={state.currentLevel} leeches={derived.leechList.length} onAdd={(c) => persist({ ...state, custom: [...state.custom, c] })} onStartPractice={startPractice} customItems={state.customItems || []} onToggleCustom={onToggleCustom} onStartCustom={startCustomItems} onClearCustom={onClearCustom} onAddByStage={onAddItemsToCustom} audioIds={audioIds} onReorder={onReorderLevel} initialFilter={itemsFilter} onOpenDetail={setDetailItem} />
        )}
        {view === "stats" && <StatsView state={state} allItems={allItems} level={state.currentLevel} streak={streak} />}
      </div>
      {detailItem && <ItemDetail item={detailItem} onClose={() => setDetailItem(null)} autoPlay={state.settings.autoPlay !== false} />}

      <div style={{ maxWidth: 560, margin: "0 auto", padding: "8px 18px calc(30px + env(safe-area-inset-bottom))" }}>
        <div style={{ marginTop: 16, background: T.panel, border: `1px solid ${T.line}`, borderRadius: 16, padding: "18px 18px 16px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
            <span style={{ fontSize: 20, lineHeight: 1 }}>🔄</span>
            <span style={{ fontSize: 16, fontWeight: 700, color: T.text }}>Refresh app</span>
          </div>
          <div style={{ fontSize: 12.5, color: T.textDim, marginTop: 9, lineHeight: 1.6 }}>
            Pull the latest version of the app. Use this after an update if your home-screen icon is showing an old version. Your progress, levels, custom quizzes, and settings are kept — this only refetches the app itself.
          </div>
          <button className="tap" onClick={hardRefresh} style={{ width: "100%", marginTop: 15, padding: "14px 16px", borderRadius: 12, border: "none", background: `linear-gradient(135deg, ${T.gold}, ${T.terra})`, color: "#fff", fontSize: 15, fontWeight: 700, boxShadow: "0 8px 20px rgba(128,29,92,.18)" }}>
            Refresh to latest version
          </button>
          <div style={{ fontSize: 11.5, color: T.textDim, textAlign: "center", marginTop: 12 }}>Version {APP_VERSION}</div>
          <div style={{ fontSize: 11.5, color: T.textDim, textAlign: "center", marginTop: 2 }}>App updated: {APP_UPDATED}</div>
          <LatestPush />
        </div>
        <div style={{ fontFamily: displayFont, fontSize: 14, color: T.goldSoft, textAlign: "center", marginTop: 14 }}>
          made by Niza
        </div>
      </div>
    </div>
  );
}

/* Free-form writing pad for whole words & phrases: a faint ghost of the text
   sits behind a drawable canvas, so you can trace it with a finger. */
function WritePad({ text, resetKey = 0 }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const last = useRef(null);
  const len = (text || "").replace(/\s/g, "").length;
  const ghostSize = len > 16 ? 48 : len > 11 ? 66 : len > 7 ? 88 : len > 4 ? 110 : 128;

  const setup = useCallback(() => {
    const c = canvasRef.current;
    if (!c) return;
    const rect = c.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    c.width = rect.width * dpr;
    c.height = rect.height * dpr;
    const ctx = c.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = 5;
    ctx.strokeStyle = T.gold;
  }, []);

  const clear = useCallback(() => {
    const c = canvasRef.current;
    if (!c) return;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
  }, []);

  useEffect(() => {
    setup();
    const onR = () => setup();
    window.addEventListener("resize", onR);
    return () => window.removeEventListener("resize", onR);
  }, [setup]);

  useEffect(() => { setup(); clear(); }, [text, resetKey, setup, clear]);

  const pos = (e) => {
    const c = canvasRef.current;
    const rect = c.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  };
  const start = (e) => { e.preventDefault(); drawing.current = true; last.current = pos(e); };
  const move = (e) => {
    if (!drawing.current) return;
    e.preventDefault();
    const ctx = canvasRef.current.getContext("2d");
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(last.current.x, last.current.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last.current = p;
  };
  const end = () => { drawing.current = false; };

  return (
    <div style={{ position: "relative", width: "100%", height: 220, background: T.panel, border: `1px solid ${T.line}`, borderRadius: 18, overflow: "hidden", boxShadow: "0 10px 28px rgba(128,29,92,.08)" }}>
      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: arFont, fontSize: ghostSize, color: T.textDim, opacity: 0.26, direction: "rtl", padding: "0 14px", lineHeight: 1.25, textAlign: "center", userSelect: "none", pointerEvents: "none" }}>{text}</div>
      <canvas
        ref={canvasRef}
        onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
        onTouchStart={start} onTouchMove={move} onTouchEnd={end}
        style={{ position: "absolute", inset: 0, width: "100%", height: "100%", touchAction: "none", cursor: "crosshair" }}
      />
      <button className="tap" onClick={clear} style={{ position: "absolute", bottom: 8, right: 8, border: `1px solid ${T.line}`, background: T.panelHi, color: T.textDim, borderRadius: 9, padding: "5px 11px", fontSize: 11.5, fontWeight: 600 }}>Clear</button>
    </div>
  );
}


/* ===================== SCRIPT TRAIN (learn + SRS quiz the alphabet) ===================== */
function makeLetterQ(answer) {
  const pool = shuffle(ALPHABET.filter((x) => x[2] !== answer[2])).slice(0, 3);
  return { answer, options: shuffle([answer, ...pool]) };
}
function letterMatch(typed, glyph) {
  const strip = (s) => (s || "").replace(/[\u064B-\u0652\u0640\u0670]/g, "").trim();
  const alef = (c) => (/[إأآا]/.test(c) ? "ا" : c);
  const t = strip(typed);
  if (t === glyph) return true;
  if (t.length === 1 && alef(t) === alef(glyph)) return true;
  return false;
}
// normalize letter progress (migrate old {learned} shape to SRS shape)
function normLP(p) {
  if (!p) return null;
  if (typeof p.stage === "number") return p;
  if (p.learned) return { stage: 1, due: 0, correct: p.correct || 0, wrong: p.wrong || 0, recentWrong: p.recentWrong || 0, run: p.run || 0, learnedAt: p.learnedAt || Date.now() };
  return null;
}

function ScriptTrain({ scriptState, setScript, autoReview, onAutoConsumed, customLetters, onCustomLetters }) {
  const cl = customLetters || [];
  const ss = scriptState || { progress: {}, best: 0, batch: 5 };
  const prog = ss.progress || {};
  const batch = ss.batch || 5;
  const quizDir = ss.quizDir || "recognize";
  const now = Date.now();

  const [mode, setMode] = useState("menu"); // menu | teach | quiz | done | select
  const [formFilter, setFormFilter] = useState("all"); // all | iso | ini | med | fin
  const [showKeys, setShowKeys] = useState(false); // in-app keyboard hidden until toggled on
  const [teachQueue, setTeachQueue] = useState([]);
  const [tIdx, setTIdx] = useState(0);
  const [quizSet, setQuizSet] = useState([]);
  const [initialSet, setInitialSet] = useState([]);
  const [initialLen, setInitialLen] = useState(0);
  const [quizSrs, setQuizSrs] = useState(false);
  const [step, setStep] = useState(0);
  const [sStreak, setSStreak] = useState({}); // shape key -> consecutive correct this session
  const [sMissed, setSMissed] = useState({}); // shape key -> ever missed this session
  const [q, setQ] = useState(null);
  const [picked, setPicked] = useState(null);
  const [typed, setTyped] = useState("");
  const [feedback, setFeedback] = useState(null);
  const [traceShown, setTraceShown] = useState(false);
  const [traceKey, setTraceKey] = useState(0);
  const [sess, setSess] = useState({ right: 0, total: 0, streak: 0, best: ss.best || 0 });
  const timer = useRef(null);
  useEffect(() => () => clearTimeout(timer.current), []);
  const didAuto = useRef(false);
  useEffect(() => {
    if (autoReview && !didAuto.current) {
      didAuto.current = true;
      if (dueArr.length) startQuiz(dueArr, true);
      if (onAutoConsumed) onAutoConsumed();
    }
    // eslint-disable-next-line
  }, [autoReview]);

  const fpOf = (t) => formProg(prog, t);
  const learnedForms = SCRIPT_FORMS.filter(fpOf);
  const dueArr = SCRIPT_FORMS.filter((t) => { const p = fpOf(t); return p && (p.due || 0) <= now; });
  const trouble = SCRIPT_FORMS.filter((t) => (fpOf(t)?.recentWrong || 0) >= 2);
  const mastered = SCRIPT_FORMS.filter((t) => (fpOf(t)?.stage || 0) >= 5);
  const unlearnedLetters = ALPHABET.filter((a) => !letterLearnedIn(prog, a[0]));
  const formsOfLetters = (rows) => SCRIPT_FORMS.filter((t) => rows.some((r) => r[0] === t[0]));
  const overallPct = SCRIPT_FORMS.length ? Math.round(SCRIPT_FORMS.reduce((s, t) => s + masteryPct(fpOf(t)), 0) / SCRIPT_FORMS.length) : 0;
  // Filter a list of shape tokens by the chosen positional form (form code lives in the key, e.g. "ب:med").
  const byForm = (list) => (formFilter === "all" ? list : list.filter((t) => t[5].split(":")[1] === formFilter));
  const formLabel = formFilter === "all" ? "shapes" : FORM_LABEL[formFilter];
  const dueF = byForm(dueArr);
  const learnedF = byForm(learnedForms);
  const troubleF = byForm(trouble);

  const saveProg = (key, np, newStreak) => {
    setScript({ ...ss, progress: { ...prog, [key]: np }, best: Math.max(ss.best || 0, newStreak || 0) });
  };
  const markLearnedLetter = (glyph) => {
    const add = {}; const t = Date.now();
    for (const f of distinctForms(glyph)) { const k = glyph + ":" + f; if (!prog[k]) add[k] = learnItem(t); }
    if (Object.keys(add).length) setScript({ ...ss, progress: { ...prog, ...add } });
  };
  const setBatch = (n) => setScript({ ...ss, batch: n });
  const setDir = (d) => setScript({ ...ss, quizDir: d });

  // Save a shape's progress: bump its mastery run on EVERY answer, and additionally
  // grade it into the SRS once, at graduation (a stumble still applies the 50% setback).
  const saveShape = (tok, ok, graduating, wasMissed) => {
    const cur = fpOf(tok) || learnItem(Date.now());
    let np = bumpRun(cur, ok);
    if (graduating) {
      np = quizSrs
        ? reviewSchedule(np, !wasMissed, Date.now())
        : { ...np, correct: np.correct + (!wasMissed ? 1 : 0), wrong: np.wrong + (!wasMissed ? 0 : 1), recentWrong: !wasMissed ? 0 : (np.recentWrong || 0) + 1 };
    }
    saveProg(tok[5], np, sess.best);
  };

  const startLearn = () => {
    const next = unlearnedLetters.slice(0, batch);
    if (!next.length) return;
    setTeachQueue(next);
    setTIdx(0);
    setMode("teach");
  };
  const startQuiz = (list, srs) => {
    if (!list.length) return;
    const set = shuffle(list).slice(0, 15);
    setQuizSet(set);
    setInitialSet(set);
    setInitialLen(set.length);
    setQuizSrs(!!srs);
    setSStreak({});
    setSMissed({});
    setStep(0);
    setPicked(null);
    setTyped("");
    setFeedback(null);
    setTraceShown(false);
    setTraceKey((k) => k + 1);
    setQ(makeLetterQ(set[0]));
    setSess({ right: 0, total: 0, streak: 0, best: ss.best || 0 });
    setMode("quiz");
  };
  const retakeQuiz = () => { if (initialSet.length) startQuiz(initialSet, quizSrs); };

  // The drill-to-mastery step: a shape leaves the session only after TWO correct in a
  // row; otherwise it rotates to the back to be retaken. The session ends only when
  // every shape has been cleared.
  const transition = (tok, ok) => {
    clearTimeout(timer.current);
    const key = tok[5];
    const newStreak = ok ? (sStreak[key] || 0) + 1 : 0;
    const wasMissed = sMissed[key] || !ok;
    setSess((s) => { const ns = ok ? s.streak + 1 : 0; return { right: s.right + (ok ? 1 : 0), total: s.total + 1, streak: ns, best: Math.max(s.best, ns) }; });
    setSStreak((m) => ({ ...m, [key]: newStreak }));
    if (!ok) setSMissed((m) => ({ ...m, [key]: true }));
    const graduating = newStreak >= 2;
    saveShape(tok, ok, graduating, wasMissed); // run every answer; SRS once at graduation
    let nq;
    if (graduating) { nq = quizSet.slice(1); }
    else { nq = [...quizSet.slice(1), tok]; }
    setPicked(null); setTyped(""); setFeedback(null); setTraceShown(false); setTraceKey((k) => k + 1); setStep((s) => s + 1);
    if (nq.length === 0) { setMode("done"); return; }
    setQuizSet(nq); setQ(makeLetterQ(nq[0]));
  };

  const choose = (opt) => {
    if (picked) return;
    const ans = q.answer;
    const ok = opt[2] === ans[2];
    speak(ans[0]);
    setPicked(opt);
    timer.current = setTimeout(() => transition(ans, ok), 950);
  };
  const checkType = () => {
    const ans = q.answer;
    if (feedback) { transition(ans, feedback === "correct"); return; }
    const ok = letterMatch(typed, ans[0]);
    speak(ans[0]);
    setFeedback(ok ? "correct" : "wrong");
  };
  const giveUpType = () => {
    if (feedback) return;
    speak(q.answer[0]);
    setFeedback("wrong");
  };
  const flipDir = () => { clearTimeout(timer.current); const order = ["recognize", "type", "trace"]; setDir(order[(order.indexOf(quizDir) + 1) % 3]); setPicked(null); setTyped(""); setFeedback(null); setTraceShown(false); setTraceKey((k) => k + 1); };

  // Tracing quiz: write from memory, reveal, then self-grade — same mastery loop.
  const gradeTrace = (ok) => { transition(q.answer, ok); };

  /* ===================== MENU ===================== */
  if (mode === "menu") {
    return (
      <div className="fade" style={{ paddingTop: 4 }}>
        <div style={{ background: `linear-gradient(160deg, ${T.panelHi}, ${T.panel})`, border: `1px solid ${T.line}`, borderRadius: 20, padding: "18px 18px 16px", marginBottom: 14, boxShadow: "0 12px 30px rgba(128,29,92,.08)" }}>
          <div style={{ fontFamily: displayFont, fontSize: 21, color: T.gold }}>Master the alphabet</div>
          <div style={{ fontSize: 12.5, color: T.textDim, marginTop: 3, lineHeight: 1.5 }}>
            Learn {batch} letters, quiz them, and they come back on a spaced schedule — just like the words.
          </div>
          <div style={{ fontSize: 12.5, color: T.textDim, marginTop: 3, lineHeight: 1.5 }}>
            Learn each letter, then quiz <b style={{ color: T.text }}>every shape</b> — isolated, initial, medial, final — on a spaced schedule, just like the words.
          </div>
          <div style={{ margin: "14px 0 6px" }}><Bar pct={learnedForms.length / SCRIPT_FORMS.length} /></div>
          <div style={{ fontSize: 12, color: T.textDim }}>{learnedForms.length} / {SCRIPT_FORMS.length} shapes learned · {mastered.length} mastered · {overallPct}% overall mastery</div>
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          <Stat label="Mastery" value={`${overallPct}%`} color={T.gold} />
          <Stat label="Shapes learned" value={learnedForms.length} color={T.terra} />
          <Stat label="Trouble" value={trouble.length} color={trouble.length ? T.red : T.textDim} />
        </div>

        {/* focus on a positional shape */}
        <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 0.6, color: T.goldSoft, margin: "2px 2px 7px" }}>Focus shape</div>
        <div style={{ display: "flex", gap: 5, background: T.panelHi, border: `1px solid ${T.line}`, padding: 4, borderRadius: 12, marginBottom: 14 }}>
          {[["all", "All"], ["iso", "Iso"], ["ini", "Init"], ["med", "Med"], ["fin", "Fin"]].map(([k, label]) => (
            <button key={k} className="tap" onClick={() => setFormFilter(k)} style={{ flex: 1, border: "none", borderRadius: 8, padding: "8px 2px", fontSize: 12, fontWeight: 700, color: formFilter === k ? "#fff" : T.textDim, background: formFilter === k ? `linear-gradient(135deg, ${T.gold}, ${T.terra})` : "transparent" }}>{label}</button>
          ))}
        </div>

        {/* SRS due reviews — primary */}
        <button className="tap" onClick={() => startQuiz(dueF, true)} disabled={!dueF.length} style={{ width: "100%", padding: 15, borderRadius: 14, marginBottom: 10, background: dueF.length ? `linear-gradient(135deg, ${T.gold}, ${T.terra})` : T.panel, color: dueF.length ? "#fff" : T.textDim, fontSize: 15, fontWeight: 700, boxShadow: dueF.length ? "0 8px 20px rgba(128,29,92,.18)" : "none", border: dueF.length ? "none" : `1px solid ${T.line}` }}>
          {dueF.length ? `Review due ${formLabel} (${dueF.length}) →` : `No ${formLabel} due for review`}
        </button>

        <button className="tap" onClick={startLearn} disabled={!unlearnedLetters.length} style={{ width: "100%", padding: 14, borderRadius: 13, marginBottom: 10, border: `1px solid ${unlearnedLetters.length ? T.gold : T.line}`, background: unlearnedLetters.length ? `${T.gold}10` : T.panel, color: unlearnedLetters.length ? T.gold : T.textDim, fontSize: 14, fontWeight: 700 }}>
          {unlearnedLetters.length ? `Learn next ${Math.min(batch, unlearnedLetters.length)} letters` : "All 28 letters learned 🎉"}
        </button>

        <button className="tap" onClick={() => setMode("select")} style={{ width: "100%", padding: 13, borderRadius: 13, marginBottom: 10, border: `1px solid ${T.line}`, background: T.panel, color: T.text, fontSize: 14, fontWeight: 700 }}>
          ★ Custom letter quiz {cl.length ? `(${cl.length})` : ""}
        </button>

        <button className="tap" onClick={() => startQuiz(learnedF, false)} disabled={!learnedF.length} style={{ width: "100%", padding: 13, borderRadius: 13, marginBottom: 10, border: `1px solid ${learnedF.length ? T.line : T.line}`, background: T.panel, color: learnedF.length ? T.text : T.textDim, fontSize: 14, fontWeight: 700 }}>
          ✨ Quiz all learned {formLabel} {formFilter === "all" ? "" : `(${learnedF.length})`}
        </button>

        <button className="tap" onClick={() => startQuiz(troubleF, false)} disabled={!troubleF.length} style={{ width: "100%", padding: 13, borderRadius: 13, border: `1px solid ${troubleF.length ? T.red : T.line}`, background: troubleF.length ? `${T.red}0f` : T.panel, color: troubleF.length ? T.red : T.textDim, fontSize: 14, fontWeight: 700 }}>
          🔁 Drill trouble {formLabel} {troubleF.length ? `(${troubleF.length})` : ""}
        </button>

        {/* settings */}
        <div style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 16, padding: 16, marginTop: 16 }}>
          <div style={{ fontSize: 12.5, color: T.textDim, marginBottom: 10 }}>Quiz style</div>
          <div style={{ display: "flex", gap: 6, marginBottom: 16, flexWrap: "wrap" }}>
            {[["recognize", "👀 Letter → sound"], ["type", "⌨️ Sound → type"], ["trace", "✍️ Sound → write"]].map(([k, label]) => (
              <button key={k} className="tap" onClick={() => setDir(k)} style={{ flex: "1 1 30%", border: "none", borderRadius: 10, padding: "10px 6px", fontSize: 11, fontWeight: 600, color: quizDir === k ? "#fff" : T.textDim, background: quizDir === k ? `linear-gradient(135deg, ${T.gold}, ${T.terra})` : T.panelHi }}>{label}</button>
            ))}
          </div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <span style={{ fontSize: 14 }}>Letters per learning batch</span>
            <div style={{ display: "flex", gap: 8 }}>
              {[3, 5, 7, 10].map((n) => (
                <button key={n} className="tap" onClick={() => setBatch(n)} style={{ border: `1px solid ${batch === n ? T.gold : T.line}`, background: batch === n ? `${T.gold}18` : "transparent", color: batch === n ? T.gold : T.textDim, borderRadius: 9, padding: "6px 11px", fontSize: 13, fontWeight: 600 }}>{n}</button>
              ))}
            </div>
          </div>
        </div>

        {trouble.length > 0 && (
          <div style={{ marginTop: 14, display: "flex", flexWrap: "wrap", gap: 6, justifyContent: "center" }}>
            {trouble.map((a) => (<span key={a[5]} title={a[1] + " · " + a[6]} style={{ display: "inline-flex", flexDirection: "column", alignItems: "center", color: T.red, border: `1px solid ${T.red}44`, borderRadius: 9, padding: "3px 10px", direction: "rtl" }}><span style={{ fontFamily: arFont, fontSize: 24 }}>{a[4]}</span><span style={{ fontFamily: uiFont, fontSize: 8, direction: "ltr", color: T.red, opacity: 0.8 }}>{a[6]}</span></span>))}
          </div>
        )}
      </div>
    );
  }

  /* ===================== SELECT LETTERS ===================== */
  if (mode === "select") {
    const isOn = (g) => cl.includes(g);
    const selList = ALPHABET.filter((a) => isOn(a[0]));
    const toggle = (g) => onCustomLetters(isOn(g) ? cl.filter((x) => x !== g) : [...cl, g]);
    return (
      <div className="fade">
        <div style={{ fontFamily: displayFont, fontSize: 19, marginBottom: 4 }}>Custom letter quiz</div>
        <div style={{ fontSize: 12.5, color: T.textDim, marginBottom: 12 }}>Tap any letter to add it — your picks are saved for next time.{formFilter !== "all" ? ` Quizzing the ${formLabel} shape only (set on the menu).` : ""}</div>
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          <button className="tap" onClick={() => onCustomLetters(ALPHABET.filter((a) => letterLearnedIn(prog, a[0])).map((a) => a[0]))} style={{ flex: 1, padding: 10, borderRadius: 11, border: `1px solid ${T.line}`, background: T.panel, color: T.text, fontSize: 12.5, fontWeight: 600 }}>Add all learned</button>
          <button className="tap" onClick={() => onCustomLetters([])} style={{ flex: 1, padding: 10, borderRadius: 11, border: `1px solid ${T.line}`, background: T.panel, color: T.textDim, fontSize: 12.5, fontWeight: 600 }}>Clear</button>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, paddingBottom: 80 }}>
          {ALPHABET.map((a) => {
            const on = isOn(a[0]);
            const seen = letterLearnedIn(prog, a[0]);
            return (
              <button key={a[0]} className="tap" onClick={() => toggle(a[0])} style={{ position: "relative", border: `1.5px solid ${on ? T.gold : T.line}`, background: on ? `${T.gold}14` : T.panel, borderRadius: 12, padding: "10px 4px", cursor: "pointer", textAlign: "center" }}>
                <div style={{ fontFamily: arFont, fontSize: 30, color: seen ? T.text : T.textDim, direction: "rtl", lineHeight: 1 }}>{a[0]}</div>
                <div style={{ fontSize: 10, color: on ? T.gold : T.textDim, marginTop: 3 }}>{a[2]}</div>
                {on && <div style={{ position: "absolute", top: 4, right: 6, fontSize: 11, color: T.gold }}>★</div>}
              </button>
            );
          })}
        </div>
        <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, padding: "12px 18px calc(12px + env(safe-area-inset-bottom))", background: `linear-gradient(180deg, transparent, ${T.bg} 30%)` }}>
          <div style={{ maxWidth: 560, margin: "0 auto", display: "flex", gap: 8 }}>
            <button className="tap" onClick={() => setMode("menu")} style={{ padding: "13px 16px", borderRadius: 13, border: `1px solid ${T.line}`, background: T.panel, color: T.textDim, fontWeight: 600, fontSize: 13 }}>Back</button>
            <button className="tap" onClick={() => startQuiz(byForm(formsOfLetters(selList)), false)} disabled={!selList.length} style={{ flex: 1, padding: "13px 16px", borderRadius: 13, border: "none", background: selList.length ? `linear-gradient(135deg, ${T.gold}, ${T.terra})` : T.line, color: selList.length ? "#fff" : T.textDim, fontWeight: 700, fontSize: 14 }}>★ Start quiz ({selList.length})</button>
          </div>
        </div>
      </div>
    );
  }

  /* ===================== TEACH ===================== */
  if (mode === "teach") {
    const a = teachQueue[tIdx];
    const f = letterForms(a[0]);
    const sk = STROKES[a[0]];
    return (
      <div className="fade">
        <div style={{ height: 4, background: T.line, borderRadius: 4, overflow: "hidden", marginBottom: 14 }}>
          <div style={{ height: "100%", width: `${(tIdx / teachQueue.length) * 100}%`, background: `linear-gradient(90deg, ${T.gold}, ${T.terra})` }} />
        </div>
        <div className="pop" key={a[0]} style={{ background: `linear-gradient(160deg, ${T.panelHi}, ${T.panel})`, border: `1px solid ${T.line}`, borderRadius: 22, padding: "26px 22px", textAlign: "center", boxShadow: "0 12px 34px rgba(128,29,92,.10)" }}>
          <div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft }}>New letter</div>
          <div style={{ fontFamily: arFont, fontSize: 88, color: T.text, direction: "rtl", lineHeight: 1.1, margin: "6px 0 4px" }}>{a[0]}</div>
          <div style={{ fontSize: 17, color: T.text }}>{a[1]} <span style={{ color: T.goldSoft, fontStyle: "italic" }}>· {a[2]}</span></div>
          <div style={{ fontSize: 13, color: T.textDim, marginTop: 4, lineHeight: 1.5 }}>{a[3]}</div>
          {sk && <div style={{ fontSize: 12.5, color: T.gold, marginTop: 6, lineHeight: 1.5 }}>✍️ {sk[1]}</div>}
          <div style={{ display: "flex", gap: 6, marginTop: 14 }}>
            {[["iso", f.iso], ["init", f.ini], ["med", f.med], ["fin", f.fin]].map(([k, glyph]) => (
              <div key={k} style={{ flex: 1, textAlign: "center", background: T.panel, border: `1px solid ${T.line}`, borderRadius: 9, padding: "8px 2px" }}>
                <div style={{ fontFamily: arFont, fontSize: 26, color: T.text, direction: "rtl", minHeight: 32 }}>{glyph}</div>
                <div style={{ fontSize: 9, color: T.textDim, marginTop: 3, textTransform: "uppercase", letterSpacing: 0.5 }}>{k}</div>
              </div>
            ))}
          </div>
          <div style={{ marginTop: 14 }}><Speaker text={a[0]} size={20} color={T.gold} /></div>
          <div style={{ marginTop: 16, borderTop: `1px dashed ${T.line}`, paddingTop: 14 }}>
            <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1, color: T.goldSoft, marginBottom: 8 }}>✍️ Now write it</div>
            <MiniTrace glyph={a[0]} guide={true} resetKey={tIdx} />
            <div style={{ fontSize: 11.5, color: T.textDim, marginTop: 8, lineHeight: 1.5 }}>Trace over the gray letter, right → left. Dots and hamzas go on last.</div>
          </div>
        </div>

/* ---- shuffle helper ---- */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeQuestion(qmode) {
  const answer = ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
  const pool = shuffle(ALPHABET.filter((x) => x[2] !== answer[2])).slice(0, 3);
  const options = shuffle([answer, ...pool]);
  const forms = distinctForms(answer[0]);
  const fcode = forms[Math.floor(Math.random() * forms.length)];
  return { answer, options, qmode, shape: letterForms(answer[0])[fcode], formLabel: FORM_LABEL[fcode] };
}

function ScriptQuiz() {
  // qmode: "l2s" show letter, pick sound | "s2l" show sound, pick letter
  const [dirMode, setDirMode] = useState("l2s");
  const [q, setQ] = useState(() => makeQuestion("l2s"));
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState({ right: 0, total: 0, streak: 0, best: 0 });

  const next = useCallback(
    (dm) => {
      setPicked(null);
      setQ(makeQuestion(dm || dirMode));
    },
    [dirMode]
  );

  const choose = (opt) => {
    if (picked) return;
    const correct = opt[2] === q.answer[2];
    speak(q.answer[0]);
    setPicked(opt);
    setScore((s) => {
      const streak = correct ? s.streak + 1 : 0;
      return {
        right: s.right + (correct ? 1 : 0),
        total: s.total + 1,
        streak,
        best: Math.max(s.best, streak),
      };
    });
    setTimeout(() => next(), 1100);
  };

  const acc = score.total ? Math.round((score.right / score.total) * 100) : 0;
  const showLetter = q.qmode === "l2s";

  return (
    <div className="fade">
      {/* scoreboard */}
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        <Stat label="Score" value={`${score.right}/${score.total}`} color={T.gold} />
        <Stat label="Accuracy" value={`${acc}%`} color={T.terra} />
        <Stat label="Streak" value={`${score.streak}🔥`} color={T.amber} />
        <Stat label="Best" value={score.best} color={T.green} />
      </div>

      {/* direction toggle */}
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 16 }}>
        <button
          className="tap"
          onClick={() => {
            const dm = dirMode === "l2s" ? "s2l" : "l2s";
            setDirMode(dm);
            next(dm);
          }}
          style={{
            border: `1px solid ${T.line}`,
            background: T.panelHi,
            color: T.gold,
            borderRadius: 20,
            padding: "7px 14px",
            fontSize: 12.5,
            fontWeight: 600,
          }}
        >
          {dirMode === "l2s" ? "See letter → pick sound" : "See sound → pick letter"} ⇄
        </button>
      </div>

      {/* prompt */}
      <div
        className="pop"
        key={q.answer[1] + q.qmode}
        style={{
          background: `linear-gradient(160deg, ${T.panelHi}, ${T.panel})`,
          border: `1px solid ${T.line}`,
          borderRadius: 22,
          padding: "30px 20px",
          textAlign: "center",
          boxShadow: "0 14px 36px rgba(128,29,92,.10)",

      >
        <div style={{ fontSize: 12, color: T.textDim, marginBottom: 10 }}>
          {showLetter ? <>Which sound is this <b style={{ color: T.goldSoft }}>{q.formLabel}</b> shape?</> : "Which letter makes this sound?"}
        </div>
        {showLetter ? (
          <div style={{ fontFamily: arFont, fontSize: 84, color: T.text, direction: "rtl", lineHeight: 1 }}>
            {q.shape}
          </div>
        ) : (
          <div style={{ fontFamily: displayFont, fontSize: 40, color: T.gold }}>
            {q.answer[2]}
          </div>
        )}
        <div style={{ marginTop: 14 }}>
          <Speaker text={q.answer[0]} size={18} color={T.terra} />
        </div>
      </div>

      {/* options */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        {q.options.map((opt, i) => {
          let bg = T.panel,
            border = T.line,

          if (picked) {
            const isCorrect = opt[2] === q.answer[2];

            if (isCorrect) {

              border = OK_GREEN;
              col = OK_GREEN;

              bg = `${BAD_RED}1a`;
              border = BAD_RED;

              }}
